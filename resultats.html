<style>
:root{--n:#141414;--gris:#6B6B6B;--fond:#F3F3F3}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--n);font-family:'Scoutie Sans',Helvetica,Arial,sans-serif;font-size:18px;line-height:1.3}
main{max-width:1040px;margin:0 auto;padding:28px 22px 80px}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1F6FE0;outline-offset:3px}
header{display:flex;align-items:center;gap:14px}
header svg{width:64px;flex:none}
header b{font-size:26px;line-height:.86;font-weight:800;letter-spacing:-.05em;flex:1}
header a{font-weight:700}
h1{margin:30px 0 0;font-size:clamp(44px,8vw,84px);line-height:.9;font-weight:800;letter-spacing:-.05em}
.maj{color:var(--gris);font-size:15px;margin:10px 0 0}
.outils{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.btn{display:inline-flex;align-items:center;background:var(--n);color:#fff;font-weight:800;text-decoration:none;border:0;border-radius:99px;padding:10px 20px;min-height:44px;cursor:pointer}
.btn.clair,.choix button{background:var(--fond);color:var(--n)}
.choix{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.choix button{font-weight:700;border:0;cursor:pointer;border-radius:99px;padding:10px 18px;min-height:44px}
.choix button[aria-pressed=true]{background:var(--n);color:#fff}
.reglages{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.reglages label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:15px}
.reglages input,.reglages select{background:var(--fond);border:0;border-radius:14px;padding:11px 14px;min-height:46px;font-weight:400;font-size:17px;width:100%}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
.chiffres div{font-size:16px;font-weight:700}
.chiffres b{display:block;font-size:clamp(46px,9vw,92px);line-height:.9;font-weight:800;letter-spacing:-.05em}
section{margin-top:60px}
h2{display:flex;align-items:center;gap:14px;margin:0;font-size:clamp(28px,4.4vw,44px);line-height:1;font-weight:800;letter-spacing:-.04em}
h2 i{width:.9em;height:.9em;border-radius:50%;background:var(--c);flex:none}
h2+p{margin:8px 0 0;color:var(--gris)}
.retenir{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:22px}
.retenir div{background:var(--fond);border-radius:22px;padding:18px 20px;font-size:16px}
.retenir small{display:block;font-weight:800;font-size:14px;color:var(--gris)}
.retenir b{display:block;font-size:34px;line-height:1;font-weight:800;letter-spacing:-.04em;margin:6px 0}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:34px 44px;margin-top:28px}
article{break-inside:avoid}
article h3{margin:0;font-size:22px;line-height:1.12;font-weight:800;letter-spacing:-.02em}
article .n{color:var(--gris);font-size:15px;margin:4px 0 12px}
.moy{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:8px 0 12px}
.moy small{font-size:16px;font-weight:700;letter-spacing:0}
.barre{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;margin-top:8px;font-size:16px}
.barre span{overflow-wrap:anywhere}
.barre b{font-weight:800;white-space:nowrap}
.piste{grid-column:1/-1;height:14px;border-radius:7px;background:var(--fond);overflow:hidden}
.piste i{display:block;height:100%;border-radius:7px;background:var(--c);transition:width .8s cubic-bezier(.45,0,.2,1)}
.piste.autre{height:8px;margin-top:2px}.piste.autre i{background:var(--n)}
.barre.zero{color:var(--gris)}
.barre.bon span{font-weight:800}
.legende{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;font-weight:700;margin-top:16px}
.legende i{display:inline-block;width:1.6em;height:.7em;border-radius:99px;background:var(--n);margin-right:6px;vertical-align:middle}
.legende i.a{background:linear-gradient(90deg,#F5A0C6,#F7C33B,#1F6FE0)}
.colonnes{display:flex;align-items:flex-end;gap:3px;height:190px;margin-top:24px;border-bottom:2px solid var(--n)}
.colonnes i{flex:1;min-width:2px;min-height:3px;border-radius:5px 5px 0 0}
.rangs{max-width:780px;margin-top:14px}
.duel{margin-top:16px;max-width:780px;font-size:16px}
.duel div{display:grid;grid-template-columns:5.2em 1fr 5.2em;gap:10px;align-items:center;font-weight:800;margin-top:4px}
.duel div span:last-child{text-align:right}
.duel .piste{grid-column:auto;background:#1F6FE0}.duel .piste i{background:#F5A0C6;border-radius:7px 0 0 7px}
.aff{display:grid;grid-template-columns:minmax(90px,150px) 1fr;gap:20px;margin-top:30px;max-width:820px;break-inside:avoid}
.aff img{width:100%;border-radius:10px;background:var(--fond)}
.aff h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.vide{margin-top:40px;font-size:22px;font-weight:700}
.bornes{display:flex;justify-content:space-between;color:var(--gris);font-size:14px;margin-top:6px}
@media (max-width:520px){.chiffres{gap:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.outils,.choix,.reglages,header a{display:none!important}main{padding:0}section{margin-top:30px}}
</style>
</head>
<body>
<main>
<header><svg viewBox="0 0 120 112" aria-hidden="true"><circle cx="44" cy="46" r="40" fill="#F5A0C6" style="mix-blend-mode:multiply"/><circle cx="86" cy="38" r="28" fill="#F7C33B" style="mix-blend-mode:multiply"/><circle cx="74" cy="78" r="22" fill="#1F6FE0" style="mix-blend-mode:multiply"/><circle cx="22" cy="36" r="3.4" fill="#141414"/><circle cx="34" cy="34" r="3.4" fill="#141414"/><circle cx="93" cy="24" r="2.7" fill="#141414"/><circle cx="103" cy="26" r="2.7" fill="#141414"/><circle cx="73" cy="91" r="2.2" fill="#141414"/><circle cx="81" cy="91" r="2.2" fill="#141414"/></svg><b>Points<br>de vue</b><a href="./" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="1.35em" height="1.35em" fill="currentColor" aria-hidden="true" style="vertical-align:-.3em"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg></a></header>
<h1>Étudier les données</h1>
<p class="maj" id="maj">Chargement…</p>
<div class="outils">
  <a class="btn" href="https://docs.google.com/spreadsheets/d/14uvOfNQwjgMOH83hJhnWea9Df3Cidhhs4rUefRrQ2wk" target="_blank" rel="noopener">Ouvrir le Google Sheet</a>
</div>
<div class="choix" id="choix" role="group" aria-label="Choisir une séance"></div>
<div class="reglages">
  <label>Comparer avec<select id="comparer"><option value="">Aucune comparaison</option></select></label>
  <label>Chercher une question<input type="search" id="chercher" placeholder="Un mot de la question"></label>
  <label>Ranger les questions<select id="tri"><option value="">Dans l'ordre de la séance</option><option value="fort">Les plus unanimes d'abord</option><option value="faible">Les plus partagées d'abord</option></select></label>
</div>
<div class="choix" id="mode" role="group" aria-label="Choisir l'affichage"><button data-m="" aria-pressed="true">Question par question</button><button data-m="g" aria-pressed="false">En graphiques</button></div>
<div id="vue"></div>
</main>
<script src="seance.js"></script>
<script>
// Étude des données : lit les totaux anonymes calculés par le script Google (jamais de prénom, jamais de ligne individuelle)
// et les présente dans l'ordre de la séance (seance.txt). Outils : choix d'une séance, comparaison de deux séances,
// points à retenir calculés, recherche, tri par accord. Mise à jour toutes les 20 secondes.
const SOURCE = 'https://script.google.com/macros/s/AKfycbzPof8sEj8tZLlA-MtVDYyODv32y8lXxc9hLVmaW5zCvHLilyRIxpk4Ix6TPhzJczjn/exec?vue=resultats';
const COUL = { 'Étape 1': '#F5A0C6', 'Étape 2': '#F7C33B', 'Étape 3': '#1F6FE0' };
const h = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/ ([?!:;»])/g, '&nbsp;$1').replace(/« /g, '«&nbsp;');
const fr = (x, d = 1) => x.toFixed(d).replace('.', ','), pc = x => Math.round(x * 100) + ' %';
const $ = id => document.getElementById(id), plat = x => x.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
let D = null, mode = '', seance = new URLSearchParams(location.search).get('seance') || '';

// les totaux d'une séance ('' = toutes) : par question, le nombre de répondants, le détail des réponses, la moyenne des notes
function totaux(code) {
  const garde = l => !code || l[0] === code, T = { compte: {}, rep: {}, notes: {}, groupe: {}, ordre: [] };
  D.lignes.filter(garde).forEach(([, g, q, r, n]) => { (T.compte[q] = T.compte[q] || {})[r] = ((T.compte[q] || {})[r] || 0) + n; if (!(q in T.groupe)) { T.groupe[q] = g; T.ordre.push(q); } });
  D.repondants.filter(garde).forEach(([, , q, n]) => T.rep[q] = (T.rep[q] || 0) + n);
  D.notes.filter(garde).forEach(([, , q, s, n]) => { const x = T.notes[q] = T.notes[q] || [0, 0]; x[0] += s; x[1] += n; });
  return T;
}
const accord = (T, q) => T.rep[q] ? Math.max(0, ...Object.values(T.compte[q] || {})) / T.rep[q] : 0; // part de la réponse la plus donnée

function dessiner() {
  if (!D) return;
  const codes = Object.keys(D.seances).sort();
  if (seance && !D.seances[seance]) seance = '';
  $('choix').innerHTML = [['', 'Toutes les séances'], ...codes.map(c => [c, 'Séance ' + c])].map(([c, nom]) => `<button data-s="${h(c)}" aria-pressed="${c === seance}">${h(nom)}</button>`).join('');
  const autre = $('comparer').value;
  $('comparer').innerHTML = '<option value="">Aucune comparaison</option>' + codes.filter(c => c !== seance).map(c => `<option value="${h(c)}" ${c === autre ? 'selected' : ''}>Séance ${h(c)}</option>`).join('');
  const T = totaux(seance), U = $('comparer').value ? totaux($('comparer').value) : null, mot = plat($('chercher').value.trim()), tri = $('tri').value;
  const gens = codes.filter(c => !seance || c === seance).reduce((a, c) => a + D.seances[c], 0), total = Object.values(T.rep).reduce((a, n) => a + n, 0);
  if (!total) { $('vue').innerHTML = `<p class="vide">Pas encore de réponses. Cette page se met à jour toute seule pendant la séance.</p>`; return; }

  const carte = (g, q, opts, bon, bornes) => { // une question : ses réponses en barres, dans l'ordre du questionnaire
    const c = T.compte[q] || {}, n = T.rep[q] || 0, liste = opts || Object.keys(c).sort((a, b) => c[b] - c[a]), nt = T.notes[q], cu = U && U.compte[q] || {}, nu = U && U.rep[q] || 0, ntu = U && U.notes[q], oubli = [];
    return `<article><h3>${h(q)}</h3><p class="n">${n} réponse${n > 1 ? 's' : ''}${U ? ` · ${nu} dans l'autre séance` : ''}</p>${nt ? `<div class="moy">${fr(nt[0] / nt[1])} <small>sur 5 en moyenne${ntu ? ` · ${fr(ntu[0] / ntu[1])} dans l'autre séance` : ''}</small></div>` : ''}`
      + liste.map((o, i) => { const k = c[o] || 0, p = n ? k / n : 0, pu = nu ? (cu[o] || 0) / nu : 0;
        if (!k && !nt && i !== bon && !cu[o]) { oubli.push(o); return ''; } // personne ne l'a choisie : citée en une ligne, sans barre
        return `<div class="barre${k ? '' : ' zero'}${i === bon ? ' bon' : ''}"><span>${h(o)}${i === bon ? ' (bonne réponse)' : ''}</span><b>${k} · ${pc(p)}${U ? ' / ' + pc(pu) : ''}</b><div class="piste"><i style="width:${p * 100}%${bon != null && i !== bon ? ';background:#BDBDBD' : ''}"></i></div>${U ? `<div class="piste autre"><i style="width:${pu * 100}%"></i></div>` : ''}</div>`; }).join('')
      + (oubli.length ? `<p class="n" style="margin:10px 0 0">Personne n'a choisi : ${h(oubli.join(', '))}.</p>` : '')
      + (bornes ? `<div class="bornes"><span>1 = ${h(bornes[0])}</span><span>5 = ${h(bornes[1])}</span></div>` : '') + `</article>`;
  };
  // les questions de la séance, dans l'ordre de seance.txt ; puis celles de l'atelier et celles qui ne sont plus dans la séance
  const vues = new Set(), blocs = {}, Q = ETAPES.filter(e => e.id && e.t !== 'vote' && T.rep[e.q]);
  const ranger = (g, q, html) => { if (!mot || plat(q).includes(mot)) (blocs[g] = blocs[g] || []).push([accord(T, q), html]); };
  Q.forEach(e => { vues.add(e.q); const g = e.p ? 'Étape ' + e.p : "Jeu de l'œil";
    ranger(g, e.q, carte(g, e.q, e.t === 'echelle' ? e.o.map(x => x + ' sur 5') : e.o, e.bon, e.t === 'echelle' ? [e.a, e.b] : null)); });
  T.ordre.filter(q => !vues.has(q)).forEach(q => { const g = T.groupe[q] === 'Atelier' ? 'Atelier' : 'Autres questions'; ranger(g, q, carte(g, q, T.notes[q] ? ['1', '2', '3', '4', '5'].map(x => x + ' sur 5') : null)); });
  if (tri) Object.values(blocs).forEach(b => b.sort((x, y) => tri === 'fort' ? y[0] - x[0] : x[0] - y[0]));

  // ---------- à retenir : quelques constats calculés sur la sélection ----------
  const R = [], ajoute = (titre, valeur, texte) => R.push(`<div><small>${h(titre)}</small><b>${h(valeur)}</b>${h(texte)}</div>`);
  const jeux = Q.filter(e => e.bon != null).map(e => [((T.compte[e.q] || {})[e.o[e.bon]] || 0) / T.rep[e.q], e.q]).sort((a, b) => b[0] - a[0]);
  if (jeux.length) ajoute("L'information la mieux retenue", pc(jeux[0][0]) + ' de bonnes réponses', jeux[0][1]);
  if (jeux.length > 1) ajoute("L'information la moins retenue", pc(jeux[jeux.length - 1][0]) + ' de bonnes réponses', jeux[jeux.length - 1][1]);
  const notes = Q.filter(e => e.t === 'echelle' && T.notes[e.q]).map(e => [T.notes[e.q][0] / T.notes[e.q][1], e.q]).sort((a, b) => b[0] - a[0]);
  if (notes.length) ajoute('La meilleure note', fr(notes[0][0]) + ' sur 5', notes[0][1]);
  if (notes.length > 1) ajoute('La note la plus basse', fr(notes[notes.length - 1][0]) + ' sur 5', notes[notes.length - 1][1]);
  // les comparaisons A / B : seulement les trois préférences les plus nettes
  Q.filter(e => e.t === 'ab').map(e => { const c = T.compte[e.q] || {}, x = c.A || 0, y = c.B || 0; return [Math.abs(x - y) / T.rep[e.q], x > y ? 'A' : 'B', Math.max(x, y) / T.rep[e.q], e]; })
    .filter(x => x[0] > 0).sort((x, y) => y[0] - x[0]).slice(0, 3).forEach(([, g, part, e]) => ajoute('Préférence nette entre A et B', g + ' choisie à ' + pc(part), e.q + (e.note ? ' (' + e.note + ')' : '')));
  const partage = Q.filter(e => e.t === 'choix' && e.bon == null && T.rep[e.q] > 2).map(e => [accord(T, e.q), e.q]).sort((a, b) => a[0] - b[0])[0];
  if (partage) ajoute('La question qui divise le plus', pc(partage[0]) + ' pour la réponse en tête', partage[1]);
  const aff = {}; T.ordre.filter(q => T.groupe[q] === 'Atelier' && T.notes[q]).forEach(q => { const k = q.split(' : ')[0], x = aff[k] = aff[k] || [0, 0]; x[0] += T.notes[q][0]; x[1] += T.notes[q][1]; });
  const mieux = Object.entries(aff).map(([k, x]) => [x[0] / x[1], k]).sort((a, b) => b[0] - a[0])[0];
  if (mieux) ajoute("L'affiche de binôme la mieux notée", fr(mieux[0]) + ' sur 5', mieux[1] + ', toutes notes confondues');

  // ---------- les graphiques : la même sélection, vue d'ensemble ----------
  if (mode) {
    const G = [], ok = q => !mot || plat(q).includes(mot), Qm = Q.filter(e => ok(e.q)), coul = g => COUL[g] || '#141414';
    const bloc = (titre, texte, html) => html && G.push(`<section style="--c:#141414"><h2><i></i>${h(titre)}</h2><p>${h(texte)}</p>${html}</section>`);
    const rang = (nom, part, val, c) => `<div class="barre"><span>${h(nom)}</span><b>${h(val)}</b><div class="piste"><i style="width:${part * 100}%;background:${c}"></i></div></div>`;
    const rangs = L => L.length ? `<div class="rangs">${L.join('')}</div>` : '';
    // une affiche = les questions qui la montrent, plus celles qui commencent par son nom
    const nomA = x => x.split('/').pop().replace(/\.[^.]+$/, ''), A = {}, court = (q, k) => q.startsWith(k + ' : ') ? q.slice(k.length + 3).replace(/^./, c => c.toUpperCase()) : q;
    const de = e => e.t === 'ab' ? '' : e.img || (e.imgs || [])[0] || ''; // l'affiche montrée avec la question
    Qm.filter(de).forEach(e => (A[nomA(de(e))] = A[nomA(de(e))] || { img: de(e), Q: [] }).Q.push(e));
    Qm.filter(e => !de(e) && e.t !== 'ab' && A[e.q.split(' : ')[0]]).forEach(e => A[e.q.split(' : ')[0]].Q.push(e));
    const fiches = Object.entries(A).map(([k, a]) => { const N = a.Q.filter(e => T.notes[e.q]), s = N.reduce((x, e) => [x[0] + T.notes[e.q][0], x[1] + T.notes[e.q][1]], [0, 0]); return [s[1] ? s[0] / s[1] : 0, k, a, N]; }).sort((x, y) => y[0] - x[0]);
    bloc('Affiche par affiche', "Chaque affiche testée, de la mieux notée à la moins bien notée, avec le détail de ses notes et la réponse la plus donnée à chaque question.",
      fiches.map(([m, k, a, N]) => `<div class="aff"><img src="${h(a.img)}" alt="" loading="lazy"><div><h3>${h(k)}</h3>${m ? `<div class="moy">${fr(m)} <small>sur 5, toutes notes confondues</small></div>` : ''}`
        + N.map(e => { const x = T.notes[e.q][0] / T.notes[e.q][1]; return rang(court(e.q, k), (x - 1) / 4, fr(x) + ' sur 5', coul(e.p ? 'Étape ' + e.p : '')); }).join('')
        + a.Q.filter(e => !T.notes[e.q] && e.t !== 'texte').map(e => { const c = T.compte[e.q] || {}, tete = Object.keys(c).sort((x, y) => c[y] - c[x])[0]; return `<p class="n" style="margin:10px 0 0">${h(court(e.q, k))} <b style="color:var(--n)">${h(tete)}</b> (${pc(Math.min(1, accord(T, e.q)))})</p>`; }).join('')
        + `</div></div>`).join(''));
    const max = Math.max(1, ...Qm.map(e => T.rep[e.q]));
    bloc('La participation, question après question', "Une colonne par question, dans l'ordre de la séance. Plus elle est haute, plus il y a eu de réponses : une baisse montre où le groupe décroche.",
      Qm.length > 1 ? `<div class="colonnes" role="img" aria-label="Nombre de réponses par question, de ${Math.min(...Qm.map(e => T.rep[e.q]))} à ${max}">${Qm.map(e => `<i title="${h(e.q)} : ${T.rep[e.q]}" style="height:${T.rep[e.q] / max * 100}%;background:${coul(e.p ? 'Étape ' + e.p : '')}"></i>`).join('')}</div>
        <div class="bornes"><span>Début</span><span>Colonne la plus haute : ${max} réponse${max > 1 ? 's' : ''}</span><span>Fin</span></div>
        <div class="legende">${[['', "Jeu de l'œil"], ['Étape 1', PHASES[1].nom], ['Étape 2', PHASES[2].nom], ['Étape 3', PHASES[3].nom]].map(([g, nom]) => `<span><i style="background:${coul(g)}"></i>${h(nom)}</span>`).join('')}</div>` : '');
    bloc('Ce que le regard a retenu', "Le jeu de l'œil : la part de bonnes réponses après 5 secondes devant l'affiche, de la mieux retenue à la moins retenue.",
      rangs(jeux.filter(x => ok(x[1])).map(([p, q]) => rang(q, p, pc(p), '#141414'))));
    bloc('Toutes les notes, de la meilleure à la plus basse', 'La moyenne de chaque note de 1 à 5. La barre est pleine à 5 et vide à 1.',
      rangs(T.ordre.filter(q => T.notes[q] && ok(q)).map(q => [T.notes[q][0] / T.notes[q][1], q]).sort((a, b) => b[0] - a[0]).map(([m, q]) => rang(q, (m - 1) / 4, fr(m) + ' sur 5', coul(T.groupe[q])))));
    bloc('A ou B : qui gagne', "Chaque ligne est une comparaison de deux affiches. Le rose est la part de A, le bleu la part de B.",
      Qm.filter(e => e.t === 'ab').map(e => { const c = T.compte[e.q] || {}, a = c.A || 0, b = c.B || 0, t = a + b || 1;
        return `<div class="duel"><span>${h(e.q)}${e.note ? ' (' + h(e.note) + ')' : ''}</span><div><span>A · ${pc(a / t)}</span><div class="piste"><i style="width:${a / t * 100}%"></i></div><span>B · ${pc(b / t)}</span></div></div>`; }).join(''));
    bloc("D'accord ou partagés", "Pour chaque question à choix, la part de la réponse la plus donnée. Une barre longue : le groupe est d'accord. Une barre courte : les avis sont partagés.",
      rangs(Qm.filter(e => (e.t === 'choix' || e.t === 'multi') && e.bon == null).map(e => [accord(T, e.q), e]).sort((a, b) => b[0] - a[0]).map(([p, e]) => {
        const c = T.compte[e.q] || {}, tete = Object.keys(c).sort((a, b) => c[b] - c[a])[0];
        return rang(e.q + ' → ' + tete, Math.min(1, p), pc(Math.min(1, p)), coul('Étape ' + e.p)); })));
    $('vue').innerHTML = `<div class="chiffres"><div><b>${gens}</b>participant${gens > 1 ? 's' : ''}</div><div><b>${seance ? 1 : codes.length}</b>séance${!seance && codes.length > 1 ? 's' : ''}</div><div><b>${total}</b>réponse${total > 1 ? 's' : ''}</div></div>`
      + (G.join('') || `<p class="vide">Pas encore assez de réponses pour tracer un graphique.</p>`);
    return;
  }
  const titres = { "Jeu de l'œil": ["Le jeu de l'œil", 'Une affiche vue 5 secondes, puis des questions précises.'], 'Étape 1': [PHASES[1].nom, PHASES[1].quoi], 'Étape 2': [PHASES[2].nom, PHASES[2].quoi], 'Étape 3': [PHASES[3].nom, PHASES[3].quoi], Atelier: ["L'atelier", 'Les affiches fabriquées en binômes, notées par la salle.'], 'Autres questions': ['Autres questions', 'Des questions qui ne sont plus dans la séance actuelle.'] };
  $('vue').innerHTML =
    `<div class="chiffres"><div><b>${gens}</b>participant${gens > 1 ? 's' : ''}</div><div><b>${seance ? 1 : codes.length}</b>séance${!seance && codes.length > 1 ? 's' : ''}</div><div><b>${total}</b>réponse${total > 1 ? 's' : ''}</div></div>`
    + (U ? `<div class="legende"><span><i class="a"></i>${seance ? 'Séance ' + h(seance) : 'Toutes les séances'}</span><span><i></i>Séance ${h($('comparer').value)} (barre fine, second pourcentage)</span></div>` : '')
    + (R.length && !mot ? `<section style="--c:#141414"><h2><i></i>À retenir</h2><p>Calculé sur ${seance ? 'la séance ' + h(seance) : 'toutes les séances'}.</p><div class="retenir">${R.join('')}</div></section>` : '')
    + (Object.keys(blocs).length ? '' : `<p class="vide">Aucune question ne contient « ${h($('chercher').value)} ».</p>`)
    + Object.keys(titres).filter(g => blocs[g]).map(g => `<section style="--c:${COUL[g] || '#141414'}"><h2><i></i>${h(titres[g][0])}</h2><p>${h(titres[g][1])}</p><div class="grille">${blocs[g].map(x => x[1]).join('')}</div></section>`).join('');
}
function charger() {
  // tout ce qui doit être un nombre le devient avant d'entrer dans la page
  const nb = x => Number(x) || 0, texte = x => String(x ?? '');
  const propre = d => ({ seances: Object.fromEntries(Object.entries(d.seances || {}).map(([c, n]) => [texte(c), nb(n)])),
    lignes: (d.lignes || []).map(l => [texte(l[0]), texte(l[1]), texte(l[2]), texte(l[3]), nb(l[4])]),
    notes: (d.notes || []).map(l => [texte(l[0]), texte(l[1]), texte(l[2]), nb(l[3]), nb(l[4])]),
    repondants: (d.repondants || []).map(l => [texte(l[0]), texte(l[1]), texte(l[2]), nb(l[3])]) });
  fetch(SOURCE).then(x => x.json()).then(d => { D = propre(d); $('maj').textContent = 'Mis à jour à ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + '. Résultats anonymes, actualisés toutes les 20 secondes.'; if (document.activeElement !== $('chercher')) dessiner(); })
    .catch(() => { $('maj').textContent = 'Les résultats ne se chargent pas. Vérifiez la connexion internet.'; });
}
$('choix').addEventListener('click', ev => { const b = ev.target.closest('[data-s]'); if (b) { seance = b.dataset.s; history.replaceState(null, '', seance ? '?seance=' + seance : location.pathname); dessiner(); } });
$('mode').addEventListener('click', ev => { const b = ev.target.closest('[data-m]'); if (b) { mode = b.dataset.m; $('mode').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); dessiner(); } });
['comparer', 'tri'].forEach(id => $(id).addEventListener('change', dessiner));
$('chercher').addEventListener('input', dessiner);
fetch('seance.txt?' + Date.now()).then(x => x.text()).then(lireSeance).catch(() => { }).then(() => { charger(); setInterval(charger, 20000); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { }); // garde le site en mémoire pour les visites suivantes
</script>
