<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://script.google.com">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Points de vue · étudier les données</title>

<style>@font-face{font-family:'Scoutie Sans';font-weight:200 800;font-display:swap;src:url(polices/scoutie.woff2) format('woff2')}</style>
<style>
:root{--n:#141414;--gris:#6B6B6B;--fond:#F3F3F3}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--n);font-family:'Scoutie Sans',Helvetica,Arial,sans-serif;font-size:18px;line-height:1.3}
main{max-width:1040px;margin:0 auto;padding:28px 22px 80px}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1F6FE0;outline-offset:3px}
header{display:flex;align-items:center;gap:14px}
header svg{width:64px;flex:none}
header b{font-size:26px;line-height:.86;font-weight:800;letter-spacing:-.05em;flex:1}
header a{font-weight:700}
h1{margin:30px 0 0;font-size:clamp(44px,8vw,84px);line-height:.9;font-weight:800;letter-spacing:-.05em}
.maj{color:var(--gris);font-size:15px;margin:10px 0 0}
.outils{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.btn{display:inline-flex;align-items:center;background:var(--n);color:#fff;font-weight:800;text-decoration:none;border:0;border-radius:99px;padding:10px 20px;min-height:44px;cursor:pointer}
.btn.clair,.choix button{background:var(--fond);color:var(--n)}
.choix{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.choix label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:15px}.choix select{background:var(--fond);border:0;border-radius:14px;padding:11px 14px;min-height:46px;font-weight:400;font-size:17px;min-width:260px}[hidden]{display:none!important}
.choix button{font-weight:700;border:0;cursor:pointer;border-radius:99px;padding:10px 18px;min-height:44px}
.choix button[aria-pressed=true]{background:var(--n);color:#fff}
.reglages{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.reglages label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:15px}
.reglages input,.reglages select{background:var(--fond);border:0;border-radius:14px;padding:11px 14px;min-height:46px;font-weight:400;font-size:17px;width:100%}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
.chiffres div{font-size:16px;font-weight:700}
.chiffres b{display:block;font-size:clamp(46px,9vw,92px);line-height:.9;font-weight:800;letter-spacing:-.05em}
section{margin-top:60px}
h2{display:flex;align-items:center;gap:14px;margin:0;font-size:clamp(28px,4.4vw,44px);line-height:1;font-weight:800;letter-spacing:-.04em}
h2 i{width:.9em;height:.9em;border-radius:50%;background:var(--c);flex:none}
h2+p{margin:8px 0 0;color:var(--gris)}
.grille{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:28px}
article{break-inside:avoid;background:#fff;border:4px solid var(--c);border-radius:18px;padding:22px 24px;display:flex;gap:22px 30px;align-items:flex-start;flex-wrap:wrap}
article .q{flex:1 1 340px;min-width:0}
.aff{flex:none;display:flex;gap:12px;align-items:flex-start;max-width:100%;flex-wrap:wrap}
.aff figure{margin:0;cursor:zoom-in;text-align:center;font-weight:800}.aff img{display:block;max-height:300px;max-width:220px;border-radius:10px}
.aff .vz{width:min(220px,calc(300px*var(--r)))}.aff .zones{margin-left:26px}.aff .z{cursor:inherit}
.aff figure.zoom{position:fixed;inset:0;z-index:5;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.aff figure.zoom img{max-height:90vh;max-width:88vw}.aff figure.zoom .vz{width:min(88vw,calc(90vh*var(--r)))}
.camembert{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:6px}.camembert svg{width:190px;height:190px;flex:none;isolation:isolate}
.camembert ul,.avis{list-style:none;margin:0;padding:0}.camembert ul{flex:1 1 220px;min-width:0}
.camembert li{display:flex;align-items:center;gap:10px;font-size:16px;padding:4px 0}.camembert li i{width:14px;height:14px;border-radius:50%;flex:none}.camembert li span{flex:1;min-width:0;overflow-wrap:anywhere}.camembert li b{white-space:nowrap}.camembert li.zero{color:var(--gris)}
.histo{display:flex;gap:10px;align-items:flex-end;height:170px;margin-top:6px;max-width:420px}.histo div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-weight:800}
.histo i{width:100%;min-height:2px;background:var(--c);border-radius:8px 8px 0 0}.histo span{font-size:15px}
.avis li{background:var(--fond);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:16px;overflow-wrap:anywhere}.avis small{color:var(--gris);font-weight:700}
article h3{margin:0;font-size:22px;line-height:1.12;font-weight:800;letter-spacing:-.02em}
article .n{color:var(--gris);font-size:15px;margin:4px 0 12px}
.moy{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:8px 0 12px}
.moy small{font-size:16px;font-weight:700;letter-spacing:0}
.barre{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;margin-top:8px;font-size:16px}
.barre span{overflow-wrap:anywhere}
.barre b{font-weight:800;white-space:nowrap}
.piste{grid-column:1/-1;height:14px;border-radius:7px;background:var(--fond);overflow:hidden}
.piste i{display:block;height:100%;border-radius:7px;background:var(--c);transition:width .8s cubic-bezier(.45,0,.2,1)}
.piste.autre{height:8px;margin-top:2px}.piste.autre i{background:var(--n)}
.barre.zero{color:var(--gris)}
.barre.bon span{font-weight:800}
.legende{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;font-weight:700;margin-top:16px}
.legende i{display:inline-block;width:1.6em;height:.7em;border-radius:99px;background:var(--n);margin-right:6px;vertical-align:middle}
.legende i.a{background:linear-gradient(90deg,#F5A0C6,#F7C33B,#1F6FE0)}
.vide{margin-top:40px;font-size:22px;font-weight:700}
.bornes{display:flex;justify-content:space-between;color:var(--gris);font-size:14px;margin-top:6px}
@media (max-width:520px){.chiffres{gap:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.imprime{display:none}
#rapport h1{font-size:44px;margin:14px 0 0}#rapport .quoi{font-size:17px;font-weight:700;margin:8px 0 0}#rapport h2{margin-top:26px;font-size:26px}
#rapport ul{margin:10px 0 0;padding-left:1.1em;font-size:16px;line-height:1.35}#rapport li{margin-top:6px}
.pied{margin-top:30px;color:var(--gris);font-size:13px}
@page{margin:9mm}
@media print{.outils,.choix,.reglages,header a,main>h1,.maj{display:none!important}.imprime{display:block}main{padding:0;max-width:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* la restitution remplit ses pages : les cartes coulent sur deux colonnes, serrées, et une longue liste d'avis peut passer d'une page à l'autre */
  header svg{width:40px}header b{font-size:18px}
  #rapport h1{font-size:30px;margin-top:8px}#rapport .quoi{font-size:13px;margin-top:4px}#rapport p{font-size:12px;margin:6px 0 0}#rapport h2{margin-top:12px;font-size:18px}#rapport ul{font-size:12px;margin-top:4px}#rapport li{margin-top:3px}
  .chiffres{margin-top:10px;gap:10px}.chiffres div{font-size:12px}.chiffres b{font-size:34px}
  section{margin-top:14px}h2{font-size:19px;gap:8px;break-after:avoid}h2+p{font-size:11px;margin-top:2px;break-after:avoid}
  .grille{display:block;column-count:2;column-gap:9px;margin-top:8px}
  article{margin:0 0 9px;padding:9px 11px;border-width:2px;border-radius:12px;gap:6px 10px;flex-wrap:nowrap}article:has(.avis){break-inside:auto}
  article .q{flex:1 1 0}article h3{font-size:13px}article .n{font-size:10px;margin:2px 0 5px}
  .aff{flex-wrap:nowrap;gap:5px}.aff img{max-height:150px;max-width:105px;border-radius:6px}.aff .vz{width:min(105px,calc(150px*var(--r)))}.aff .zones{margin-left:16px}
  .aff:has(figure+figure) img{max-height:96px;max-width:68px}.aff figcaption{font-size:10px}
  .camembert{gap:6px 8px;margin-top:2px}.camembert svg{width:86px;height:86px}.camembert ul{flex:1 1 110px}.camembert li{font-size:10.5px;padding:1px 0;gap:5px}.camembert li i{width:9px;height:9px}
  .barre{font-size:10.5px;margin-top:4px;gap:1px 8px}.piste{height:7px}.piste.autre{height:4px}.bornes{font-size:10px;margin-top:3px}
  .histo{height:78px;gap:6px}.histo span{font-size:10px}.moy{font-size:21px;margin:3px 0 5px}.moy small{font-size:11px}
  .avis li{font-size:10.5px;padding:4px 8px;margin-top:4px;border-radius:8px}.pied{margin-top:10px;font-size:10px}}
</style>
</head>
<body>
<main>
<header><svg viewBox="0 0 120 112" aria-hidden="true"><circle cx="44" cy="46" r="40" fill="#F5A0C6" style="mix-blend-mode:multiply"/><circle cx="86" cy="38" r="28" fill="#F7C33B" style="mix-blend-mode:multiply"/><circle cx="74" cy="78" r="22" fill="#1F6FE0" style="mix-blend-mode:multiply"/><circle cx="22" cy="36" r="3.4" fill="#141414"/><circle cx="34" cy="34" r="3.4" fill="#141414"/><circle cx="93" cy="24" r="2.7" fill="#141414"/><circle cx="103" cy="26" r="2.7" fill="#141414"/><circle cx="73" cy="91" r="2.2" fill="#141414"/><circle cx="81" cy="91" r="2.2" fill="#141414"/></svg><b>Points<br>de vue</b><a href="./" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="1.35em" height="1.35em" fill="currentColor" aria-hidden="true" style="vertical-align:-.3em"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg></a></header>
<h1>Étudier les données</h1>
<p class="maj" id="maj">Chargement…</p>
<div class="outils">
  <a class="btn" href="https://docs.google.com/spreadsheets/d/14uvOfNQwjgMOH83hJhnWea9Df3Cidhhs4rUefRrQ2wk" target="_blank" rel="noopener">Ouvrir le Google Sheet</a>
  <button class="btn" id="pdf" title="Ouvre la fenêtre d'impression : choisissez « Enregistrer au format PDF ». Le document reprend la séance choisie ci-dessous."><svg viewBox="0 0 24 24" width="1.2em" height="1.2em" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-.25em;margin-right:.45em"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>Restitution en PDF</button>
  <a class="btn" id="mail" href="mailto:" title="Ouvre votre messagerie avec un message tout prêt et le lien vers ces résultats. Pour joindre la restitution, enregistrez-la d'abord en PDF."><svg viewBox="0 0 24 24" width="1.2em" height="1.2em" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-.25em;margin-right:.45em"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.500 7 12 13l8.500-6"/></svg>Envoyer par mail</a>
</div>
<div class="choix" id="choix" role="group" aria-label="Choisir une séance"></div>
<div class="reglages">
  <label hidden>Comparer avec<select id="comparer"><option value="">Aucune comparaison</option></select></label>
  <label>Chercher une question<input type="search" id="chercher" placeholder="Un mot de la question"></label>
  <label hidden>Ranger les questions<select id="tri"><option value="">Dans l'ordre de la séance</option><option value="fort">Les plus unanimes d'abord</option><option value="faible">Les plus partagées d'abord</option></select></label>
</div>
<div id="rapport" class="imprime"></div>
<div id="vue"></div>
<p class="imprime pied">Points de vue · habitants testeurs · Granville Terre et Mer. Résultats anonymes : aucun prénom, aucune réponse individuelle.</p>
</main>
<script src="seance.js"></script>
<script>
// Étude des données : lit les totaux anonymes calculés par le script Google (jamais de prénom, jamais de ligne individuelle)
// et les présente dans l'ordre de la séance (seance.txt). Outils : choix d'une séance, comparaison de deux séances,
// points à retenir calculés, recherche, tri par accord. Mise à jour toutes les 20 secondes.
const SOURCE = 'https://script.google.com/macros/s/AKfycbzPof8sEj8tZLlA-MtVDYyODv32y8lXxc9hLVmaW5zCvHLilyRIxpk4Ix6TPhzJczjn/exec?vue=resultats';
const COUL = { 'Étape 1': '#F5A0C6', 'Étape 2': '#F7C33B', 'Étape 3': '#1F6FE0', 'Étape 4': '#7BD3A8', 'Étape 5': '#B79CF2', 'Étape 6': '#FF9A6B' };
const h = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/ ([?!:;»])/g, '&nbsp;$1').replace(/« /g, '«&nbsp;');
const TEINTES = ['#F5A0C6', '#F7C33B', '#1F6FE0', '#7BD3A8', '#B79CF2', '#FF9A6B', '#5BC0DE', '#C2185B', '#B0B0B0', '#C9B037']; // un cercle par réponse : d'abord les trois couleurs de l'identité
const fr = (x, d = 1) => x.toFixed(d).replace('.', ','), pc = x => Math.round(x * 100) + ' %';
const $ = id => document.getElementById(id), plat = x => x.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
let NOM_TEST = 'Séance Points de vue'; listeTests().then(l => { NOM_TEST = (l.find(x => x.id === TEST) || {}).nom || NOM_TEST; }).catch(() => { }); // le nom du test, pour le titre de la restitution
let D = null, seance = new URLSearchParams(location.search).get('seance') || '', age = ''; // age : la tranche d'âge montrée ('' = tout le monde)
const TRANCHES = ['Moins de 30 ans', '30 à 44 ans', '45 à 59 ans', '60 à 69 ans', '70 à 79 ans', '80 ans et plus'];

// les totaux d'une séance ('' = toutes) : par question, le nombre de répondants, le détail des réponses, la moyenne des notes
function totaux(code) {
  const garde = l => (!code || l[0] === code) && (!age || l[l.length - 1] === age), T = { compte: {}, rep: {}, notes: {}, groupe: {}, ordre: [] };
  D.lignes.filter(garde).forEach(([, g, q, r, n]) => { (T.compte[q] = T.compte[q] || {})[r] = ((T.compte[q] || {})[r] || 0) + n; if (!(q in T.groupe)) { T.groupe[q] = g; T.ordre.push(q); } });
  D.repondants.filter(garde).forEach(([, , q, n]) => T.rep[q] = (T.rep[q] || 0) + n);
  D.notes.filter(garde).forEach(([, , q, s, n]) => { const x = T.notes[q] = T.notes[q] || [0, 0]; x[0] += s; x[1] += n; });
  return T;
}
const accord = (T, q) => T.rep[q] ? Math.max(0, ...Object.values(T.compte[q] || {})) / T.rep[q] : 0; // part de la réponse la plus donnée

function dessiner() {
  if (!D) return;
  const codes = Object.keys(D.seances).sort();
  if (seance && !D.seances[seance]) seance = '';
  const tr = TRANCHES.filter(t => codes.some(c => (!seance || c === seance) && (D.ages[c] || {})[t])); if (age && !tr.includes(age)) age = ''; // les tranches d'âge où quelqu'un a répondu
  if (!['seanceSel', 'ageSel'].includes(document.activeElement.id)) $('choix').innerHTML = (tr.length ? `<label>Âge des participants<select id="ageSel"><option value="">Tous les âges</option>${tr.map(t => `<option ${t === age ? 'selected' : ''}>${h(t)}</option>`).join('')}</select></label>` : '') + `<label>Séance montrée<select id="seanceSel">${[['', 'Toutes les séances'], ...codes.map(c => [c, 'Séance ' + c])].map(([c, nom]) => `<option value="${h(c)}" ${c === seance ? 'selected' : ''}>${h(nom)}</option>`).join('')}</select></label>`; // pas reconstruite pendant qu'on choisit dedans
  const autre = $('comparer').value;
  $('comparer').innerHTML = '<option value="">Aucune comparaison</option>' + codes.filter(c => c !== seance).map(c => `<option value="${h(c)}" ${c === autre ? 'selected' : ''}>Séance ${h(c)}</option>`).join('');
  const T = totaux(seance), U = $('comparer').value ? totaux($('comparer').value) : null, mot = plat($('chercher').value.trim()), tri = $('tri').value;
  const gens = codes.filter(c => !seance || c === seance).reduce((a, c) => a + (age ? (D.ages[c] || {})[age] || 0 : D.seances[c]), 0), total = Object.values(T.rep).reduce((a, n) => a + n, 0);
  if (!total) { $('vue').innerHTML = `<p class="vide">Pas encore de réponses. Cette page se met à jour toute seule pendant la séance.</p>`; return; }

  // l'affiche de la question, telle que les participants l'ont vue (zones, parties masquées, élément en gros) ; les zones se colorent selon les réponses
  const affiche = (e, c) => { if (!e) return ''; const max = Math.max(1, ...Object.values(c));
    const im = (e.jeu ? [e.img] : e.imgs || []).filter(Boolean); if (!im.length) return '';
    return `<div class="aff">${im.map((src, k) => `<figure title="Cliquer pour agrandir">${e.zones ? carteZones(e, src).replace(/class="z" data-o="(\d+)" style="/g, (m, i) => `class="z" data-o="${i}" tabindex="-1" style="--f:${(c[e.o[i]] || 0) / max};`) : cadree(e) ? afficheCadree(e, src) : `<img src="${h(src)}" alt="L'affiche testée" loading="lazy">`}${e.t === 'ab' ? `<figcaption>${'ABCD'[k]}</figcaption>` : ''}</figure>`).join('')}</div>`; };
  // une seule réponse possible : les cercles superposés de l'identité, un par réponse, la surface suit la part des réponses ; puis la légende
  const camembert = (liste, c, n, bon) => { const pris = liste.map((o, i) => [i, n ? (c[o] || 0) / n : 0]).filter(x => x[1]), max = Math.max(...pris.map(x => x[1]), .0001);
    const ronds = pris.map(([i, p], k) => { const r = 7 + 22 * Math.sqrt(p / max), ang = (-90 + 360 * k / pris.length) * Math.PI / 180, d = pris.length > 1 ? 23 : 0, x = 50 + d * Math.cos(ang), y = 50 + d * Math.sin(ang);
      const gros = r > 11, bx = x + (gros ? r * .3 * Math.cos(ang) : 0), by = y + (gros ? r * .3 * Math.sin(ang) : 0), e = Math.max(1.5, r * .15), ry = Math.max(.9, r * .075), oy = by - (gros ? r * .2 : 0), encre = i % 10 === 2 || i % 10 === 7 ? '#fff' : '#141414'; // le regard est décalé vers l'extérieur, là où le cercle ne se superpose pas aux autres
      return [`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${TEINTES[i % 10]}" style="mix-blend-mode:multiply"/>`, `<circle cx="${(bx - e).toFixed(1)}" cy="${oy.toFixed(1)}" r="${ry.toFixed(1)}" fill="${encre}"/><circle cx="${(bx + e).toFixed(1)}" cy="${oy.toFixed(1)}" r="${ry.toFixed(1)}" fill="${encre}"/>` + (gros ? `<text x="${bx.toFixed(1)}" y="${(by + r * .12 + 4.5).toFixed(1)}" text-anchor="middle" font-size="6.5" font-weight="800" fill="${encre}">${pc(p)}</text>` : '')]; });
    return `<div class="camembert"><svg viewBox="-4 -4 108 108" role="img" aria-label="Répartition des réponses">${ronds.map(x => x[0]).join('')}${ronds.map(x => x[1]).join('')}</svg><ul>${liste.map((o, i) => `<li class="${c[o] ? '' : 'zero'}"><i style="background:${TEINTES[i % 10]}"></i><span>${h(o)}${i === bon ? ' (bonne réponse)' : ''}</span><b>${c[o] || 0} · ${pc(n ? (c[o] || 0) / n : 0)}</b></li>`).join('')}</ul></div>`; };
  // une note de 1 à 5 : cinq colonnes
  const colonnes = (liste, c, n) => `<div class="histo">${liste.map((o, i) => `<div><b>${c[o] || 0}</b><i style="height:${n ? (c[o] || 0) / n * 100 : 0}%"></i><span>${i + 1}</span></div>`).join('')}</div>`;
  const carte = (g, q, opts, bon, bornes, e) => { // une question : son graphique (ou ses barres), dans l'ordre du questionnaire, et son affiche en face
    const c0 = T.compte[q] || {}, n0 = T.rep[q] || 0, l0 = opts || Object.keys(c0).sort((a, b) => c0[b] - c0[a]);
    const graphe = !e || U ? '' : e.t === 'echelle' ? colonnes(l0, c0, n0) + `<div class="bornes"><span>1 = ${h(e.a)}</span><span>5 = ${h(e.b)}</span></div>`
      : e.t === 'texte' ? `<ul class="avis">${l0.map(o => `<li>${h(o)}${c0[o] > 1 ? ` <small>× ${c0[o]}</small>` : ''}</li>`).join('')}</ul>`
      : e.t === 'choix' || e.t === 'ab' ? camembert(l0, c0, n0, bon) : '';
    if (graphe) { const nt = T.notes[q]; return `<article><div class="q"><h3>${h(q)}</h3><p class="n">${n0} réponse${n0 > 1 ? 's' : ''}</p>${nt ? `<div class="moy">${fr(nt[0] / nt[1])} <small>sur 5 en moyenne</small></div>` : ''}${graphe}</div>${affiche(e, c0)}</article>`; }
    const c = T.compte[q] || {}, n = T.rep[q] || 0, liste = opts || Object.keys(c).sort((a, b) => c[b] - c[a]), nt = T.notes[q], cu = U && U.compte[q] || {}, nu = U && U.rep[q] || 0, ntu = U && U.notes[q], oubli = [];
    return `<article><div class="q"><h3>${h(q)}</h3><p class="n">${n} réponse${n > 1 ? 's' : ''}${U ? ` · ${nu} dans l'autre séance` : ''}</p>${nt ? `<div class="moy">${fr(nt[0] / nt[1])} <small>sur 5 en moyenne${ntu ? ` · ${fr(ntu[0] / ntu[1])} dans l'autre séance` : ''}</small></div>` : ''}`
      + liste.map((o, i) => { const k = c[o] || 0, p = n ? k / n : 0, pu = nu ? (cu[o] || 0) / nu : 0;
        if (!k && !nt && i !== bon && !cu[o]) { oubli.push(o); return ''; } // personne ne l'a choisie : citée en une ligne, sans barre
        return `<div class="barre${k ? '' : ' zero'}${i === bon ? ' bon' : ''}"><span>${h(o)}${i === bon ? ' (bonne réponse)' : ''}</span><b>${k} · ${pc(p)}${U ? ' / ' + pc(pu) : ''}</b><div class="piste"><i style="width:${p * 100}%${bon != null && i !== bon ? ';background:#BDBDBD' : ''}"></i></div>${U ? `<div class="piste autre"><i style="width:${pu * 100}%"></i></div>` : ''}</div>`; }).join('')
      + (oubli.length ? `<p class="n" style="margin:10px 0 0">Personne n'a choisi : ${h(oubli.join(', '))}.</p>` : '')
      + (bornes ? `<div class="bornes"><span>1 = ${h(bornes[0])}</span><span>5 = ${h(bornes[1])}</span></div>` : '') + `</div>${affiche(e, c)}</article>`;
  };
  // les questions de la séance, dans l'ordre de seance.txt ; puis celles de l'atelier et celles qui ne sont plus dans la séance
  const vues = new Set(), blocs = {}, Q = ETAPES.filter(e => e.id && e.t !== 'vote' && T.rep[e.q]);
  const ranger = (g, q, html) => { if (!mot || plat(q).includes(mot)) (blocs[g] = blocs[g] || []).push([accord(T, q), html]); };
  Q.forEach(e => { vues.add(e.q); const g = e.p ? 'Étape ' + e.p : "Jeu de l'œil";
    ranger(g, e.q, carte(g, e.q, e.t === 'echelle' ? e.o.map(x => x + ' sur 5') : e.o, e.bon, e.t === 'echelle' ? [e.a, e.b] : null, e)); });
  T.ordre.filter(q => !vues.has(q)).forEach(q => { const g = T.groupe[q] === 'Atelier' ? 'Atelier' : 'Autres questions'; ranger(g, q, carte(g, q, T.notes[q] ? ['1', '2', '3', '4', '5'].map(x => x + ' sur 5') : null)); });
  if (tri) Object.values(blocs).forEach(b => b.sort((x, y) => tri === 'fort' ? y[0] - x[0] : x[0] - y[0]));

  Q.filter(e => e.t === 'ab').map(e => { const c = T.compte[e.q] || {}, x = c.A || 0, y = c.B || 0; return [Math.abs(x - y) / T.rep[e.q], x > y ? 'A' : 'B', Math.max(x, y) / T.rep[e.q], e]; })

  // la restitution : ce qu'une équipe de communication lit d'abord
  const net = Q.filter(e => (e.t === 'choix' || e.t === 'ab') && e.bon == null && T.rep[e.q] > 1).map(e => { const c = T.compte[e.q] || {}, o = Object.keys(c).sort((a, b) => c[b] - c[a])[0]; return [c[o] / T.rep[e.q], e.q, o]; }).sort((a, b) => b[0] - a[0]);
  const notes = Q.filter(e => e.t === 'echelle' && T.notes[e.q]).map(e => [T.notes[e.q][0] / T.notes[e.q][1], e.q]).sort((a, b) => a[0] - b[0]);
  const jeu = Q.filter(e => e.bon != null).map(e => [((T.compte[e.q] || {})[e.o[e.bon]] || 0) / T.rep[e.q], e.q]).sort((a, b) => a[0] - b[0]);
  const points = [
    ...net.slice(0, 3).map(x => `<b>${pc(x[0])}</b> répondent « ${h(x[2])} » à la question « ${h(x[1])} ».`),
    ...(net.length > 4 ? net.slice(-1).map(x => `Avis partagés sur « ${h(x[1])} » : la réponse la plus donnée, « ${h(x[2])} », ne réunit que <b>${pc(x[0])}</b>.`) : []),
    ...(notes.length ? [`Note la plus basse : <b>${fr(notes[0][0])} sur 5</b> pour « ${h(notes[0][1])} ».`] : []),
    ...(notes.length > 1 ? [`Note la plus haute : <b>${fr(notes[notes.length - 1][0])} sur 5</b> pour « ${h(notes[notes.length - 1][1])} ».`] : []),
    ...(jeu.length ? [`Après 5 secondes, l'information la moins bien retrouvée : « ${h(jeu[0][1])} » (<b>${pc(jeu[0][0])}</b> de bonnes réponses).`] : [])];
  const jour = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  $('rapport').innerHTML = `<h1>Restitution du test</h1><p class="quoi">${h(NOM_TEST)} · ${seance ? 'séance ' + h(seance) : codes.length + ' séance' + (codes.length > 1 ? 's' : '')} · document du ${jour}</p>
    <p>Des habitants ont regardé les affiches et répondu aux questions ci-dessous, sur leur téléphone ou sur papier. Chaque question est présentée avec ses réponses et l'affiche montrée à ce moment-là.</p>${points.length ? `<h2>À retenir</h2><ul>${points.map(p => `<li>${p}</li>`).join('')}</ul>` : ''}`;
  document.title = 'Restitution - ' + NOM_TEST + (seance ? ' - séance ' + seance : '') + ' - ' + jour; // le nom proposé pour le fichier PDF
  const titres = { "Jeu de l'œil": ["Le jeu de l'œil", 'Une affiche vue 5 secondes, puis des questions précises.'], ...Object.fromEntries(Object.keys(PHASES).sort().map(p => ['Étape ' + p, [PHASES[p].nom, PHASES[p].quoi]])), Atelier: ["L'atelier", 'Les affiches fabriquées en binômes, notées par la salle.'], 'Autres questions': ['Autres questions', 'Des questions qui ne sont plus dans la séance actuelle.'] };
  $('vue').innerHTML =
    `<div class="chiffres"><div><b>${gens}</b>participant${gens > 1 ? 's' : ''}</div><div><b>${seance ? 1 : codes.length}</b>séance${!seance && codes.length > 1 ? 's' : ''}</div><div><b>${total}</b>réponse${total > 1 ? 's' : ''}</div></div>`
    + (U ? `<div class="legende"><span><i class="a"></i>${seance ? 'Séance ' + h(seance) : 'Toutes les séances'}</span><span><i></i>Séance ${h($('comparer').value)} (barre fine, second pourcentage)</span></div>` : '')
    + (Object.keys(blocs).length ? '' : `<p class="vide">Aucune question ne contient « ${h($('chercher').value)} ».</p>`)
    + Object.keys(titres).filter(g => blocs[g]).map(g => `<section style="--c:${COUL[g] || '#141414'}"><h2><i></i>${h(titres[g][0])}</h2><p>${h(titres[g][1])}</p><div class="grille">${blocs[g].map(x => x[1]).join('')}</div></section>`).join('');
}
function charger() {
  // tout ce qui doit être un nombre le devient avant d'entrer dans la page
  const nb = x => Number(x) || 0, texte = x => String(x ?? '');
  const propre = d => ({ seances: Object.fromEntries(Object.entries(d.seances || {}).map(([c, n]) => [texte(c), nb(n)])),
    ages: Object.fromEntries(Object.entries(d.ages || {}).map(([c, a]) => [texte(c), Object.fromEntries(Object.entries(a || {}).map(([t, n]) => [texte(t), nb(n)]))])),
    lignes: (d.lignes || []).map(l => [texte(l[0]), texte(l[1]), texte(l[2]), texte(l[3]), nb(l[4]), texte(l[5])]),
    notes: (d.notes || []).map(l => [texte(l[0]), texte(l[1]), texte(l[2]), nb(l[3]), nb(l[4]), texte(l[5])]),
    repondants: (d.repondants || []).map(l => [texte(l[0]), texte(l[1]), texte(l[2]), nb(l[3]), texte(l[4])]) });
  fetch(SOURCE + '&jeton=' + JETON()).then(x => x.json()).then(d => { if (d.refus) return deconnexion(); D = propre(d); $('maj').textContent = 'Mis à jour à ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + '. Résultats anonymes, actualisés toutes les 20 secondes.'; if (document.activeElement !== $('chercher')) dessiner(); if (pdfVoulu && Object.keys(D.seances).length) { pdfVoulu = false; setTimeout(print, 1200); } })
    .catch(() => { $('maj').textContent = 'Les résultats ne se chargent pas. Vérifiez la connexion internet.'; });
}
$('choix').addEventListener('change', ev => { const a = ev.target.closest('#ageSel'); if (a) { age = a.value; return dessiner(); } const b = ev.target.closest('#seanceSel'); if (b) { seance = b.value; history.replaceState(null, '', (seance ? '?seance=' + seance : '?') + TQ); dessiner(); } });
['comparer', 'tri'].forEach(id => $(id).addEventListener('change', dessiner));
$('chercher').addEventListener('input', dessiner);
// la restitution en PDF : la fenêtre d'impression du navigateur, où l'on choisit « Enregistrer au format PDF ». « ?pdf » dans l'adresse l'ouvre dès que les réponses sont là.
// shortcut: pas de fabrication de fichier PDF dans la page (il faudrait une bibliothèque) ; à revoir si l'équipe veut un bouton qui télécharge directement.
let pdfVoulu = new URLSearchParams(location.search).has('pdf');
$('pdf').addEventListener('click', () => { if (D) { dessiner(); print(); } });

$('mail').addEventListener('click', () => { $('mail').href = 'mailto:?subject=' + encodeURIComponent('Points de vue : résultats' + (seance ? ' de la séance ' + seance : '')) + '&body=' + encodeURIComponent('Bonjour,\n\nVoici les résultats' + (seance ? ' de la séance ' + seance : ' des séances') + ' du groupe Points de vue :\n' + location.href + "\n\n(La page demande un compte de l'équipe. La restitution en PDF peut être jointe à ce message.)\n\nBonne lecture."); });
$('vue').addEventListener('click', ev => { const g = ev.target.closest('.aff figure'); if (g) g.classList.toggle('zoom'); }); // l'affiche en grand, puis de nouveau en petit
connexion('Étudier les données').then(() => lireFichier()).then(lireSeance).catch(() => { }).then(() => { dessiner(); charger(); setInterval(charger, 20000); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { }); // garde le site en mémoire pour les visites suivantes
</script>
