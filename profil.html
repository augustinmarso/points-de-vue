<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://script.google.com">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Points de vue · mon profil</title>
<link rel="icon" href="icone.png"><link rel="apple-touch-icon" href="icone.png">
<link rel="preload" href="polices/scoutie.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Scoutie Sans';font-weight:200 800;font-display:swap;src:url(polices/scoutie.woff2) format('woff2')}
:root{--n:#2B1B12;--gris:#6E625A;--fond:#F4EFEA}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--n);font-family:'Scoutie Sans',Helvetica,Arial,sans-serif;font-size:18px;line-height:1.3}
main{max-width:860px;margin:0 auto;padding:28px 22px 80px}
a{color:inherit}button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1F6FE0;outline-offset:3px}
header{display:flex;align-items:center;justify-content:flex-end}
.tete{display:flex;align-items:center;gap:22px;margin-top:26px;flex-wrap:wrap}
.avatar{width:112px;height:112px;border-radius:50%;background:#F5A0C6;display:grid;place-items:center;font-size:54px;font-weight:800;letter-spacing:-.04em;flex:none}
h1{margin:0;font-size:clamp(30px,5vw,48px);line-height:1;font-weight:800;letter-spacing:-.04em;overflow-wrap:anywhere}
.sous{color:var(--gris);margin:6px 0 0}
.btn{display:inline-flex;align-items:center;background:var(--n);color:#fff;font-weight:800;border:0;border-radius:99px;padding:10px 20px;min-height:44px;cursor:pointer;text-decoration:none}
.btn.clair,.choix button{background:var(--fond);color:var(--n)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
.chiffres div{background:var(--fond);border-radius:22px;padding:18px 20px}
.chiffres b{display:block;font-size:44px;line-height:1;font-weight:800;letter-spacing:-.04em}
h2{margin:44px 0 0;font-size:30px;font-weight:800;letter-spacing:-.03em}
.choix{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.choix button{font-weight:700;border:0;cursor:pointer;border-radius:99px;padding:10px 18px;min-height:44px}
.choix button[aria-pressed=true]{background:var(--n);color:#fff}
table{border-collapse:collapse;margin-top:18px;width:100%;font-size:16px}
th,td{text-align:left;padding:9px 14px 9px 0;border-bottom:1px solid #E6DFD8;vertical-align:top}
th{font-weight:800}td:first-child{white-space:nowrap;color:var(--gris)}
.vide{color:var(--gris);margin-top:22px}
.tests{display:grid;gap:10px;margin-top:16px}
.tests>div{background:var(--fond);border-radius:22px;padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tests b{flex:1 1 14em;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tests small{display:block;color:var(--gris);font-weight:400;font-size:14px;letter-spacing:0;margin-top:3px}
.tests .btn{min-height:40px;padding:8px 16px;font-size:16px}.tests .btn.clair{background:#fff}
@media (max-width:600px){.chiffres{grid-template-columns:1fr}td:nth-child(4),th:nth-child(4){display:none}}
</style>
</head>
<body>
<main>
<header><a href="./" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="1.6em" height="1.6em" fill="currentColor" aria-hidden="true"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg></a></header>
<div id="vue"><p class="vide">Chargement…</p></div>
</main>
<script src="seance.js"></script>
<script>
// La page Profil : qui je suis (mon adresse), ce que j'ai fait (mes connexions, mes actions), et le bouton pour me déconnecter.
// L'historique vient de l'onglet « Journal » du Google Sheet ; il n'est lisible qu'une fois connecté.
const h = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = id => document.getElementById(id), quand = x => new Date(x).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
let moi = true, L = null, T = null; // T : les tests du site (le principal et ceux créés dans « Modifier le test »)
listeTests().then(l => { T = l; if (QUI()) dessiner(); });
// qui a créé un test et quand : la ligne « Nouveau test » du journal, dont le détail finit par « (nom-court) »
const cree = id => (L || []).find(l => l[2] === 'Nouveau test' && String(l[3]).endsWith('(' + id + ')'));
const lienMail = id => location.origin + location.pathname.replace(/[^/]*$/, '') + '?enligne' + (id ? '&test=' + id : '');
function tests() {
  if (T === null) return `<p class="vide">Chargement des tests…</p>`;
  return `<div class="tests">${T.map(t => { const q = t.id ? '&test=' + t.id : '', c = t.par ? [t.quand, t.par] : t.id && cree(t.id);
    return `<div><b>${h(t.nom)}<small>${!t.id ? 'Le test principal du site' : c ? 'Créé par ' + (c[1] === QUI() ? 'vous' : h(c[1])) + ' le ' + h(quand(c[0]).slice(0, 10)) : 'Test « ' + h(t.id) + ' »'}</small></b>
      <a class="btn" href="./?passer${q}">Lancer</a>      <a class="btn clair" href="modifier.html${q && '?' + q.slice(1)}">Modifier</a><a class="btn clair" href="resultats.html${q && '?' + q.slice(1)}">Données</a>
      <button class="btn clair" data-lien="${h(lienMail(t.id))}">Copier le lien mail</button>${t.par ? `<button class="btn clair" data-suppr="${h(t.id)}" data-nom="${h(t.nom)}">Supprimer</button>` : ''}</div>`; }).join('')}</div>`;
}
function dessiner() {
  const miens = (L || []).filter(l => l[1] === QUI()), cnx = miens.filter(l => l[2] === 'Connexion'), act = miens.length - cnx.length, V = moi ? miens : L || [];
  $('vue').innerHTML = `<div class="tete"><div class="avatar" aria-hidden="true">${h(QUI()[0].toUpperCase())}</div><div><h1>${h(QUI())}</h1><p class="sous">Membre de l'équipe Points de vue${miens.length ? ' · première activité le ' + h(quand(miens[miens.length - 1][0]).slice(0, 10)) : ''}</p></div></div>
    <div class="actions"><a class="btn clair" href="modifier.html">Modifier le test</a><a class="btn clair" href="resultats.html">Étudier les données</a><button class="btn" id="sortir">Se déconnecter</button></div>
    <div class="chiffres"><div><b>${cnx.length}</b>connexion${cnx.length > 1 ? 's' : ''}</div><div><b>${act}</b>action${act > 1 ? 's' : ''}</div><div><b>${miens.length ? h(quand(miens[0][0]).slice(0, 5)) : '–'}</b>dernière activité</div></div>
    <h2>Les tests</h2><p class="sous">Lancer : une séance au téléphone, sur papier ou en ligne. Le lien mail ouvre le test en ligne, chacun chez soi.</p>
    <div class="actions"><a class="btn" href="modifier.html#nouveau">+ Nouveau test</a></div>${tests()}
    <h2>Historique</h2>
    <div class="choix" role="group" aria-label="Choisir l'historique"><button data-moi="1" aria-pressed="${moi}">Le mien</button><button data-moi="" aria-pressed="${!moi}">Toute l'équipe</button></div>`
    + (L === null ? `<p class="vide">Chargement de l'historique…</p>` : V.length ? `<table><thead><tr><th>Quand</th><th>Qui</th><th>Quoi</th><th>Détail</th></tr></thead><tbody>${V.map(l => `<tr><td>${h(quand(l[0]))}</td><td><b>${h(l[1])}</b></td><td>${h(l[2])}</td><td>${h(l[3])}</td></tr>`).join('')}</tbody></table>` : `<p class="vide">Rien pour l'instant.</p>`);
}
document.addEventListener('click', ev => { if (ev.target.id === 'sortir') deconnexion();
  const s = ev.target.closest('[data-suppr]'); if (s && confirm('Supprimer le test « ' + s.dataset.nom + ' » ? Son lien ne marchera plus. Les réponses déjà données restent dans le Google Sheet.')) { s.disabled = true; s.textContent = 'Suppression…';
    supprimerTest(s.dataset.suppr).then(() => { T = T.filter(t => t.id !== s.dataset.suppr); dessiner(); }, err => { s.disabled = false; s.textContent = 'Supprimer'; alert('Pas supprimé : ' + err.message + '.'); }); }
  const lien = ev.target.closest('[data-lien]'); if (lien) navigator.clipboard.writeText(lien.dataset.lien).then(() => { lien.textContent = 'Lien copié'; setTimeout(() => lien.textContent = 'Copier le lien mail', 2000); }, () => prompt('Le lien à envoyer par mail :', lien.dataset.lien)); const b = ev.target.closest('[data-moi]'); if (b) { moi = !!b.dataset.moi; dessiner(); } });
connexion('Mon profil').then(() => { dessiner();
  return fetch(SCRIPT_GOOGLE + '?vue=journal&jeton=' + JETON()).then(x => x.json()).then(d => { if (d.refus) return deconnexion(); L = d; dessiner(); }); })
  .catch(() => { L = []; dessiner(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
</html>
