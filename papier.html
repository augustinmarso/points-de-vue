<style id="base">
:root{--n:#141414;--gris:#6B6B6B;--fond:#F3F3F3;--c1:#F5A0C6;--c2:#F7C33B;--c3:#1F6FE0;--c4:#7BD3A8;--c5:#B79CF2;--c6:#FF9A6B}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:var(--fond);color:var(--n);font-family:'Scoutie Sans',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.3}
button,input{font:inherit;color:inherit}
a{color:inherit}

nav{position:sticky;top:0;z-index:5;background:#fff;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;box-shadow:0 2px 14px rgba(20,20,20,.12)}
nav b{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-right:auto}
nav a.lien{font-weight:700}
.btn{display:inline-flex;align-items:center;background:var(--fond);color:var(--n);font-weight:800;text-decoration:none;border:0;border-radius:99px;padding:9px 18px;min-height:44px;cursor:pointer}
.btn.on,.btn.noir{background:var(--n);color:#fff}
#vue{padding:22px 12px 60px;display:flex;flex-direction:column;align-items:center;gap:22px}
.page{background:#fff;width:210mm;min-height:297mm;padding:16mm 15mm;box-shadow:0 4px 24px rgba(20,20,20,.16);position:relative}
.page.fiche{padding:0;width:420mm;height:297mm;overflow:hidden}
.page.fiche.verso img{position:absolute;left:50%;top:50%;width:297mm;height:420mm;object-fit:contain;transform:translate(-50%,-50%) rotate(90deg);display:block} /* l'affiche au dos, couchée pour remplir la feuille */
.reglage select{font:inherit;font-weight:700;border:0;border-radius:99px;padding:6px 10px;background:var(--fond);margin:4px 8px 4px 0}
.ft{position:absolute;overflow:hidden;font-size:4.04mm;line-height:1.2;color:#151515}
.ft b{font-weight:700}.ft span{display:block;font-size:.8em;color:#444}
.trop{background:#fff;border-radius:14px;padding:12px 16px;font-weight:700;max-width:820px}
@media screen{.page.fiche{zoom:.62}.page.affiche{zoom:.5}.double{zoom:.9}}
/* l'aperçu plié : chaque page est une fenêtre de 105 × 148,5 mm sur la feuille */
.double{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800}.double>div{display:flex;background:#fff;box-shadow:0 4px 24px rgba(20,20,20,.16)}
.volet{width:105mm;height:148.5mm;overflow:hidden;position:relative}.volet+.volet{box-shadow:-1px 0 0 #ddd}.volet>div{position:absolute;left:0;top:0;width:420mm;height:297mm;transform-origin:0 0}.volet svg{display:block;width:100%;height:100%}
.page.affiche{padding:0;display:grid;place-items:center;height:297mm}.page.affiche img{max-width:100%;max-height:297mm;display:block}
.page.fiche svg{display:block;width:100%;height:100%}
.page.diapo{width:297mm;min-height:0;height:210mm;padding:16mm 18mm;display:flex;gap:10mm;overflow:hidden;background:var(--b,#fff);color:var(--f,#141414)}
h1{margin:0;font-size:34px;line-height:.95;font-weight:800;letter-spacing:-.045em}
.diapo .g{flex:1;min-width:0;display:flex;flex-direction:column;gap:5mm}
.diapo .sur{font-weight:700;font-size:16px}.diapo .sur::before{content:'';display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--a,#141414);margin-right:.5em;vertical-align:-.06em}.diapo .sur:empty::before{display:none}
.diapo h3{margin:0;font-size:46px;line-height:.92;font-weight:800;letter-spacing:-.05em}
.diapo p{margin:0;font-size:20px;font-weight:700}
.diapo ol{margin:auto 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:3mm 6mm;font-size:19px;font-weight:700}
.diapo ol li{background:var(--fond);border-radius:6mm;padding:3mm 5mm}
.diapo ol li::before{content:attr(data-l);font-weight:800;margin-right:8px}
.diapo .d{display:flex;gap:4mm;align-items:center;flex:none}

.diapo .d figure img{min-height:0;flex:0 1 auto;max-height:calc(100% - 9mm)}
.diapo .no{position:absolute;right:10mm;bottom:7mm;font-size:13px;color:inherit;opacity:.6}
/* lecture d'une fiche */
.scan{background:#fff;border-radius:22px;padding:22px;max-width:820px;width:100%;display:flex;flex-direction:column;gap:14px}

.scan input[type=text],.scan input[type=number]{background:var(--fond);border:0;border-radius:14px;padding:12px 14px;min-height:46px;font-weight:400;width:100%}
.scan .deux{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.scan select{background:var(--fond);border:0;border-radius:14px;padding:12px 14px;min-height:46px;font:inherit;width:100%}
.scan canvas{width:100%;border-radius:14px;cursor:pointer;display:block;background:var(--fond)}
.scan .etat{font-weight:700}
.scan .regl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.scan .regl b{margin-right:6px}
.scan .textes{display:flex;flex-direction:column;gap:14px}.scan .textes img{width:100%;border-radius:10px;border:1px solid #ddd}.scan .textes span{font-weight:400}
.scan canvas{touch-action:pan-y}
.rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rep div{background:var(--fond);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.rep div.vide{outline:2px dashed var(--gris);outline-offset:-2px}
.rep span{flex:1;min-width:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rep p{margin:4px 0 0;flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.rep button{width:40px;height:40px;border-radius:50%;border:0;background:#fff;box-shadow:inset 0 0 0 2px var(--n);font-weight:800;cursor:pointer}
.rep button[aria-pressed=true]{background:var(--n);color:#fff}
.scan ol{margin:0;padding-left:1.3em;color:var(--gris);font-size:15px}
@media print{body{background:#fff}nav,.trop{display:none!important}#vue{padding:0;gap:0;display:block}.page{box-shadow:none;break-after:page;width:auto;min-height:0}.page.fiche{height:297mm;width:420mm}.page.affiche{height:297mm;width:210mm}.page.diapo{width:297mm;height:210mm}}

<nav>
  <a class="lien" href="./" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="1.35em" height="1.35em" fill="currentColor" aria-hidden="true" style="vertical-align:-.3em"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg></a><b>Version papier</b>
  <button class="btn" data-v="fiche" data-ico="feuille">Le livret à plier</button><button class="btn" data-v="apercu" data-ico="oeil">Aperçu plié</button><button class="btn" data-v="diapos">La présentation</button><button class="btn" data-v="affiches" data-ico="image">Les affiches</button><button class="btn" data-v="lire">Photographier les fiches</button>

<div id="vue"><p>Chargement…</p></div>
<script>/* le livret est fait pour une affiche : sans test choisi, c'est le carnet 1 (le test principal, lui, enchaîne les trois affiches) */ if (!/[?&]test=/.test(location.search)) location.replace(location.pathname + (location.search ? location.search + '&' : '?') + 'test=affiche-1' + location.hash);</script>
<script src="seance.js"></script>
<script src="livret-fond.js"></script>
<script>
// Version papier de la séance, toujours fabriquée à partir de seance.txt (donc à jour après chaque modification) :
//  - le livret : une seule feuille A3 par personne, pliée en huit volets (une couleur par étape), avec les questions, un rond par réponse et quatre repères dans les coins (des ronds noirs à deux yeux blancs).
//    Aucune image dessus : les affiches sont montrées par le grand écran en mode papier (ou par la présentation imprimée) ;
//  - la présentation : les écrans du grand écran, un par page, sans les résultats ;
//  - photographier les fiches : la photo d'une fiche remplie est lue ici, dans le navigateur (rien n'est envoyé à un service d'analyse),
//    on corrige d'un clic si besoin, puis les réponses partent dans le Google Sheet comme celles des téléphones.
const h = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/ ([?!:;»])/g, '&nbsp;$1').replace(/« /g, '«&nbsp;');
const $ = id => document.getElementById(id), LETTRES = 'ABCDEFGHIJ';
const etiq = (e, i) => e.t === 'echelle' ? String(i + 1) : e.t === 'ab' && i === e.o.length - 1 ? '=' : LETTRES[i]; // ce qui est écrit dans chaque rond
const choix = e => e.t === 'echelle' ? ['1', '2', '3', '4', '5'] : e.o || []; // un avis libre n'a pas de rond
const groupe = e => e.p ? 'Étape ' + e.p : "Jeu de l'œil";
let vue = new URLSearchParams(location.search).get('vue'); if (!['diapos', 'lire', 'apercu', 'affiches'].includes(vue)) vue = 'fiche';

// ---------- le livret : la feuille A3 du modèle d'Augustin (« questionnaire template »), reproduite trait pour trait ----------
// Le fond (cadres, ronds décoratifs et leurs yeux, titre, logo, pointillé, bulles) vient tel quel de son PDF : livret-fond.js, fabriqué par livret-modele/extraire.py.
// L'appli n'y ajoute que ce qui change d'un test à l'autre, aux positions mesurées dans le modèle : numéros, questions, ronds de réponse.
// Rangée du bas : dos, couverture, puis les deux volets du temps 1. Rangée du haut, tête en bas : temps 2 à droite, temps 3 à gauche.
// Les mêmes positions, en millimètres de la feuille dépliée, servent à l'impression ET à la lecture de la photo.
const VW = 105, VH = 148.5, PAGES = [[105, 1], [210, 1], [315, 1], [315, 0], [210, 0], [105, 0], [0, 0], [0, 1]]; // les huit pages dans l'ordre de lecture : [bord gauche, 1 = rangée du bas]
const RAYON = 3.35, PAS = 10.08, RANG = 22, COULEURS = ['#F4A1C6', '#F8C237', '#3E6EB6'], TRAITS = [.35, .35, .18];
const REPERES = [[13.5, 13.5], [406.5, 13.5], [13.5, 283.5], [406.5, 283.5]]; // quatre ronds noirs : absents du modèle, ajoutés pour lire la photo. Un par coin de la feuille, à 13,5 mm des bords.
// Ce qui se trouvait dans ces coins recule : la bulle « Débattons ! » du modèle, son petit rond et ses yeux (et les deux bulles redessinées en haut, qui suivent).
const RECUL = -12, PARLEUR = ['M407.08 283.86', 'M406.74 285.88', 'M407.87 285.24']; // le petit rond qui parle sous la bulle, et ses deux yeux
// Le reste du modèle (dos et couverture compris) est gardé tel quel.
const TRACES = LIVRET_FOND.match(/<\w+ [^>]*>/g), compte = { bulle: 0 };
const FOND = TRACES.map(p => { if (['M403.36 272.72', ...PARLEUR].some(t => p.includes('d="' + t))) { compte.bulle++; return p.replace('<path ', `<path transform="translate(${RECUL} 0)" `); } return p; }).join('');
if (TRACES.join('').length !== LIVRET_FOND.length || compte.bulle !== 4) throw new Error('livret-fond.js a changé, la bulle ne se retrouve plus : ' + JSON.stringify(compte));
const parleur = c => PARLEUR.map((t, i) => { const p = TRACES.find(x => x.includes('d="' + t)); return i ? p : p.replace(/fill="[^"]*"/, `fill="${c}"`); }).join(''); // le même petit rond, dans la couleur de l'étape
// les six volets de questions, dans l'ordre de lecture : x du numéro, x du texte, x du 1er rond, y de la 1re ligne, sens (1 à l'endroit, -1 tête en bas), bord du cadre côté ronds, puis x et y de « Temps N »
const VOLETS = [[220.2, 226.8, 230.3, 184.8, 1, 308.9, 220.2, 164.8], [324.1, 330.6, 334.1, 184.8, 1, 413.9, 324.1, 164.8], [408, 401.5, 397.9, 113.1, -1, 321.2, 397, 133], [304.1, 297.6, 294.1, 113.1, -1, 216.2, 304.1, 133], [197.9, 191.4, 187.9, 113.3, -1, 111.2, 186, 133], [94.1, 87.6, 84, 113.3, -1, 6.2, 94.1, 133]];
const EXEMPLE = new URLSearchParams(location.search).has('exemple'); // ?exemple : un livret déjà rempli, pour essayer la lecture par photo
function geometrie(Q) { // un temps = une couleur = deux volets de quatre questions, comme dans le modèle
  const etapes = [...new Set(Q.map(e => e.p || 0))].sort((a, b) => a - b), rang = e => Math.min(2, etapes.indexOf(e.p || 0)), G = []; let trop = etapes.length > 3;
  [0, 1, 2].forEach(k => { const q = Q.filter(e => rang(e) === k), moitie = Math.min(q.length, Math.max(4, Math.ceil(q.length / 2)));
    [q.slice(0, moitie), q.slice(moitie)].forEach((l, m) => { const V = VOLETS[k * 2 + m], [, xt, xc, yt, s, bord] = V, R = RANG * Math.min(1, 4 / Math.max(l.length, 1)); if (l.length > 5) trop = true; // au-delà de quatre, les lignes se resserrent
      l.forEach((e, i) => { const n = choix(e).length, pas = Math.min(PAS, (Math.abs(bord - xc) - RAYON - 2) / Math.max(n - 1, 1)), y = yt + s * i * R, g = { e, k, V, y, i: Q.indexOf(e) }; // plus de huit réponses : les ronds se rapprochent
        g.ronds = choix(e).map((_, j) => [xc + s * j * pas, y + s * 11.5]);
        g.zone = [[xt, y + s * 6.8], [bord - s * 4, y + s * 6.8], [xt, y + s * 16.4], [bord - s * 4, y + s * 16.4]]; // là où s'écrit un avis libre
        if (e.t === 'texte') g.crans = [[xt - s * 1.4, y + s * 7.4], [bord - s * 3, y + s * 7.4], [xt - s * 1.4, y + s * 15.8], [bord - s * 3, y + s * 15.8]]; // quatre petits carrés noirs autour : la lecture de la photo s'y recale
        G.push(g); }); }); });
  G.sort((a, b) => a.i - b.i); G.trop = trop; return G;
}
// Une séance teste trois affiches : trois carnets par personne, un par affiche. carnet = son numéro ; affiche = l'image imprimée au dos de la feuille (facultatif).
function fiche(Q, carnet = 1, affiche = '') {
  const G = geometrie(Q), T = (x, y, t, o = '', s = 1) => `<text ${s < 0 ? `transform="rotate(180 ${x} ${y})" ` : ''}x="${x}" y="${y}" ${o}>${t}</text>`; // s = -1 : écrit tête en bas, comme les volets du haut
  const petit = 'font-size="2.3" fill="#8A8A8A" text-anchor="middle"'; // les mots d'une note ou d'une comparaison : petits, gris, sous le rond qu'ils nomment
  const questions = G.map(g => { const [xn, xt, , , s] = g.V, c = COULEURS[g.k], e = g.e, fin = g.ronds.length ? g.ronds[g.ronds.length - 1] : null;
    return T(xn, g.y + s * .4, e.n, 'font-size="4.23" font-weight="700"', s)
      + (e.t === 'texte' ? [10.5, 15.5].map(d => `<line x1="${xt}" x2="${g.zone[1][0]}" y1="${g.y + s * d}" y2="${g.y + s * d}" stroke="#151515" stroke-width=".2" stroke-dasharray=".4 1"/>`).join('') + g.crans.map(([x, y]) => `<rect x="${+(x - .6).toFixed(2)}" y="${+(y - .6).toFixed(2)}" width="1.2" height="1.2" fill="#151515"/>`).join('') : '')
      + g.ronds.map(([x, y], j) => { const r = e.t === 'echelle' ? [3.35, 2.95, 2.55, 2.95, 3.35][j] : RAYON; // une note : ronds progressifs. Jamais sous 2,5 mm : la lecture de la photo regarde le cœur du rond
        return `<circle cx="${+x.toFixed(2)}" cy="${+y.toFixed(2)}" r="${r}" fill="#fff" stroke="${c}" stroke-width="${TRAITS[g.k]}"/>` + (e.t === 'echelle' ? '' : T(+x.toFixed(2), +(y + s * 1.25).toFixed(2), etiq(e, j), 'font-size="3.6" font-weight="700" fill="#A8A8A8" text-anchor="middle"', s))
          + (EXEMPLE && (j === (g.i * 3 + 1) % g.ronds.length || e.t === 'multi' && j === g.i % g.ronds.length) ? `<circle cx="${+(x + .2).toFixed(2)}" cy="${+(y - .1).toFixed(2)}" r="${+(r * .86).toFixed(2)}" fill="#1B2A6B"/>` : ''); }).join('')
      + (e.t === 'echelle' ? T(g.ronds[0][0], g.ronds[0][1] + s * 6.1, h(e.a), petit, s) + T(fin[0], fin[1] + s * 6.1, h(e.b), petit, s) : e.t === 'ab' ? T(fin[0], fin[1] + s * 6.1, 'aucune différence', petit, s) : ''); }).join(''); // « plusieurs réponses possibles » est dit par le grand écran
  const temps = VOLETS.map((V, v) => G.some(g => g.V === V) ? T(V[6], V[7], 'Étape ' + ((v >> 1) + 1), 'font-size="4.23" font-weight="800"', V[4]) : '').join('');
  return (G.trop && carnet === 1 ? `<p class="trop">Il y a trop de questions pour ce livret (huit par étape, trois étapes) : masquez-en quelques-unes dans « Modifier le test ».</p>` : '') + `<div class="page fiche">
  <svg viewBox="0 0 420 297" xmlns="http://www.w3.org/2000/svg" font-family="'Scoutie Sans',Helvetica,Arial,sans-serif" fill="#151515">
    ${FOND}
    ${T(117, 263.9, 'Votre affiche est en cours de Fabrication', 'font-size="3.3"')}${T(117, 267.8, 'Nous avons besoin de votre aide !', 'font-size="3.3"')}${T(379.6 + RECUL, 278.4, 'Débattons !', 'font-size="4.04" font-weight="700"')}
    ${[[1, 315], [2, 210]].map(([k, cx]) => `<g transform="rotate(180 ${cx} 148.5)"><g transform="translate(${RECUL} 0)"><path d="${LIVRET_BULLE}" fill="${COULEURS[k]}"/>${parleur(COULEURS[k])}</g>${T(379.6 + RECUL, 278.4, 'Débattons !', 'font-size="4.04" font-weight="700"' + (k === 2 ? ' fill="#fff"' : ''))}</g>`).join('')}
    ${temps}${questions}
    ${REPERES.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.5" fill="#000"/><circle cx="${x - 1}" cy="${y}" r=".65" fill="#fff"/><circle cx="${x + 1}" cy="${y}" r=".65" fill="#fff"/>`).join('')}
  </svg>
  ${G.map(g => { const [, xt, , , s, bord] = g.V, w = Math.abs(bord - xt) - 4, hh = 9.9; // deux lignes de question, à la place exacte du texte du modèle
    return `<div class="ft" style="left:${s > 0 ? xt : xt - w}mm;top:${s > 0 ? g.y - 3.55 : g.y + 3.55 - hh}mm;width:${w}mm;height:${hh}mm${s > 0 ? '' : ';transform:rotate(180deg)'}"><b>${h(g.e.q)}</b></div>`; }).join('')}
  </div>` + (affiche ? `<div class="page fiche verso"><img src="${h(affiche)}" alt="L'affiche du carnet ${carnet}, imprimée au dos"></div>` : '');
}
// les trois affiches de la séance : celles choisies sur cet appareil, sinon les premières du test (les mises en situation ne comptent pas)
const affichesDispo = () => [...new Set(ETAPES.flatMap(e => [e.img, ...(e.imgs || [])]).filter(x => x && !/\/lieu-/.test(x)))];
const affichesCarnets = () => { const l = affichesDispo(); let c = []; try { c = JSON.parse(localStorage.getItem('pdvCarnets' + TEST)) || []; } catch (e) { } return [0, 1, 2].map(i => l.includes(c[i]) ? c[i] : (NUM_TEST ? l[0] : l[i]) || l[0] || ''); };
const NUM_TEST = TEST ? +((/-(\d)$/.exec(TEST) || [])[1]) || 0 : 1; // le carnet de ce test : 1 pour le test principal, 2 et 3 pour « affiche-2 » et « affiche-3 » (0 : un test hors séance à trois affiches)
let seul = NUM_TEST; // 0 : les trois carnets ; 1, 2 ou 3 : ce carnet seulement (une feuille recto verso)
const livrets = Q => { const A = affichesCarnets(), l = affichesDispo();

    <div class="regl"><button class="btn noir" id="envoyer" disabled>Enregistrer dans le Google Sheet</button>${QUI() ? '<a class="btn" href="https://docs.google.com/spreadsheets/d/14uvOfNQwjgMOH83hJhnWea9Df3Cidhhs4rUefRrQ2wk" target="_blank" rel="noopener">Ouvrir le Google Sheet</a>' : ''}</div></div>`;
}

// ---------- l'aperçu plié : le livret tel qu'on le feuillette, sans rien imprimer ----------
// Chaque page est une fenêtre sur la feuille dépliée (retournée pour les volets du haut) : l'aperçu ne peut donc pas différer de l'impression.
function apercu(Q) {
  const feuille = fiche(Q).replace(/^[\s\S]*?<div class="page fiche">/, '').replace(/<\/div>\s*$/, ''), V = PAGES; // couverture, six pages, dos
  const page = ([px, bas]) => `<div class="volet"><div style="transform:${bas ? `translate(${-px}mm,${-VH}mm)` : `translate(${px + VW}mm,${VH}mm) rotate(180deg)`}">${feuille}</div></div>`;
  const noms = ['La couverture', 'Pages 1 et 2', 'Pages 3 et 4', 'Pages 5 et 6', 'Le dos'];
  return ``
    + [[0], [1, 2], [3, 4], [5, 6], [7]].map((l, i) => `<figure class="double"><div>${l.map(k => page(V[k])).join('')}</div><figcaption>${noms[i]}</figcaption></figure>`).join('');
}
// ---------- le reste à imprimer : les affiches du test, une par page A4 ----------
function affiches() {
  const l = [...new Set(ETAPES.flatMap(e => [e.img, ...(e.imgs || [])]).filter(Boolean))];
  return l.length ? l.map((s, i) => `<div class="page affiche"><img src="${h(s)}" alt="Affiche ${i + 1} du test"></div>`).join('') : '<p class="trop">Ce test ne montre aucune affiche.</p>';
}

// ---------- affichage ----------
function dessiner() {
  const Q = QUESTIONS();
  document.querySelectorAll('nav [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === vue));
  $('feuille').textContent = `@page{size:${vue === 'diapos' ? 'A4 landscape' : vue === 'affiches' ? 'A4 portrait' : 'A3 landscape'};margin:0}`;
  $('imprimer').hidden = vue === 'lire' || vue === 'apercu';
  $('vue').innerHTML = vue === 'diapos' ? diapos(Q) : vue === 'lire' ? vueLire() : vue === 'apercu' ? apercu(Q) : vue === 'affiches' ? affiches() : livrets(Q);
  ajuster(); if (document.fonts) document.fonts.ready.then(ajuster);
  const u = new URLSearchParams(location.search); u.set('vue', vue); history.replaceState(null, '', '?' + u);
}
document.querySelector('nav').addEventListener('click', ev => { const b = ev.target.closest('[data-v]'); if (b) { vue = b.dataset.v; lu = null; dessiner(); } });
$('imprimer').addEventListener('click', () => print());
$('vue').addEventListener('change', ev => {
  if (ev.target.dataset.seul != null) { seul = +ev.target.value || 0; dessiner(); return; }
  if (ev.target.dataset.carnet != null) { const c = affichesCarnets(); c[+ev.target.dataset.carnet] = ev.target.value; try { localStorage.setItem('pdvCarnets' + TEST, JSON.stringify(c)); } catch (e) { } dessiner(); return; }
  if (ev.target.id !== 'fichier' || !ev.target.files[0]) return;
  const img = new Image(); $('etat').textContent = 'Lecture de la photo…';
  img.onload = () => { try { lu = lireImage(img, QUESTIONS()); ['photo', 'regl', 'rep'].forEach(i => $(i).hidden = false); tracer(); zonesTexte(); } catch (err) { lu = null; ['photo', 'regl', 'rep', 'textes'].forEach(i => $(i).hidden = true); $('envoyer').disabled = true; $('etat').textContent = "Cette photo ne se lit pas. Reprenez-la, avec toute la fiche dans l'image."; } };
  img.onerror = () => { $('etat').textContent = "Ce fichier n'est pas une photo lisible (essayez en JPEG ou PNG)."; };
  img.src = URL.createObjectURL(ev.target.files[0]); ev.target.value = '';
});
$('vue').addEventListener('input', ev => { const i = ev.target.dataset.txt; if (i != null && lu) { lu.txt[i] = ev.target.value; tracer(); } }); // ce qu'on recopie d'une réponse écrite
// corriger une réponse : sur la photo ou dans la liste, un clic inverse le rond (un seul rond par question, sauf les questions à astérisque)
const basculer = (i, j) => { const coche = !lu.coche[i][j]; if (coche && lu.G[i].e.t !== 'multi') lu.coche[i] = lu.coche[i].map(() => false); lu.coche[i][j] = coche; tracer(); };
// recaler la photo : chaque poignée orange se fait glisser sur son rond noir, et tous les ronds sont relus
let prise = -1, glisse = false;
const surPhoto = ev => { const c = $('photo'), b = c.getBoundingClientRect(); return [(ev.clientX - b.left) * c.width / b.width, (ev.clientY - b.top) * c.height / b.height]; };
const poignee = (cible, ev) => { if (!lu || cible.id !== 'photo') return -1; const [u, v] = surPhoto(ev), r = lu.image.width * .04; return lu.coins.findIndex(p => Math.hypot(p[0] - u, p[1] - v) < r); };
$('vue').addEventListener('pointerdown', ev => { prise = poignee(ev.target, ev); glisse = false; if (prise >= 0) ev.target.setPointerCapture(ev.pointerId); });
$('vue').addEventListener('pointermove', ev => { if (prise < 0 || !lu) return; glisse = true; lu.coins[prise] = surPhoto(ev); lu.dx = lu.dy = 0; lu.trouve = true; lu.caler(); tracer(); });
['pointerup', 'pointercancel'].forEach(t => $('vue').addEventListener(t, () => { if (prise >= 0 && glisse && lu) zonesTexte(); prise = -1; }));
$('vue').addEventListener('touchstart', ev => { if (poignee(ev.target, ev.touches[0]) >= 0) ev.preventDefault(); }, { passive: false }); // le doigt sur une poignée ne fait pas défiler la page
$('vue').addEventListener('click', ev => {
  const r = ev.target.closest('[data-r]'); if (r && lu) { const [i, j] = r.dataset.r.split(',').map(Number); basculer(i, j); const b = document.querySelector(`[data-r="${i},${j}"]`); if (b) b.focus(); }
  if (ev.target.id === 'photo' && lu && !glisse) { // un clic sur un rond inverse sa lecture
    const [u, v] = surPhoto(ev); let mieux = null, dm = 1e9;
    lu.G.forEach((g, i) => g.ronds.forEach((p, j) => { const [x, y] = lu.H(p[0], p[1]), d = Math.hypot(x - u, y - v); if (d < dm) { dm = d; mieux = [i, j]; } }));
    const p0 = lu.G.find(g => g.ronds.length).ronds[0], [x1, y1] = lu.H(p0[0], p0[1]), [x2, y2] = lu.H(p0[0] + RAYON * 2, p0[1]);
    if (mieux && dm < Math.hypot(x2 - x1, y2 - y1)) basculer(...mieux);
  }
  const dec = ev.target.closest('[data-d]'); if (dec && lu) { // décaler toute la grille d'un millimètre, puis relire les ronds à leur nouvelle place
    const [x, y] = dec.dataset.d.split(',').map(Number); if (y == null) { lu.dx = lu.dy = 0; } else { lu.dx += x; lu.dy += y; } lu.relire(); tracer(); zonesTexte(); }
  if (ev.target.id === 'vider' && lu) { lu.coche = lu.coche.map(l => l.map(() => false)); tracer(); }
  if (ev.target.id === 'envoyer' && lu) {
    const L = lignes(); ev.target.disabled = true; $('etat').textContent = 'Enregistrement…'; declarerVersion();
    fetch(SCRIPT_GOOGLE, { method: 'POST', body: JSON.stringify(L) }).then(x => x.text())
      .then(t => { const ok = /^ok (\d+)/.exec(t); if (!ok) throw new Error(t); // le Sheet répond « ok 12 » quand les 12 lignes sont écrites
        const c = +$('carnet').value; journal('Carnet photographié', `séance ${$('seance').value} · participant ${$('numero').value} · carnet ${c} · ${ok[1]} réponses`);
        $('etat').textContent = `${ok[1]} réponses enregistrées dans le Google Sheet pour le participant ${$('numero').value}, carnet ${c}. ` + (c < 3 ? `Passez à son carnet ${c + 1}.` : 'Passez au participant suivant.');
        if (c < 3) $('carnet').value = c + 1; else { $('carnet').value = 1; $('numero').value = +$('numero').value + 1; } lu = null; ['photo', 'regl', 'rep', 'textes'].forEach(i => $(i).hidden = true); })
      .catch(err => { ev.target.disabled = false; $('etat').textContent = navigator.onLine === false ? "Pas enregistré : pas de connexion internet. Vos corrections sont gardées, réessayez." : "Pas enregistré : le Google Sheet n'a pas confirmé. Vos corrections sont gardées, réessayez dans un instant."; });
  }
});
lireFichier().then(t => { if (!lireSeance(t)) throw 0; dessiner(); noterVisite('Version papier'); }).catch(() => { $('vue').innerHTML = '<p>Le fichier de la séance ne se charge pas.</p>'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { }); // garde le site en mémoire pour les visites suivantes
</script>
