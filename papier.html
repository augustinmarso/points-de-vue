<style>@font-face{font-family:'Scoutie Sans';font-weight:200 800;font-display:swap;src:url(polices/scoutie.woff2) format('woff2')}</style>
<style id="base">
:root{--n:#141414;--gris:#6B6B6B;--fond:#F3F3F3;--c1:#F5A0C6;--c2:#F7C33B;--c3:#1F6FE0;--c4:#7BD3A8;--c5:#B79CF2;--c6:#FF9A6B}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:var(--fond);color:var(--n);font-family:'Scoutie Sans',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.3}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--c3);outline-offset:2px}
nav{position:sticky;top:0;z-index:5;background:#fff;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;box-shadow:0 2px 14px rgba(20,20,20,.12)}
nav b{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-right:auto}
nav a.lien{font-weight:700}
.btn{display:inline-flex;align-items:center;background:var(--fond);color:var(--n);font-weight:800;text-decoration:none;border:0;border-radius:99px;padding:9px 18px;min-height:44px;cursor:pointer}
.btn.on,.btn.noir{background:var(--n);color:#fff}
#vue{padding:22px 12px 60px;display:flex;flex-direction:column;align-items:center;gap:22px}
.page{background:#fff;width:210mm;min-height:297mm;padding:16mm 15mm;box-shadow:0 4px 24px rgba(20,20,20,.16);position:relative}
.page.fiche{padding:0;width:297mm;height:420mm;overflow:hidden}
.ft{position:absolute;overflow:hidden;font-size:4.4mm;line-height:1.1}
.ft b{font-weight:800}.ft span{display:block;font-size:.8em;color:#444}
.trop{background:#fff;border-radius:14px;padding:12px 16px;font-weight:700;max-width:820px}
@media screen{.page.fiche{zoom:.7}}
.page.fiche svg{display:block;width:100%;height:100%}
.page.diapo{width:297mm;min-height:0;height:210mm;padding:16mm 18mm;display:flex;gap:10mm;overflow:hidden;background:var(--b,#fff);color:var(--f,#141414)}
h1{margin:0;font-size:34px;line-height:.95;font-weight:800;letter-spacing:-.045em}
.diapo .g{flex:1;min-width:0;display:flex;flex-direction:column;gap:5mm}
.diapo .sur{font-weight:700;font-size:16px}.diapo .sur::before{content:'';display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--a,#141414);margin-right:.5em;vertical-align:-.06em}.diapo .sur:empty::before{display:none}
.diapo h3{margin:0;font-size:46px;line-height:.92;font-weight:800;letter-spacing:-.05em}
.diapo p{margin:0;font-size:20px;font-weight:700}
.diapo ol{margin:auto 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:3mm 6mm;font-size:19px;font-weight:700}
.diapo ol li{background:var(--fond);border-radius:6mm;padding:3mm 5mm}
.diapo ol li::before{content:attr(data-l);font-weight:800;margin-right:8px}
.diapo .d{display:flex;gap:4mm;align-items:center;flex:none}
.diapo .d img{max-height:100%;max-width:105mm;border-radius:3mm;display:block}
.diapo .d.deux img{max-width:66mm}.diapo .d .zones img{max-height:150mm}.diapo .d .vz{width:min(105mm,calc(150mm*var(--r)))}
.diapo .d figure{margin:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:2mm;font-weight:800;font-size:18px}
.diapo .d figure img{min-height:0;flex:0 1 auto;max-height:calc(100% - 9mm)}
.diapo .no{position:absolute;right:10mm;bottom:7mm;font-size:13px;color:inherit;opacity:.6}
/* lecture d'une fiche */
.scan{background:#fff;border-radius:22px;padding:22px;max-width:820px;width:100%;display:flex;flex-direction:column;gap:14px}
.scan label{display:flex;flex-direction:column;gap:6px;font-weight:800}
.scan input[type=text],.scan input[type=number]{background:var(--fond);border:0;border-radius:14px;padding:12px 14px;min-height:46px;font-weight:400;width:100%}
.scan .deux{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scan canvas{width:100%;border-radius:14px;cursor:pointer;display:block;background:var(--fond)}
.scan .etat{font-weight:700}
.scan .regl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.scan .regl b{margin-right:6px}
.scan .textes{display:flex;flex-direction:column;gap:14px}.scan .textes img{width:100%;border-radius:10px;border:1px solid #ddd}.scan .textes span{font-weight:400}
.scan canvas{touch-action:pan-y}
.rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rep div{background:var(--fond);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.rep div.vide{outline:2px dashed var(--gris);outline-offset:-2px}
.rep span{flex:1;min-width:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rep p{margin:4px 0 0;flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.rep button{width:40px;height:40px;border-radius:50%;border:0;background:#fff;box-shadow:inset 0 0 0 2px var(--n);font-weight:800;cursor:pointer}
.rep button[aria-pressed=true]{background:var(--n);color:#fff}
.scan ol{margin:0;padding-left:1.3em;color:var(--gris);font-size:15px}
@media print{body{background:#fff}nav,.trop{display:none!important}#vue{padding:0;gap:0;display:block}.page{box-shadow:none;break-after:page;width:auto;min-height:0}.page.fiche{height:420mm;width:297mm}.page.diapo{width:297mm;height:210mm}}

<body>
<nav>
  <a class="lien" href="./" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="1.35em" height="1.35em" fill="currentColor" aria-hidden="true" style="vertical-align:-.3em"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg></a><b>Version papier</b>
  <button class="btn" data-v="fiche">La fiche A3</button><button class="btn" data-v="diapos">La présentation</button><button class="btn" data-v="lire">Photographier les fiches</button>
  <button class="btn noir" id="imprimer">Imprimer</button>
</nav>
<div id="vue"><p>Chargement…</p></div>
<script src="seance.js"></script>
<script>
// Version papier de la séance, toujours fabriquée à partir de seance.txt (donc à jour après chaque modification) :
//  - la fiche A3 : une seule feuille par personne, avec les questions, un rond par réponse et quatre repères dans les coins (des ronds noirs à deux yeux blancs).
//    Aucune image dessus : les affiches sont montrées par le grand écran en mode papier (ou par la présentation imprimée) ;
//  - la présentation : les écrans du grand écran, un par page, sans les résultats ;
//  - photographier les fiches : la photo d'une fiche remplie est lue ici, dans le navigateur (rien n'est envoyé à un service d'analyse),
//    on corrige d'un clic si besoin, puis les réponses partent dans le Google Sheet comme celles des téléphones.
const h = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/ ([?!:;»])/g, '&nbsp;$1').replace(/« /g, '«&nbsp;');
const $ = id => document.getElementById(id), LETTRES = 'ABCDEFGHIJ';
const etiq = (e, i) => e.t === 'echelle' ? String(i + 1) : e.t === 'ab' && i === e.o.length - 1 ? '=' : LETTRES[i]; // ce qui est écrit dans chaque rond
const choix = e => e.t === 'echelle' ? ['1', '2', '3', '4', '5'] : e.o || []; // un avis libre n'a pas de rond
const groupe = e => e.p ? 'Étape ' + e.p : "Jeu de l'œil";
let vue = new URLSearchParams(location.search).get('vue'); if (vue !== 'diapos' && vue !== 'lire') vue = 'fiche';

// ---------- la fiche A3 : sa géométrie, en millimètres, sert à l'impression ET à la lecture ----------
// Chaque question : son numéro, son texte, puis une rangée de gros ronds marqués A, B, C… (ou 1 à 5). Le texte des réponses est sur le grand écran.
const REPERES = [[14, 14], [283, 14], [14, 406], [283, 406]], COTE = 10, RAYON = 4.6, PAS = 12.4, LCOL = 132, Y0 = 56, HAUT = 342;
const EXEMPLE = new URLSearchParams(location.search).has('exemple'); // ?exemple : une fiche déjà remplie, pour essayer la lecture par photo
function geometrie(Q) { // deux colonnes de même hauteur, étirées pour remplir la feuille
  const ht = e => e.t === 'texte' ? 30 : 20, total = Q.reduce((a, e) => a + ht(e), 0);
  let c = 0, k1 = 0; while (k1 < Q.length && c + ht(Q[k1]) / 2 < total / 2) c += ht(Q[k1++]);
  const f = Math.min(1.35, HAUT / Math.max(c, total - c, 1)); let y = Y0;
  const G = Q.map((e, k) => { if (k === k1) y = Y0; const x = 20 + (k >= k1) * LCOL, g = { e, x, y, h: ht(e) * f };
    g.ronds = choix(e).map((_, j) => [x + 14 + j * PAS, y + g.h - 6.6]); y += g.h; return g; });
  G.trop = f < .95; return G; // en dessous, le texte de la question n'a plus de place au-dessus des ronds
}
function fiche(Q) {
  const G = geometrie(Q);
  return (G.trop ? `<p class="trop">Il y a trop de questions pour une seule fiche A3 : masquez-en quelques-unes dans « Modifier le test ».</p>` : '') + `<div class="page fiche">
  <svg viewBox="0 0 297 420" xmlns="http://www.w3.org/2000/svg" font-family="'Scoutie Sans',Helvetica,Arial,sans-serif">
    ${REPERES.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${COTE / 2}" fill="#000"/><circle cx="${x - 1.3}" cy="${y}" r=".8" fill="#fff"/><circle cx="${x + 1.3}" cy="${y}" r=".8" fill="#fff"/>`).join('')}
    <text x="24" y="18" font-size="8" font-weight="800" letter-spacing="-.3">Points de vue · votre fiche</text>
    <text x="24" y="26" font-size="4.2">Les réponses sont sur le grand écran. Noircissez le rond de la lettre choisie. Avec un astérisque (*), plusieurs ronds sont possibles.</text>
    <text x="24" y="37" font-size="4.6" font-weight="700" xml:space="preserve">Séance : ........................      Participant n° : ............      Test ${h(VERSION)}</text>
    <text x="24" y="45" font-size="3.2" fill="#6B6B6B">Les quatre ronds noirs servent à la lecture de la photo : ne rien écrire dessus.</text>
    ${G.map(g => `<rect x="${g.x + .6}" y="${g.y + 7.4}" width="6.6" height="1.7" rx=".85" style="fill:${g.e.p ? `var(--c${g.e.p})` : '#141414'}"/><text x="${g.x + 7}" y="${g.y + 5.6}" font-size="5.6" font-weight="800" text-anchor="end">${g.e.n}${g.e.t === 'multi' ? '*' : ''}</text>`
      + (g.e.t === 'texte' ? [4, 13].map(d => `<line x1="${g.x + 9}" x2="${g.x + LCOL - 8}" y1="${g.y + g.h - d}" y2="${g.y + g.h - d}" stroke="#141414" stroke-width=".2" stroke-dasharray=".4 1"/>`).join('') : '')
      // chaque rond porte deux yeux gris ; sa lettre est écrite en petit à côté. Une note : cinq ronds, grands aux deux bouts et petit au milieu, sans chiffre
      + g.ronds.map(([x, y], j) => { const r = g.e.t === 'echelle' ? [4.6, 3.9, 3.3, 3.9, 4.6][j] : RAYON; // jamais sous 3,3 mm : la lecture de la photo regarde le cœur du rond
        return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${g.e.t === 'echelle' && j === 2 ? '#8A8A8A' : '#141414'}" stroke-width=".35"/><circle cx="${x - .95}" cy="${y}" r=".5" fill="#A8A8A8"/><circle cx="${x + .95}" cy="${y}" r=".5" fill="#A8A8A8"/>`
        + (g.e.t === 'echelle' ? '' : `<text x="${x - 4.9}" y="${y - 2.6}" font-size="3" font-weight="800" text-anchor="end">${etiq(g.e, j)}</text>`)
        + (EXEMPLE && (j === (g.e.n * 3 + 1) % g.ronds.length || g.e.t === 'multi' && j === g.e.n % g.ronds.length) ? `<circle cx="${x + .3}" cy="${y - .2}" r="${r * .86}" fill="#1B2A6B"/>` : ''); }).join('')
      + (g.e.t === 'echelle' ? `<text x="${g.ronds[4][0] + 7}" y="${g.ronds[4][1] + 1.3}" font-size="3.6" font-weight="700">${h(g.e.b)}</text>` : '')).join('')}
    ${EXEMPLE ? '<text x="47" y="36" font-size="5" fill="#1B2A6B">essai</text><text x="124" y="36" font-size="5" fill="#1B2A6B">1</text>' : ''}
  </svg>
  ${G.map(g => { const e = g.e;
    return `<div class="ft" style="left:${g.x + 9}mm;top:${g.y + 1}mm;width:${LCOL - 17}mm;height:${g.h - (e.t === 'texte' ? 21 : 13)}mm"><b>${h(e.q)}</b>${e.t === 'echelle' ? `<span>À gauche : ${h(e.a)} · à droite : ${h(e.b)}</span>` : e.t === 'ab' ? '<span>= si vous ne voyez pas de différence.</span>' : e.t === 'texte' ? '<span>Écrivez votre réponse sur les lignes.</span>' : ''}</div>`; }).join('')}
  </div>`;
}
// un texte trop long pour sa case rétrécit jusqu'à tenir
const ajuster = () => document.querySelectorAll('.ft').forEach(d => { let t = parseFloat(d.style.fontSize) || 4.4; while (d.scrollHeight > d.clientHeight + 1 && t > 2.6) d.style.fontSize = (t -= .15) + 'mm'; });

// ---------- la présentation papier : les écrans du grand écran, sans les résultats ----------
function diapos(Q) {
  const num = Object.fromEntries(Q.map(e => [e.id, e.n])), T = { accueil: ['Points de vue · habitants testeurs', 'Bienvenue !', "Vous participez à une recherche pour converger vers l'affiche la plus intéressante."], scores: ["Le jeu de l'œil", 'Les réussites', ''], mission: ['Atelier · à deux', "Fabriquez l'affiche qui fait le mieux passer cette information", MISSIONS[0]], photo: ['Atelier', 'Vos affiches', "Photographiez l'affiche de votre binôme."], vote: ['Atelier', 'Les tests des affiches', TESTS.map(t => t.q).join(' · ')], palmares: ['Atelier', 'Le palmarès', ''], fin: ['', 'Merci !', "Vos observations vont servir à retravailler l'affiche."] };
  return ETAPES.map((e, i) => {
    let g, d = '', st = '';
    const im = (e.t === 'flash' ? [e.img] : e.jeu ? [] : e.imgs || []).filter(Boolean);
    if (e.t === 'phase') { st = `--b:var(--c${e.p});--f:${e.p === 3 ? '#fff' : '#141414'};--a:transparent`; g = `<div class="sur">Étape ${e.p} sur ${NB_ETAPES()}</div><h3>${h(PHASES[e.p].nom)}</h3><p>${h(PHASES[e.p].quoi)}</p>`; }
    else if (e.t === 'info') g = `<div class="sur">${h(e.s)}</div><h3>${h(e.h)}</h3><p>${h(e.x)}</p>`;
    else if (e.t === 'flash') g = `<div class="sur">${e.p ? 'Étape ' + e.p : "Le jeu de l'œil"}</div><h3>Le test des ${e.s || 5} secondes</h3><p>L'affiche est montrée ${e.s || 5} secondes, puis cachée.</p>`;
    else if (e.q != null) g = `<div class="sur">${e.p ? 'Étape ' + e.p + ' · ' + h(PHASES[e.p].nom) : "Le jeu de l'œil"} · question ${num[e.id]}</div><h3>${h(e.q)}</h3>${e.note ? `<p>${h(e.note)}</p>` : ''}${e.t === 'echelle' ? `<p>1 = ${h(e.a)} · 5 = ${h(e.b)}</p>` : ''}
      <ol>${choix(e).map((o, j) => `<li data-l="${etiq(e, j)}">${e.t === 'echelle' ? '' : h(o)}</li>`).join('')}</ol>`;
    else { const t = T[e.t] || ['', '', '']; g = `<div class="sur">${h(t[0])}</div><h3>${h(t[1])}</h3><p>${h(t[2])}</p>`; }
    if (im.length) d = `<div class="d${im.length > 1 ? ' deux' : ''}">${im.map((s, j) => `<figure>${im.length > 1 ? 'AB'[j] : ''}${e.zones ? carteZones(e, s) : cadree(e) ? afficheCadree(e, s) : `<img src="${h(s)}" alt="">`}</figure>`).join('')}</div>`;
    return `<div class="page diapo" style="${st || (e.p ? `--a:var(--c${e.p})` : '')}"><div class="g">${g}</div>${d}<span class="no">${i + 1} / ${ETAPES.length}</span></div>`;
  }).join('');
}

// ---------- lire une fiche : repères, redressement, lecture des ronds ----------
let lu = null; // { image, G, coche: [[bool…]…], H }
function resoudre(A, b) { // élimination de Gauss
  const n = b.length; for (let i = 0; i < n; i++) A[i].push(b[i]);
  for (let i = 0; i < n; i++) { let m = i; for (let k = i + 1; k < n; k++) if (Math.abs(A[k][i]) > Math.abs(A[m][i])) m = k; [A[i], A[m]] = [A[m], A[i]];
    for (let k = i + 1; k < n; k++) { const f = A[k][i] / A[i][i]; for (let j = i; j <= n; j++) A[k][j] -= f * A[i][j]; } }
  const x = Array(n).fill(0); for (let i = n - 1; i >= 0; i--) { let s = A[i][n]; for (let j = i + 1; j < n; j++) s -= A[i][j] * x[j]; x[i] = s / A[i][i]; } return x;
}
function homographie(src, dst) { // passe des millimètres de la fiche aux pixels de la photo
  const A = [], b = []; src.forEach(([x, y], i) => { const [u, v] = dst[i]; A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u); A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v); });
  const k = resoudre(A, b); return (x, y) => { const w = k[6] * x + k[7] * y + 1; return [(k[0] * x + k[1] * y + k[2]) / w, (k[3] * x + k[4] * y + k[5]) / w]; };
}
function trouverReperes(gris, W, H) { // dans chaque coin de la photo, la tache sombre et pleine, ronde (ou carrée sur les anciennes fiches), la plus proche du coin
  const pas = Math.max(1, Math.round(W / 420)), w = Math.floor(W / pas), hh = Math.floor(H / pas), s = new Uint8Array(w * hh); let somme = 0;
  for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++) { const v = gris[y * pas * W + x * pas]; s[y * w + x] = v; somme += v; }
  const seuil = somme / (w * hh) * .55, vu = new Uint8Array(w * hh), taches = [];
  for (let d = 0; d < w * hh; d++) { if (vu[d] || s[d] > seuil) continue;
    const pile = [d]; vu[d] = 1; let n = 0, sx = 0, sy = 0, x0 = w, x1 = 0, y0 = hh, y1 = 0;
    while (pile.length) { const p = pile.pop(), x = p % w, y = (p - x) / w; n++; sx += x; sy += y; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (const q of [p - 1, p + 1, p - w, p + w]) { if (q < 0 || q >= w * hh || vu[q] || s[q] > seuil) continue; if ((q === p - 1 && x === 0) || (q === p + 1 && x === w - 1)) continue; vu[q] = 1; pile.push(q); } }
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1; if (bw < w * .012 || bw > w * .12 || bh < w * .012 || bh > w * .12 || bw / bh < .55 || bw / bh > 1.8 || n / (bw * bh) < .6) continue;
    taches.push([sx / n * pas, sy / n * pas]); }
  return [[0, 0], [W, 0], [0, H], [W, H]].map(([cx, cy]) => { const c = taches.filter(([x, y]) => (x < W / 2) === (cx === 0) && (y < H / 2) === (cy === 0)).sort((a, b) => Math.hypot(a[0] - cx, a[1] - cy) - Math.hypot(b[0] - cx, b[1] - cy))[0]; if (!c) throw new Error('repère'); return c; });
}
function orienter(gris, W, H, P) { // la fiche peut être photographiée couchée ou tête en bas : on garde le sens où elle est debout, le titre en haut
  const tour = [P[0], P[1], P[3], P[2]], d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const essais = [0, 1, 2, 3].map(k => { const t = i => tour[(i + k) % 4], coins = [t(0), t(1), t(3), t(2)], Hm = homographie(REPERES, coins); let n = 0;
    for (let i = 0; i < 60; i++) for (let j = 0; j < 6; j++) { const [u, v] = Hm(24 + i * 1.8, 12 + j * 1.2).map(Math.round); if (u >= 0 && v >= 0 && u < W && v < H) n += 255 - gris[v * W + u]; } // l'encre du titre
    return { coins, n, debout: d(coins[0], coins[1]) < d(coins[0], coins[2]) }; });
  const bons = essais.filter(x => x.debout); return (bons.length ? bons : essais).sort((a, b) => b.n - a.n)[0].coins;
}
function lireImage(source, Q) { // source : image ou canevas ; renvoie les ronds cochés
  const k = Math.min(1, 2200 / Math.max(source.width, source.height)), c = document.createElement('canvas'); c.width = Math.round(source.width * k); c.height = Math.round(source.height * k);
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(source, 0, 0, c.width, c.height);

function tracer() { // la photo, avec un cercle sur chaque rond : plein = lu comme coché

  $('rep').innerHTML = lu.G.map((g, i) => g.ronds.length ? `<div class="${lu.coche[i].some(Boolean) ? '' : 'vide'}"><b>${g.e.n}${g.e.t === 'multi' ? '*' : ''}</b><span>${h(g.e.q)}</span><p>${g.ronds.map((_, j) => `<button type="button" data-r="${i},${j}" aria-pressed="${lu.coche[i][j]}" title="${h(g.e.t === 'echelle' ? j + 1 + ' sur 5' : g.e.o[j])}">${etiq(g.e, j)}</button>`).join('')}</p></div>` : '').join('');
  const n = lu.coche.filter((l, i) => l.some(Boolean) || (lu.txt[i] || '').trim()).length;
  $('etat').textContent = (lu.trouve ? '' : 'Je ne trouve pas les quatre ronds noirs des coins : faites glisser les quatre poignées orange dessus. ') + `${n} question${n > 1 ? 's' : ''} lue${n > 1 ? 's' : ''} sur ${lu.G.length}. Les ronds lus comme cochés sont entourés en bleu : corrigez-les en cliquant sur la photo ou dans la liste dessous.`;

// les avis libres : la machine ne lit pas l'écriture à la main. On montre le morceau de photo, et on recopie à côté.
// shortcut: pas de lecture automatique de l'écriture (il faudrait envoyer la photo à un service extérieur, alors que la page promet de ne l'envoyer nulle part) ; à revoir si l'équipe l'accepte.
function zonesTexte() {
  const z = $('textes'); if (!z) return;
  z.innerHTML = lu.G.map((g, i) => { if (g.e.t !== 'texte') return '';
    const coins = [[g.x + 8, g.y + g.h - 17], [g.x + LCOL - 7, g.y + g.h - 17], [g.x + 8, g.y + g.h - 1], [g.x + LCOL - 7, g.y + g.h - 1]].map(([x, y]) => lu.H(x, y));

    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(hh)); c.getContext('2d').drawImage(lu.image, x0, y0, w, hh, 0, 0, c.width, c.height);

function lignes() { // les réponses lues, au même format que celles des téléphones
  const qui = 'S' + ($('seance').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '') || 'papier') + '-P' + (Math.max(1, Math.floor(+$('numero').value)) || 1);

function vueLire() {

    <label class="btn noir" style="align-self:flex-start">Photographier ou choisir une photo<input type="file" accept="image/*" capture="environment" hidden id="fichier"></label>
    <p class="etat" id="etat">Aucune photo pour l'instant. La lecture se fait dans ce navigateur, la photo n'est envoyée nulle part.</p>
    <canvas id="photo" width="10" height="10" hidden></canvas>
    <div class="regl" id="regl" hidden><b>Décaler les cercles</b><button class="btn" data-d="-1,0" aria-label="Vers la gauche">←</button><button class="btn" data-d="0,-1" aria-label="Vers le haut">↑</button><button class="btn" data-d="0,1" aria-label="Vers le bas">↓</button><button class="btn" data-d="1,0" aria-label="Vers la droite">→</button><button class="btn" data-d="0">Remettre en place</button><button class="btn" id="vider">Tout décocher</button></div>
    <div class="rep" id="rep" hidden></div>
    <div class="textes" id="textes" hidden></div>
    <div class="regl"><button class="btn noir" id="envoyer" disabled>Enregistrer dans le Google Sheet</button>${QUI() ? '<a class="btn" href="https://docs.google.com/spreadsheets/d/14uvOfNQwjgMOH83hJhnWea9Df3Cidhhs4rUefRrQ2wk" target="_blank" rel="noopener">Ouvrir le Google Sheet</a>' : ''}</div></div>`;

// ---------- affichage ----------
function dessiner() {
  const Q = QUESTIONS();
  document.querySelectorAll('nav [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === vue));
  $('feuille').textContent = `@page{size:${vue === 'diapos' ? 'A4 landscape' : 'A3 portrait'};margin:0}`;
  $('imprimer').hidden = vue === 'lire';
  $('vue').innerHTML = vue === 'diapos' ? diapos(Q) : vue === 'lire' ? vueLire() : fiche(Q);

document.querySelector('nav').addEventListener('click', ev => { const b = ev.target.closest('[data-v]'); if (b) { vue = b.dataset.v; lu = null; dessiner(); } });
$('imprimer').addEventListener('click', () => print());
$('vue').addEventListener('change', ev => {
  if (ev.target.id !== 'fichier' || !ev.target.files[0]) return;
  const img = new Image(); $('etat').textContent = 'Lecture de la photo…';

  img.onerror = () => { $('etat').textContent = "Ce fichier n'est pas une photo lisible (essayez en JPEG ou PNG)."; };
  img.src = URL.createObjectURL(ev.target.files[0]); ev.target.value = '';
});
$('vue').addEventListener('input', ev => { const i = ev.target.dataset.txt; if (i != null && lu) { lu.txt[i] = ev.target.value; tracer(); } }); // ce qu'on recopie d'une réponse écrite
// corriger une réponse : sur la photo ou dans la liste, un clic inverse le rond (un seul rond par question, sauf les questions à astérisque)
const basculer = (i, j) => { const coche = !lu.coche[i][j]; if (coche && lu.G[i].e.t !== 'multi') lu.coche[i] = lu.coche[i].map(() => false); lu.coche[i][j] = coche; tracer(); };

$('vue').addEventListener('click', ev => {
  const r = ev.target.closest('[data-r]'); if (r && lu) { const [i, j] = r.dataset.r.split(',').map(Number); basculer(i, j); const b = document.querySelector(`[data-r="${i},${j}"]`); if (b) b.focus(); }
