<head>

<title>Points de vue · séance</title>

<style>@font-face{font-family:'Scoutie Sans';font-weight:200 800;font-display:swap;src:url(polices/scoutie.woff2) format('woff2')}</style>
<style>
:root{--n:#141414;--c1:#F5A0C6;--c2:#F7C33B;--c3:#1F6FE0;--c4:#7BD3A8;--c5:#B79CF2;--c6:#FF9A6B;--t1:#FDE7F1;--t2:#FDF0CC;--t3:#DCE9FB;--t4:#DDF4E8;--t5:#EBE3FB;--t6:#FFE4D6;--c:var(--c1);--t:var(--t1)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#fff;color:var(--n);font-family:'Scoutie Sans',Helvetica,Arial,sans-serif;font-size:20px;line-height:1.25;-webkit-tap-highlight-color:transparent}
body.p1{--c:var(--c1);--t:var(--t1)} body.p2{--c:var(--c2);--t:var(--t2)} body.p3{--c:var(--c3);--t:var(--t3)} body.p4{--c:var(--c4);--t:var(--t4)} body.p5{--c:var(--c5);--t:var(--t5)} body.p6{--c:var(--c6);--t:var(--t6)}
button,input,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none;padding:0}
h1{margin:0;font-weight:800;letter-spacing:-.05em;line-height:.9}
p{margin:0}

/* les têtes : un cercle, deux yeux qui bougent et clignent */
.tete{width:1em;height:1em;border-radius:50%;background:var(--c);position:relative;flex:none;display:block}
.yeux{position:absolute;left:50%;top:50%;display:flex;gap:.065em;transform:translate(calc(-50% + var(--rx,0em)),calc(-50% + var(--ry,0em))) rotate(var(--rot,0deg));transition:transform 2.6s cubic-bezier(.45,0,.25,1)}
.yeux i{display:block;width:.085em;height:.085em;border-radius:50%;background:var(--n);transition:transform .16s cubic-bezier(.2,.7,.3,1)}
.yeux.clin i{transform:scale(1.12,.1);transition:transform .07s ease-in}
@keyframes flotte{from{transform:translate(-1%,.6%) scale(1)}to{transform:translate(1%,-1%) scale(1.02)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* le fond : trois cercles qui se rentrent dedans */
#fond{position:fixed;inset:0;overflow:hidden;background:#fff;z-index:0}
.blob{position:absolute;left:50%;top:50%;font-size:40vmin;margin:-.5em;mix-blend-mode:multiply;transition:transform 1.8s cubic-bezier(.45,0,.2,1);will-change:transform}
.blob .tete{animation:flotte 9s ease-in-out infinite alternate}
.blob:nth-child(2) .tete{animation-duration:11s}.blob:nth-child(3) .tete{animation-duration:8s}
#app{position:relative;z-index:1}
.sur{font-weight:700}
.btn{display:inline-block;background:var(--n);color:#fff;font-weight:800;border-radius:99px;padding:.8em 1.4em;text-align:center;cursor:pointer}

/* accueil du site */
.site{min-height:100vh;min-height:100dvh;max-width:1100px;margin:0 auto;padding:26vh 22px 60px;display:flex;flex-direction:column;gap:18px}
.site h1{font-size:clamp(44px,7vw,92px)}
.trois{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
.trois a{background:var(--t);color:var(--n);text-decoration:none;border-radius:32px;padding:26px 24px 30px;display:flex;flex-direction:column;gap:10px;min-height:250px;transition:transform .2s cubic-bezier(.45,0,.2,1),background .2s}
.trois a:hover,.trois a:focus-visible{transform:translateY(-4px);outline:3px solid var(--n);outline-offset:3px}
.trois .tete{font-size:64px;margin-bottom:auto}
.trois .yeux{font-size:1em;gap:.08em}.trois .yeux i{width:.13em;height:.13em}
.trois b{font-size:32px;line-height:1;font-weight:800;letter-spacing:-.04em}
.trois span{font-size:18px}
.tel a,.site a{color:inherit}
@media (max-width:760px){.site{padding-top:24vh}.trois{grid-template-columns:1fr}.trois a{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center}.trois .tete{font-size:48px;margin:0}.trois b{flex:1}.trois span{flex-basis:100%}}

/* téléphone */
.tel{min-height:100vh;min-height:100dvh;padding:104px 22px 70px;display:flex;flex-direction:column;gap:20px;max-width:560px;margin:0 auto}
.tel h1{font-size:54px}
.tel h2{margin:0;font-size:31px;line-height:1.05;font-weight:800;letter-spacing:-.03em}
.tel .haut{height:12vh;flex:none}
.tel.fixe{gap:12px;padding-top:22px;padding-bottom:44px}
.tel.fixe .haut{height:21vh}
.tel.fixe h1{font-size:46px}
.tel.fixe p{font-size:18px}
.tel .btn{display:block;width:100%;min-height:64px;font-size:22px;border-radius:32px;transition:transform .15s}
.tel .btn:active{transform:scale(.97)}
.tel .lab{font-weight:800;font-size:20px;margin:6px 0 -6px;display:block}
.tel .champ{min-height:64px;font-weight:700}
.tel .champ:focus,.tel .btn:focus-visible,.tel .opt:focus-visible{outline:3px solid var(--c3);outline-offset:3px}
.tel .code{text-align:center;font-size:28px;letter-spacing:.45em;padding:8px 0 8px .45em;font-weight:800}
.tel .bloc{display:flex;flex-direction:column;gap:12px}
.tel small{font-weight:400;font-size:.75em}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{background:var(--t);border-radius:28px;padding:18px 22px;font-size:22px;font-weight:700;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;transition:background .25s,transform .15s}
.opt:active{transform:scale(.97)}
.opt.on{background:var(--c)} body.p3 .opt.on{color:#fff}
.opt .tete{font-size:34px;background:#fff;display:none}.opt.on .tete{display:block;animation:pop .4s}
.champ{background:var(--t);border:0;border-radius:28px;padding:18px 22px;font-size:22px;width:100%;outline-offset:3px}
textarea.champ{min-height:150px;resize:none}
.echelle{display:flex;align-items:center;justify-content:space-between}
.echelle button{border-radius:50%;background:var(--t);font-weight:800;font-size:22px;transition:background .25s}
.echelle button.on{background:var(--c)}
.bouts{display:flex;justify-content:space-between;font-size:17px}
.ab{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.ab button{width:42vw;max-width:230px;aspect-ratio:1;border-radius:50%;font-size:80px;font-weight:800;letter-spacing:-.05em;transition:transform .2s}
.ab button:first-child{background:var(--c1)}.ab button:nth-child(2){background:var(--c3);color:#fff}.ab button:nth-child(3){background:var(--c2)}.ab button:nth-child(4){background:#141414;color:#fff}
.ab.n3 button,.ab.n4 button{width:36vw;max-width:170px;font-size:60px}
.ab button:active{transform:scale(1.08)}
.note{font-size:.85em}
.fait{display:flex;flex-direction:column;gap:18px;align-items:flex-start;margin-top:8vh}
.fait .tete{font-size:96px;animation:pop .5s}
.lien{font-weight:700;text-decoration:underline;font-size:18px}
.etapes{display:flex;flex-direction:column;gap:16px}
.etapes div{display:flex;gap:14px;align-items:center}
.etapes svg{width:56px;flex:none}
.etapes b{display:block;font-size:22px;letter-spacing:-.02em}
#statut{position:fixed;left:0;right:0;bottom:0;padding:10px 22px;font-size:15px;background:#fff;z-index:2}
#statut:empty{display:none}
.apercu{width:100%;border-radius:28px;display:block}
/* en ligne, chez soi : les affiches sont sur la page, on les touche pour les agrandir */
.tel .zones{display:block;margin:4px 0 4px 30px}.tel .zones img{width:100%;border-radius:20px}.tel .z{border-radius:12px}.tel .z b{border-radius:10px 0 0 10px;font-size:15px}
.droite .zones img{max-height:calc(74vh*var(--ka,1))}.droite .z{border-width:.25vw;border-radius:.8vw;cursor:inherit}.droite .z b{border-radius:.8vw 0 0 .8vw;font-size:1.3vw;top:-.25vw;white-space:nowrap}
.vue .zones{display:block}.vue .zones img{max-height:none}.droite .vz{width:min(calc(36vw*var(--ka,1)),calc(72vh*var(--ka,1)*var(--r)))}
.vue{display:flex;gap:12px}
.vue figure{margin:0;flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:26px;cursor:zoom-in}
.vue img{width:100%;max-height:58vh;object-fit:contain;object-position:left top;border-radius:20px;display:block}
.vue figure.zoom{position:fixed;inset:0;z-index:6;background:#fff;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.vue figure.zoom img{max-height:90vh;width:auto;max-width:100%;object-position:center}
.flash.seul{flex-direction:column;gap:3vh}
.flash.seul img{max-width:94vw;max-height:78vh}
.flash.seul .tete{font-size:10vh}

/* grand écran */
.ecran{height:100vh;padding:5vh 4vw 5vh;position:relative;display:flex;flex-direction:column;overflow:hidden;font-size:clamp(18px,1.7vw,34px)}
.ecran h1{font-size:calc(clamp(34px,4.3vw,92px)*var(--kt,1)*var(--fit,1))}html.petitTitre .ecran h1{font-size:calc(clamp(34px,4.3vw,92px)*.66*var(--kt,1)*var(--fit,1))}
.barre{position:absolute;top:2.5vh;left:4vw;right:4vw;display:flex;justify-content:space-between;align-items:flex-start;gap:2vw;font-size:.7em}
.gens{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.5vw;max-width:45vw}
.gens .tete{font-size:2vw;opacity:.35;animation:pop .5s;transition:opacity .3s,transform .3s}
.gens .tete.ok{opacity:1;transform:translateY(-.5vw)}
.corps{flex:1;display:flex;gap:3vw;min-height:0;margin-top:3vh}
.gauche{flex:1;min-width:0;display:flex;flex-direction:column;gap:2.2vh}
.gauche>h1{max-width:60vw}.gauche>p{max-width:26em}
.droite{flex:none;display:flex;gap:1.5vw;align-items:center}
.droite img,.flash img{max-height:100%;max-width:calc(36vw*var(--ka,1));border-radius:1.5vw;display:block}
.droite.deux img{max-width:calc(25vw*var(--ka,1))}.droite.n3 img{max-width:calc(18vw*var(--ka,1))}.droite.n4 img{max-width:calc(14vw*var(--ka,1))}
/* les logos : en bas à droite, sur l'accueil et la fin seulement (rien d'autre n'occupe ce coin sur ces deux écrans) */
.logosG{position:fixed;right:4vw;bottom:4vh;display:none;gap:2vw;align-items:center;z-index:1;pointer-events:none}.logosG img{height:8vh;max-width:18vw;object-fit:contain}html.logos .logosG{display:flex}
.droite figure{font-size:1.2em;cursor:zoom-in}
.droite figure.zoom{position:fixed;inset:0;z-index:6;background:#fff;align-items:center;padding:3vh;cursor:zoom-out;height:auto}.droite figure.zoom img{max-width:92vw;max-height:88vh}
.droite figure img{min-height:0;flex:0 1 auto;max-height:calc(100% - 2.4em)}
.nb img{filter:grayscale(1)}
.droite figure{margin:0;height:100%;display:flex;flex-direction:column;gap:.6vw;font-weight:800;justify-content:center}
.cpt{font-weight:800;font-size:1.3em;letter-spacing:-.02em}
.accord{display:flex;align-items:center;gap:1.5vw}
.trio{position:relative;width:7.2vw;height:6.4vw;flex:none;isolation:isolate}
.trio .tete{position:absolute;left:2.1vw;top:2vw;font-size:3vw;mix-blend-mode:multiply;transition:transform 2s cubic-bezier(.45,0,.2,1)}
.trio .tete:nth-child(1){transform:translate(0,-2vw)}.trio .tete:nth-child(2){transform:translate(1.73vw,1vw)}.trio .tete:nth-child(3){transform:translate(-1.73vw,1vw)}
.res{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end}
.cols{display:flex}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.5vh;font-size:.8em;line-height:1.1;padding:0 .4vw}
.col>span{overflow-wrap:anywhere;hyphens:auto}
.col .rond{height:26vh;display:flex;align-items:flex-end;justify-content:center;width:100%}
.liste{display:grid;grid-template-columns:1fr 1fr;gap:1vh 2.5vw}
.liste .col{flex-direction:row;text-align:left;gap:1vw;font-size:1.05em;padding:0}
.liste .rond{width:8vh;height:8vh;flex:none;align-items:center}
.liste .col b{width:1.3em;flex:none;text-align:right}
.col .tete{transition:font-size 1.4s cubic-bezier(.45,0,.2,1);font-size:2vh}
.col b{font-size:1.9em;letter-spacing:-.04em}
.col.bon>span{font-weight:800;background:var(--n);color:#fff;border-radius:99px;padding:.25em .8em}
.mots{display:flex;flex-wrap:wrap;gap:.7vw;align-content:flex-start;overflow:hidden;flex:1}
.mots span{background:var(--t);border-radius:1.4em;padding:.45em .9em;font-weight:700;animation:pop .45s}
.mots span:nth-child(3n+1){background:var(--t1)}.mots span:nth-child(3n+2){background:var(--t2)}.mots span:nth-child(3n){background:var(--t3)}
.scores{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);gap:1.4vh 4vw;align-content:start;margin-top:1vh}
.sc{display:flex;align-items:center;gap:1vw;font-weight:700;min-width:0}
.sc .tete{font-size:2.2vw}
.sc>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{display:flex;gap:.35vw}
.pts i,.pt{width:1vw;height:1vw;border-radius:50%;background:var(--t2);flex:none;display:block}
.pts i.o,.pt.o{background:var(--n)}
.pt{width:22px;height:22px}
.sc.bilan{grid-column:1/-1;flex-direction:column;align-items:flex-start;gap:.3vh;font-weight:400;margin-top:1vh}
.salle{display:flex;flex-wrap:wrap;gap:1vh 1.4vw;max-width:48vw;font-size:.8em;font-weight:700}
.salle span:not(.tete):not(.yeux){display:flex;align-items:center;gap:.5vw}
.salle .tete{font-size:2.2vw}
.lettres{display:grid;grid-template-columns:repeat(var(--k),1fr);gap:.45em;font-size:1.05em;font-weight:800;line-height:1.05}
.lettres span{background:var(--t);border-radius:1.2em;padding:.5em .7em;display:flex;gap:.6em;align-items:center;min-height:2.9em}
.lettres.ab span:first-child{background:var(--c1)}.lettres.ab span:nth-child(2){background:var(--c3);color:#fff}
.lettres b{color:#141414;flex:none;width:1.75em;height:1.75em;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.15em;font-weight:800}
.qr{display:flex;align-items:center;gap:1.6vw;margin-top:auto;font-weight:700}
.qr svg{width:15vw;height:15vw;display:block;background:#fff;flex:none}
.qr .code{font-size:2.6em;font-weight:800;letter-spacing:.04em;vertical-align:middle}
.flash{position:fixed;inset:0;z-index:5;background:#fff;display:flex;align-items:center;justify-content:center;gap:4vw;padding:3vh 4vh}
.flash img{max-width:70vw}
.flash .tete{font-size:16vh;animation:fond5 5s linear forwards}
@keyframes fond5{to{transform:scale(0)}}
.mur{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(17vw,1fr));gap:1.5vw;align-content:start;overflow:auto}
.mur figure{margin:0;animation:pop .6s;font-size:.7em;font-weight:700;cursor:zoom-in}
.mur img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:2vw;display:block;margin-bottom:.6em}
.palm figure{font-size:.85em;font-weight:400;line-height:1.2}.palm figure b{font-weight:800}
.mur figure.zoom{position:fixed;inset:0;z-index:6;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;padding:3vh;cursor:zoom-out;font-size:1em;animation:none}
.mur figure.zoom img{width:auto;max-width:100%;height:86vh;aspect-ratio:auto;object-fit:contain}
.cmd{position:fixed;left:1vw;bottom:1vh;z-index:7;font-size:13px;font-weight:700}
.cmd .home{opacity:.22;padding:6px 10px;transition:opacity .2s}
.cmd .home:hover,.cmd.ouvert .home{opacity:1}
.cmd .liste{display:none;position:absolute;left:0;bottom:100%;flex-direction:column;align-items:flex-start;gap:12px;white-space:nowrap;background:#fff;color:var(--n);border-radius:18px;padding:16px 20px;box-shadow:0 4px 24px rgba(20,20,20,.2)}
.cmd.ouvert .liste{display:flex}
.cmd .liste button,.cmd .liste label,.cmd .liste a{cursor:pointer;text-decoration:underline;color:inherit}
.cmd .autres{white-space:normal;max-width:36em;font-weight:400}
.auto{position:fixed;right:1.5vw;bottom:1.4vh;z-index:7;font-size:13px;font-weight:700;opacity:.5}
body.plein.p3 #app{color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="fond">
<div class="blob" style="--c:var(--c1)"><span class="tete"><span class="yeux"><i></i><i></i></span></span></div>
<div class="blob" style="--c:var(--c2)"><span class="tete"><span class="yeux"><i></i><i></i></span></span></div>
<div class="blob" style="--c:var(--c3)"><span class="tete"><span class="yeux"><i></i><i></i></span></span></div>
</div>
<main id="app"></main>
<div id="statut"></div>
<script src="seance.js"></script>
<script>
// ---------- outils ----------
const P = new URLSearchParams(location.search);
const ECRAN = P.has('ecran');
const APERCU = P.has('apercu'); // ouvert depuis « Modifier le test » : la séance vient de l'éditeur, pas du fichier en ligne
const PAPIER = ECRAN && P.has('papier'); // séance sur papier : le grand écran montre les affiches et les questions, chacun répond sur sa fiche A3
// chaque séance a son code à 4 chiffres : le grand écran le crée et l'affiche (QR code + chiffres), le téléphone le reçoit par le QR code ou le tape
const nouveauCode = () => String(1000 + Math.random() * 9000 | 0);
let code = P.get('salle');
if (ECRAN && !code) { try { code = localStorage.getItem('pdvCode' + TEST) || nouveauCode(); localStorage.setItem('pdvCode' + TEST, code); } catch (e) { code = nouveauCode(); } }
// un aperçu ouvert depuis l'éditeur a son propre code, qui commence par 0 (les vraies séances vont de 1000 à 9999) : un téléphone peut y entrer pour essayer
if (ECRAN && APERCU) { const neuf = '0' + String(Math.random()).slice(2, 5); try { code = sessionStorage.getItem('pdvAp'); if (!code) { sessionStorage.setItem('pdvAp', code = neuf); localStorage.removeItem(code + 'pdvSeance'); } } catch (e) { code = neuf; } }
const SALLE = (code || '').replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 12);
const HOTE = 'pointsdevue-gtm-' + SALLE;
const SHEET = SCRIPT_GOOGLE;
// les séances en cours : chaque grand écran donne signe de vie toutes les 30 secondes, la liste oublie une séance après 2 minutes de silence
const seancesEnCours = () => fetch(SHEET).then(x => x.json()).then(l => (Array.isArray(l) ? l : []).filter(x => /^[a-z0-9]{1,12}$/.test(x.code))).catch(() => []);
const libelle = x => `${x.n} participant${x.n > 1 ? 's' : ''} · écran ${x.i} sur ${x.total}`;
const app = document.getElementById('app');
const h = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/ ([?!:;»])/g, '&nbsp;$1').replace(/« /g, '«&nbsp;');
// les participants ont leurs propres couleurs, différentes des trois couleurs du logo
const COUL = ['#F08A4B', '#57B894', '#9C8CF0', '#4CC3D9', '#EE6B5B', '#B7D25A', '#E7A0E8', '#F2B880', '#6ED0A6', '#C9A0DC', '#8FB8F7', '#E58FA0', '#A8C7A0', '#D9A066', '#7FD1C7'];
const tete = (c, extra = '') => `<span class="tete ${extra}" style="--c:${typeof c === 'number' ? `var(--c${c})` : c}"><span class="yeux"><i></i><i></i></span></span>`;
const lire = (k, d) => { try { return JSON.parse(localStorage.getItem(SALLE + k)) || d; } catch (e) { return d; } };
const ecrire = (k, v) => { try { localStorage.setItem(SALLE + k, JSON.stringify(v)); } catch (e) { /* stockage plein : la séance continue en mémoire */ } };
const sur = e => e.p ? `Étape ${e.p} · ${h(PHASES[e.p].nom)}` : e.jeu || e.img ? "Le jeu de l'œil" : 'Atelier';
const JEUX = () => ETAPES.filter(e => e.bon != null);
let mission = 0; // l'information de l'atelier, la même pour tous (la première de la liste par défaut)
let sous = 0; // pendant l'étape « vote » : numéro de l'affiche × 10 + numéro du test
// la question réellement posée : l'étape elle-même, ou le test en cours pour l'affiche en cours
const Q = e => { if (e.t !== 'vote') return e; const k = sous / 10 | 0, j = sous % 10; return { ...(TESTS[j] || TESTS[0]), id: 'vote' + k + '_' + (TESTS[j] ? j : 0), vote: true, k }; };
const genre = e => Q(e).t;
const ident = e => Q(e).id;
function reduire(file, max) {
  return new Promise(ok => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); ok(c.toDataURL('image/jpeg', .72));
    };
    img.src = URL.createObjectURL(file);
  });
}
// ---------- les cercles du fond ----------
let courant = 0, coin = false;
function placer() {
  const W = innerWidth, H = innerHeight, D = Math.min(W, H) * .4, e = ETAPES[courant], n = courant;
  const B = [...document.querySelectorAll('.blob')];
  const set = (k, x, y, s) => B[k].style.transform = `translate(${x}px,${y}px) scale(${s})`;
  B.forEach(b => delete b.dataset.fixe);
  document.body.className = (e.p ? 'p' + e.p : '') + (e.t === 'phase' ? ' plein' : '');
  if (e.t === 'accueil' || e.t === 'fin') { // les trois cercles forment le logo
    const s = ECRAN ? 1.5 : .8, r = D * s / 2, x = ECRAN ? W * .2 : W * .06, y = ECRAN ? -H * .06 : -H * .36;
    set(0, x, y, s); set(1, x + 1.05 * r, y - .2 * r, s * .7); set(2, x + .75 * r, y + .8 * r, s * .55); return;
  }
  const a = e.p ? e.p - 1 : n % 3, autres = [0, 1, 2].filter(k => k !== a);
  if (e.t === 'phase') { // le cercle de l'étape zoome jusqu'à remplir l'écran
    const g = 1.5 * Math.hypot(W, H); set(a, 0, 0, g / D); B[a].dataset.fixe = (ECRAN ? .25 * W : .06 * W) / g + ',' + (ECRAN ? .22 * H : .36 * H) / g;
    set(autres[0], W * .36, -H * .34, .55); set(autres[1], W * .43, -H * .16, .35); return;
  }
  const PR = ECRAN ? [[.36, .12, 1.9], [.4, -.3, 1.5], [.33, .34, 1.7], [.43, .02, 1.3]] : [[.3, -.5, 1.2], [.36, -.5, 1], [.22, -.5, 1.3], [.4, -.5, 1.1]];
  const [fx, fy, s] = coin ? [.49, .44, .6] : PR[n % 4], x = fx * W, y = fy * H, r = D * s / 2;
  set(a, x, y, s);
  autres.forEach((k, j) => { // plus ou moins rentrés dans le grand cercle
    const ang = ECRAN || coin ? n * 1.3 + j * 2.4 : j * Math.PI, d = r * (.55 + ((n * 7 + j * 3) % 5) * .13);
    set(k, x + Math.cos(ang) * d, y + Math.sin(ang) * d, s * (.3 + ((n + j) % 3) * .12));
  });
}
let souris = null;
function regards() {
  // l'affiche et les résultats d'abord ; à défaut, le titre
  let cibles = [...document.querySelectorAll('.droite img, .flash img, .vue img, .mur img, .cols, .mots, .scores, .qr svg, .opts, .echelle, .apercu')];
  if (!cibles.length) cibles = [...document.querySelectorAll('#app h1, #app h2')];
  cibles = cibles.map(c => c.getBoundingClientRect()).filter(c => c.width && c.height);
  document.querySelectorAll('.yeux').forEach(y => {
    const [hx, hy, hr] = chezSoi(y);
    let ux = 0, uy = 0; // direction du regard : un petit décalage autour de la place des yeux
    const fixe = y.closest('[data-fixe]');
    if (fixe) { const [fx, fy] = fixe.dataset.fixe.split(','); y.style.setProperty('--rx', fx + 'em'); y.style.setProperty('--ry', fy + 'em'); y.style.setProperty('--rot', '0deg'); return; }
    if (!souris && y.style.getPropertyValue('--rx') && Math.random() < .55) return; // chacun son rythme : pas tous en même temps
    const vers = (x, yy) => { const b = y.parentNode.getBoundingClientRect(), dx = x - b.left - b.width / 2, dy = yy - b.top - b.height / 2, d = Math.hypot(dx, dy) || 1; ux = dx / d; uy = dy / d; };
    if (souris) vers(souris[0], souris[1]); // les yeux suivent la souris
    else if (cibles.length && Math.random() < .75) { // le plus souvent, ils regardent l'affiche ou les résultats
      const c = cibles[Math.random() * cibles.length | 0]; vers(c.left + c.width * (.3 + Math.random() * .4), c.top + c.height * (.3 + Math.random() * .4));
    } else { const a = Math.random() * 6.283; ux = Math.cos(a); uy = Math.sin(a); }
    if (y.style.getPropertyValue('--rx') && Math.random() < .25) cligner(y); // on cligne souvent en changeant de regard
    y.style.setProperty('--rx', hx + ux * .05 + 'em'); y.style.setProperty('--ry', hy + uy * .05 + 'em'); y.style.setProperty('--rot', hr + 'deg');
  });
}
// la place des yeux : celle du logo pour les trois personnages du fond ; pour les autres têtes, une place à eux, comme sur les fiches de Coline
const maison = new WeakMap(), prochain = new WeakMap();
function chezSoi(y) {
  let m = maison.get(y);
  if (!m) {
    const b = y.closest('.blob'), i = b ? [...b.parentNode.children].indexOf(b) : -1, a = Math.random() * 6.283, d = .1 + Math.random() * .16;
    m = i >= 0 ? [[-.2, -.14, -9], [.21, -.23, 11], [.07, .3, 0]][i] : [Math.cos(a) * d, Math.sin(a) * d, [0, 0, 0, -12, 12, 90][Math.random() * 6 | 0]];
    maison.set(y, m);
  }
  return m;
}
// le clignement : fermeture vive, ouverture plus lente, à un rythme irrégulier, parfois deux fois de suite
function cligner(y, deux) { y.classList.add('clin'); setTimeout(() => { y.classList.remove('clin'); if (deux) setTimeout(() => cligner(y), 190); }, 110); }
setInterval(() => {
  const t = Date.now();
  document.querySelectorAll('.yeux').forEach(y => {
    const p = prochain.get(y);
    if (p === undefined) return prochain.set(y, t + 600 + Math.random() * 4000);
    if (t >= p) { cligner(y, Math.random() < .18); prochain.set(y, t + 2400 + Math.random() * 5200); }
  });
}, 200);
setInterval(regards, 3800);
let finSouris;
addEventListener('pointermove', e => { souris = [e.clientX, e.clientY]; clearTimeout(finSouris); finSouris = setTimeout(() => souris = null, 2500); });

// ================= TÉLÉPHONE =================
function telephone() {
  let mes = lire('pdvMoi', null) || { pid: Math.random().toString(36).slice(2, 10), nom: '', sid: '', rep: {} };
  let peer, lien = null, minuteur, cle = '', photo = null, connu = false, vu = Date.now();
  const garder = () => ecrire('pdvMoi', mes);
  const statut = () => document.getElementById('statut').textContent = !SALLE ? '' : lien ? (ETAPES[courant].t === 'accueil' ? 'Vous êtes connecté à la séance.' : '') : connu ? 'Connexion à la séance…' : "La séance n'a pas encore commencé. Cette page se mettra à jour toute seule.";

  function brancher() {
    clearTimeout(minuteur);
    if (peer) peer.destroy();
    const p = peer = new Peer();
    const perdu = () => { if (p !== peer) return; lien = null; statut(); clearTimeout(minuteur); minuteur = setTimeout(brancher, 3000); };
    p.on('open', () => {
      const c = p.connect(HOTE, { reliable: true });
      let premier = true;
      c.on('open', () => { if (p !== peer) return; lien = c; vu = Date.now(); c.send({ k: 'salut', pid: mes.pid, nom: mes.inscrit ? mes.nom : '' }); statut(); });
      c.on('data', d => {
        if (d.k === 'seance' && SALLE[0] === '0' && typeof d.x === 'string' && d.x) { // seulement dans un aperçu (code en 0…) : une vraie séance ne change jamais de test sur un message // aperçu de l'éditeur : le grand écran donne sa version du test, le téléphone se recharge dessus
          try { if (APERCU && localStorage.getItem('pdvApercu') === d.x) return; localStorage.setItem('pdvApercu', d.x); } catch (e) { return; }
          return location.replace('?salle=' + SALLE + '&apercu');
        }
        if (d.k === 'etat') {
          const dt = String(d.t || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 40); if (dt !== TEST && !APERCU) return location.replace('?salle=' + SALLE + (dt ? '&test=' + dt : '')); // le grand écran passe un autre test que celui chargé ici
          connu = true; vu = Date.now();
          if (d.sid !== mes.sid) { mes.sid = d.sid; mes.rep = {}; mes.inscrit = false; garder(); }
          else if (premier) for (const id in mes.rep) c.send({ k: 'rep', id, v: mes.rep[id] }); // réponses données hors connexion
          premier = false; courant = ETAPES[d.i] ? d.i : 0; sous = d.n >= 0 && d.n < 999 ? d.n | 0 : 0; if (MISSIONS[d.m] && d.m !== mission) { mission = d.m; cle = ''; } dessiner();
        }
        if (d.k === 'photo-ok' && photo) { photo.etat = 'ok'; dessiner(true); }
      });
      c.on('close', perdu); c.on('error', perdu);
    });
    p.on('error', perdu); p.on('disconnected', perdu);
  }
  // l'écran redit l'étape en cours toutes les 3 secondes : sans nouvelles depuis 20 secondes, on se rebranche
  const muet = () => Date.now() - vu > 20000;
  document.addEventListener('visibilitychange', () => { if (!document.hidden && (!lien || muet())) brancher(); });
  setInterval(() => { if (lien && muet() && !document.hidden) brancher(); }, 4000);

  function salons() { // sans code : une séance en cours = un gros bouton pour entrer ; plusieurs = on choisit ; aucune = on attend
    seancesEnCours().then(l => {
      const z = document.getElementById('salons'); if (!z) return;
      z.innerHTML = l.length === 1 ? `<button class="btn" data-s="${h(l[0].code)}">Entrer dans la séance</button><p class="note">Séance ${h(l[0].code)} · ${h(libelle(l[0]))}</p>`
        : l.length ? `<p class="lab">Choisissez votre séance</p><div class="opts">${l.map(x => `<button class="opt" data-s="${h(x.code)}"><span>Séance ${h(x.code)}<br><small>${h(libelle(x))}</small></span></button>`).join('')}</div>`
        : `<p><b>La séance n'a pas encore commencé.</b></p><p class="note">Cette page se met à jour toute seule, vous n'avez rien à faire.</p>`;
    });
  }
  if (!SALLE) setInterval(salons, 10000);

  function repondre(id, v) { mes.rep[id] = v; garder(); if (lien) lien.send({ k: 'rep', id, v }); dessiner(); }

  function dessiner(force) {
    const e = ETAPES[courant], q = Q(e), t = q.t, id = q.id, v = id ? mes.rep[id] : null;
    const k = courant + '|' + sous + '|' + JSON.stringify(v ?? null) + '|' + !!mes.inscrit;
    if (k === cle && !force) return;
    cle = k; placer(); scrollTo(0, 0);
    let x = '';
    if (e.t === 'accueil') x = `<div class="haut"></div><h1>Bienvenue !</h1>
      <p><b>Vous participez à une recherche pour converger vers l'affiche la plus intéressante.</b></p>` + (!SALLE
        // sans code : on propose la séance en cours (un seul appui), et le code à 4 chiffres en secours
        ? `<div id="salons" class="bloc"><p>Recherche de la séance…</p></div>
           <label class="lab" for="code">Vous avez un code à 4 chiffres ?</label><input class="champ code" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off" aria-describedby="aide">
           <p class="note" id="aide">Il est écrit sur le grand écran.</p>
           <p class="note"><a href="?ecran${TQ}">Animer une séance sur le grand écran</a> · <a href="./" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="1.35em" height="1.35em" fill="currentColor" aria-hidden="true" style="vertical-align:-.3em"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg></a></p>`
        : mes.inscrit ? `<div class="fait" style="margin-top:0">${tete(1)}<h2>${mes.nom ? h(mes.nom) + ', vous êtes inscrit.' : 'Vous êtes inscrit.'}</h2><p>Gardez ce téléphone en main et regardez le grand écran : la séance va commencer.</p></div>`
        : `<label class="lab" for="nom">Votre prénom</label><input class="champ" id="nom" maxlength="24" value="${h(mes.nom)}" autocomplete="given-name" autocapitalize="words" enterkeyhint="done">
           <button class="btn" data-a="inscrire">Je m'inscris</button><p class="note">Séance ${h(SALLE)}. Il n'y a pas de bonne ou de mauvaise réponse. Votre prénom s'affiche sur le grand écran, il n'est pas enregistré avec vos réponses. <a href="confidentialite.html">Vos données</a></p>`);
    else if (e.t === 'phase') x = `<div class="haut"></div><p class="sur">Étape ${e.p}</p><h1>${h(PHASES[e.p].nom)}</h1><p><b>${h(PHASES[e.p].quoi)}</b></p>`;
    else if (e.t === 'info') x = `<div class="haut"></div><p class="sur">${h(e.s)}</p><h1>${h(e.h)}</h1><p><b>${h(e.x)}</b></p>`;
    else if (e.t === 'scores') {
      const J = JEUX(), ok = J.map(j => mes.rep[j.id] === j.bon);
      x = `<p class="sur">Le jeu de l'œil · vos réussites</p><h1>${ok.filter(Boolean).length} sur ${J.length}</h1>
        <div class="etapes">${J.map((j, i) => `<div><span class="pt${ok[i] ? ' o' : ''}"></span><span>${h(j.q)}<br><b>${h(j.o[j.bon])}</b></span></div>`).join('')}</div>
        <p class="note">Ce qui n'a pas été trouvé, c'est ce que l'affiche montre mal.</p>`;
    }
    else if (e.t === 'flash') x = `<div class="haut"></div><h1>Levez les yeux</h1><p><b>L'affiche va apparaître ${e.s || 5} secondes sur le grand écran. Regardez-la comme si vous la croisiez dans la rue.</b></p>`;
    else if (e.t === 'fin') x = `<div class="haut"></div><h1>Merci !</h1><p><b>Vos observations vont servir à retravailler l'affiche.</b></p><p>Nous vous montrerons ce qu'elles ont changé.</p>`;
    else if (e.t === 'mission') x = `<p class="sur">Atelier · à deux</p><h2>Fabriquez l'affiche qui fait le mieux passer cette information :</h2><h1 style="font-size:40px;line-height:1">${h(MISSIONS[mission])}</h1>
      <p>Servez-vous des modules sur la table : slogans, formes, illustrations, dates. Toute la salle a la même information, chaque binôme fait son affiche.</p>`;
    else if (e.t === 'palmares') x = `<div class="haut"></div><h1>Le palmarès</h1><p><b>Les résultats de vos affiches sont sur le grand écran.</b></p>`;
    else if (e.t === 'photo') {
      x = `<p class="sur">Atelier</p><h2>Photographiez l'affiche de votre binôme.</h2><p class="note">L'information à faire passer : ${h(MISSIONS[mission])}</p>`;
      if (!photo) x += `<p>Elle s'affichera sur le grand écran, puis la salle la testera.</p><label class="btn">Prendre une photo<input type="file" accept="image/*" capture="environment" hidden id="prise"></label>`;
      else if (photo.etat === 'ok') x += `<div class="fait">${tete(1 + courant % 3)}<p><b>Votre photo est sur le grand écran.</b></p><button class="lien" data-a="autre">Refaire la photo</button></div>`;
      else x += `<img class="apercu" src="${photo.img}" alt="Votre photo"><input class="champ" id="mot" maxlength="80" placeholder="Le nom de votre binôme (facultatif)">

    else if (v != null) x = `<p class="sur">${sur(e)}</p><div class="fait">${tete(e.p || 1 + sous % 3)}<h2>C'est noté.</h2><p>Les réponses de la salle arrivent sur le grand écran.</p></div>`;
    else {
      x = `<p class="sur">${sur(e)}</p><h2>${h(q.q)}</h2>${q.vote ? `<p class="note">Affiche ${q.k + 1}, sur le grand écran.</p>` : q.note ? `<p class="note">${h(q.note)}</p>` : ''}`;
      if (t === 'texte') x += `<textarea class="champ" id="txt" maxlength="200" placeholder="Votre réponse"></textarea><button class="btn" data-a="texte">Valider</button>`;
      if (q.zones) x += carteZones(q, q.imgs[0]) + `<p class="note">Touchez ${t === 'multi' ? 'les zones, puis Valider' : 'une zone de l\'affiche'}. ${legendeZones(q)}</p>` + (t === 'multi' ? `<button class="btn" data-a="multi">Valider</button>` : '');

      if (t === 'echelle') x += `<div class="echelle">${q.o.map((o, i) => `<button data-o="${i}" style="width:${36 + i * 11}px;height:${36 + i * 11}px">${o}</button>`).join('')}</div><div class="bouts"><span>${h(q.a)}</span><span>${h(q.b)}</span></div>`;
      if (t === 'ab') x += `<p class="note">Regardez les ${e.o.length - 1} affiches.</p><div class="ab n${e.o.length - 1}">${e.o.slice(0, -1).map((l, i) => `<button data-o="${i}">${l}</button>`).join('')}</div><div class="opts"><button class="opt" data-o="${e.o.length - 1}">${h(e.o[e.o.length - 1])}${tete(e.p)}</button></div>`;

  app.addEventListener('click', ev => {
    const sl = ev.target.closest('[data-s]'); if (sl) return location.search = '?salle=' + sl.dataset.s;
    const e = ETAPES[courant], id = ident(e), o = ev.target.closest('[data-o]'), a = ev.target.closest('[data-a]');

}

// ================= EN LIGNE, CHEZ SOI =================
// Le lien envoyé par mail aux habitants (?enligne) : chacun passe le test seul, à son rythme, et voit les affiches sur sa page.
// Les réponses partent dans l'onglet Données du Google Sheet comme celles d'une séance, sous la séance « ligne ».
// L'atelier en binômes (mission, photos, tests, palmarès) n'a pas de sens seul : il est sauté. ?enligne&essai : rien n'est enregistré.
function enLigne() {
  const ESSAI = P.has('essai'), SAUTE = ['accueil', 'mission', 'photo', 'vote', 'palmares'];
  const neuf = () => ({ pid: Math.random().toString(36).slice(2, 8), nom: '', parti: false, i: 0, v: VERSION, rep: {}, file: [] });
  let M = lire('pdvEnLigne', null) || neuf(), pris = false;
  if (APERCU && P.get('e')) M.i = Math.max(0, Math.min(ETAPES.length - 1, +P.get('e') || 0)); // « Prévisualiser » de l'éditeur ouvre directement l'écran qu'on était en train de modifier
  // shortcut: si le test change entre deux visites, la personne reprend au début (ses réponses déjà parties restent dans le Sheet), à revoir si on modifie le test pendant l'envoi des mails
  if (M.v !== VERSION) { M.i = 0; M.v = VERSION; }
  const garder = () => ecrire('pdvEnLigne', M);
  const QS = ETAPES.filter(e => e.id && !SAUTE.includes(e.t));
  const ligne = (e, v) => ['Sligne' + TEST.replace(/-/g, '') + '-P' + M.pid, '', e.p ? 'Étape ' + e.p : "Jeu de l'œil", e.q, e.t === 'echelle' ? `${v + 1} sur 5` : e.o ? [].concat(v).map(x => e.o[x]).join(' | ') : v, e.t === 'echelle' ? v + 1 : '', VERSION];
  // les réponses attendent dans le navigateur jusqu'à ce qu'internet les ait prises : rien ne se perd si la connexion coupe
  let envoi = false;
  const envoyer = fin => {
    if (ESSAI) M.file = [];
    if (envoi || !M.file.length) return statut();
    const lot = M.file.slice(0, 200); envoi = true;
    fetch(SHEET, { method: 'POST', mode: 'no-cors', keepalive: !!fin, body: JSON.stringify(lot) })
      .then(() => { M.file = M.file.slice(lot.length); garder(); }).catch(() => { }).finally(() => { envoi = false; statut(); });
  };
  const statut = () => {
    document.getElementById('statut').textContent = ESSAI ? 'Essai : les réponses ne sont pas enregistrées.' : M.file.length && !navigator.onLine ? 'Pas de connexion internet : vos réponses partiront dès son retour.' : '';
    const z = document.getElementById('envoi'); if (z) z.textContent = M.file.length ? 'Envoi de vos réponses…' : 'Vos réponses sont bien enregistrées. Vous pouvez fermer cette page.';
  };
  setInterval(envoyer, 3000); addEventListener('pagehide', () => envoyer(true)); addEventListener('online', () => envoyer());
  const aller = i => { while (ETAPES[i] && SAUTE.includes(ETAPES[i].t)) i++; M.i = i; garder(); dessiner(); };
  const repondre = (e, v) => { M.rep[e.id] = v; M.file.push(ligne(e, v)); aller(M.i + 1); envoyer(); };
  const suite = '<button class="btn" data-a="suite">Continuer</button>';
  const vue = (e, srcs) => srcs.length ? `<div class="vue${e.nb ? ' nb' : ''}">${srcs.map((s, k) => `<figure>${e.t === 'ab' ? 'ABCD'[k] : ''}${cadree(e) ? afficheCadree(e, s) : `<img src="${h(s)}" alt="${e.t === 'ab' ? 'Affiche ' + 'ABCD'[k] : 'L\'affiche'}">`}</figure>`).join('')}</div><p class="note">Touchez une affiche pour l'agrandir.</p>` : '';

  function dessiner() {
    const e = !M.parti ? { t: 'accueil' } : ETAPES[M.i] || { t: 'fin' }, ou = t => Math.max(0, ETAPES.findIndex(y => y.t === t));
    courant = e.t === 'accueil' || e.t === 'fin' ? ou(e.t) : M.i; pris = false; placer(); scrollTo(0, 0);
    let x = '';
    if (e.t === 'accueil') x = `<div class="haut"></div><h1>Bonjour !</h1>
      <p><b>Le groupe Points de vue fait tester des affiches de santé de Granville Terre et Mer par des habitants. Votre regard nous aide à les rendre plus claires.</b></p>
      <p>Vous allez voir quelques affiches, puis répondre en touchant les réponses : ${QS.length} questions, environ ${Math.max(5, Math.round(QS.length / 3))} minutes. Il n'y a pas de bonne ou de mauvaise réponse. Si quelque chose n'est pas clair, c'est l'affiche qui est en cause, pas vous.</p>
      <label class="lab" for="nom">Votre prénom <small>(si vous le souhaitez)</small></label><input class="champ" id="nom" maxlength="24" value="${h(M.nom)}" autocomplete="given-name" autocapitalize="words" enterkeyhint="go">
      <button class="btn" data-a="partir">${M.i ? 'Reprendre le test' : 'Commencer'}</button>
      <p class="note">Vos réponses sont anonymes : votre prénom n'est pas enregistré avec elles. Vous pouvez vous arrêter et reprendre plus tard sur cet appareil. <a href="confidentialite.html">Vos données</a></p>`;
    else if (e.t === 'phase') x = `<div class="haut"></div><p class="sur">Étape ${e.p}</p><h1>${h(PHASES[e.p].nom)}</h1><p><b>${h(PHASES[e.p].quoi)}</b></p>${suite}`;
    else if (e.t === 'info') x = `<div class="haut"></div><p class="sur">${h(e.s)}</p><h1>${h(e.h)}</h1><p><b>${h(e.x)}</b></p>${vue(e, (e.imgs || []).filter(Boolean))}${suite}`;
    else if (e.t === 'flash') x = `<div class="haut"></div><p class="sur">${sur(e)}</p><h1>Une affiche, ${e.s || 5} secondes</h1><p><b>Regardez-la comme si vous la croisiez dans la rue. Elle disparaît toute seule, puis viennent les questions.</b></p><button class="btn" data-a="voir">Voir l'affiche</button>`;
    else if (e.t === 'scores') {
      const J = JEUX(), ok = J.map(j => M.rep[j.id] === j.bon);
      x = `<p class="sur">Le jeu de l'œil · vos réussites</p><h1>${ok.filter(Boolean).length} sur ${J.length}</h1>
        <div class="etapes">${J.map((j, i) => `<div><span class="pt${ok[i] ? ' o' : ''}"></span><span>${h(j.q)}<br><b>${h(j.o[j.bon])}</b></span></div>`).join('')}</div>
        <p class="note">Ce que vous n'avez pas trouvé, c'est ce que l'affiche montre mal.</p>${suite}`;
    }
    else if (e.t === 'fin') x = `<div class="haut"></div><h1>Merci !</h1><p><b>Vos observations vont servir à retravailler les affiches.</b></p><p id="envoi"></p>
      <button class="lien" data-a="autre">Une autre personne veut répondre sur cet appareil</button>`;
    else {
      x = `<p class="sur">${sur(e)} · question ${QS.indexOf(e) + 1} sur ${QS.length}</p><h2>${h(e.q)}</h2>${e.note ? `<p class="note">${h(e.note)}</p>` : ''}${vue(e, e.jeu || e.zones ? [] : (e.imgs || []).filter(Boolean))}`;
      if (e.t === 'texte') x += `<textarea class="champ" id="txt" maxlength="200" placeholder="Votre réponse"></textarea><button class="btn" data-a="texte">Valider</button><button class="lien" data-a="suite">Passer cette question</button>`;
      if (e.zones) x += carteZones(e, e.imgs[0]) + `<p class="note">Touchez ${e.t === 'multi' ? 'les zones, puis Valider' : 'une zone de l\'affiche'}. ${legendeZones(e)}</p>` + (e.t === 'multi' ? `<button class="btn" data-a="multi">Valider</button>` : '');
      else if (e.t === 'choix' || e.t === 'multi') x += `<div class="opts">${e.o.map((o, i) => `<button class="opt" data-o="${i}">${h(o)}${tete(e.p || 1)}</button>`).join('')}</div>`;
      if (e.t === 'multi' && !e.zones) x += `<p class="note">Plusieurs réponses possibles.</p><button class="btn" data-a="multi">Valider</button>`;
      if (e.t === 'echelle') x += `<div class="echelle">${e.o.map((o, i) => `<button data-o="${i}" style="width:${36 + i * 11}px;height:${36 + i * 11}px">${o}</button>`).join('')}</div><div class="bouts"><span>${h(e.a)}</span><span>${h(e.b)}</span></div>`;
      if (e.t === 'ab') x += `<div class="ab n${e.o.length - 1}">${e.o.slice(0, -1).map((l, i) => `<button data-o="${i}">${l}</button>`).join('')}</div><div class="opts"><button class="opt" data-o="${e.o.length - 1}">${h(e.o[e.o.length - 1])}${tete(e.p || 1)}</button></div>`;
    }
    app.innerHTML = `<div class="tel${e.t === 'accueil' ? ' fixe' : ''}">${x}</div>`;
    [ETAPES[M.i], ETAPES[M.i + 1]].filter(Boolean).forEach(z => [...(z.imgs || []), z.img].filter(Boolean).forEach(u => { new Image().src = u; })); // l'affiche à venir est prête avant qu'on y arrive
    regards(); statut();
  }
  function montrer(e) { // l'affiche plein écran : les 5 secondes ne comptent qu'une fois l'image chargée
    const d = document.createElement('div'); d.className = 'flash seul';
    d.innerHTML = `<img src="${h(e.img)}" alt="L'affiche à regarder">`; document.body.appendChild(d);
    let parti = false;
    const img = d.querySelector('img'), go = () => { if (parti) return; parti = true; d.insertAdjacentHTML('beforeend', tete(e.p || 1)); setTimeout(() => { d.remove(); aller(M.i + 1); }, (e.s || 5) * 1000); };
    if (img.complete) go(); else { img.onload = img.onerror = go; setTimeout(go, 8000); } // connexion lente : on n'attend pas indéfiniment la fin du chargement
  }
  app.addEventListener('click', ev => {
    const f = ev.target.closest('.vue figure'); if (f) return f.classList.toggle('zoom');
    const e = ETAPES[M.i], o = ev.target.closest('[data-o]'), a = ev.target.closest('[data-a]');
    if (o && e.t === 'multi') return o.classList.toggle('on');
    if (o) { if (pris) return; pris = true; o.classList.add('on'); return setTimeout(() => repondre(e, +o.dataset.o), 350); } // un double appui ne répond pas à la question suivante

    if (act === 'partir') { M.nom = document.getElementById('nom').value.trim().slice(0, 24); M.parti = true; aller(M.i); }

    if (act === 'multi') { const v = [...app.querySelectorAll('[data-o].on')].map(b => +b.dataset.o); if (v.length) repondre(e, v); }
    if (act === 'texte') { const v = document.getElementById('txt').value.trim(); if (v) repondre(e, v); }
    if (act === 'autre') { const file = M.file; M = neuf(); M.file = file; garder(); dessiner(); }
  });
  app.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'nom') { ev.preventDefault(); app.querySelector('[data-a=partir]').click(); } });
  if (!ESSAI) declarerVersion();
  dessiner(); envoyer();

// ================= GRAND ÉCRAN =================
function ecran() {
  const neuve = () => ({ sid: Math.random().toString(36).slice(2, 8), i: 0, k: 0, rev: false, gens: {}, rep: {}, mission: 0, photos: [] });
  let S = lire('pdvSeance', null) || neuve();
  if (APERCU && P.get('e')) S.i = Math.max(0, Math.min(ETAPES.length - 1, +P.get('e') || 0)); // « Prévisualiser » de l'éditeur ouvre directement l'écran qu'on était en train de modifier
  S.photos = lire('pdvPhotos', []); sous = S.k = S.k || 0; mission = S.mission = MISSIONS[S.mission] ? S.mission : 0; if (!ETAPES[S.i]) S.i = 0;
  let affiches = lire('pdvAffiches', {}), conns = new Set(), cle = '', flash = false, souci = '', masque = false, tm, tAuto = 0;
  const garder = () => { const { photos, ...reste } = S; ecrire('pdvSeance', reste); ecrire('pdvPhotos', photos); };
  const diffuser = () => conns.forEach(c => c.open && c.send({ k: 'etat', sid: S.sid, i: S.i, n: S.k, m: S.mission, t: TEST }));
  const enLigne = () => new Set([...conns].filter(c => c.open && c.pid).map(c => c.pid));
  const texte = (s, n) => String(s ?? '').trim().slice(0, n);
  // des nappes douces, façon chœur lointain, fabriquées par le navigateur : aucun fichier, aucune musique existante
  let ac;
  const son = (notes, att, dur, vol) => {
    if (S.son === false) return;
    try {
      ac = ac || new AudioContext(); const t = ac.currentTime, g = ac.createGain(), f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 1800; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      f.connect(g).connect(ac.destination);
      notes.forEach(n => [-6, 0, 6].forEach(d => { const o = ac.createOscillator(); o.type = d ? 'sine' : 'triangle'; o.frequency.value = n; o.detune.value = d; o.connect(f); o.start(t); o.stop(t + dur); }));
    } catch (e) { /* pas de son : la séance continue */ }
  };
  // chaque nappe est tirée au hasard : une note de départ grave, un accord ouvert parmi plusieurs, une durée qui varie
  const nappe = (voix, vol) => {
    const base = [130.8, 146.8, 164.8, 174.6, 196][Math.random() * 5 | 0], formes = [[0, 7, 12, 15, 19], [0, 7, 12, 16, 19], [0, 5, 12, 17, 19], [0, 7, 14, 19, 24], [0, 7, 10, 15, 19], [0, 12, 19, 24, 28]];
    son(formes[Math.random() * formes.length | 0].slice(0, voix).map(d => base * 2 ** (d / 12)), .4 + Math.random() * .6, 3 + Math.random() * 1.6, vol);
  };
  const SONS = { suite: () => nappe(2, .04), revele: () => nappe(5, .045), trouve: () => nappe(5, .045) };
  const trouver = id => { const m = /^vote(\d{1,2})_(\d)$/.exec(id); return m ? TESTS[m[2]] && { ...TESTS[m[2]], voteK: +m[1] } : ETAPES.find(e => e.id && e.t !== 'vote' && e.id === id); };
  const QH = Q, NUM = Object.fromEntries(QUESTIONS().map(e => [e.id, e.n])); // le numéro de chaque question, le même que sur la fiche A3
  const bilan = k => { // résultats d'une affiche de binôme : part de la salle qui a retrouvé l'idée, moyenne des notes
    const notes = TESTS.flatMap((t, j) => t.t === 'echelle' ? Object.values(S.rep['vote' + k + '_' + j] || {}) : []);
    return { note: notes.length ? notes.reduce((a, v) => a + v + 1, 0) / notes.length : null };
  };

  const peer = new Peer(HOTE);
  peer.on('connection', c => {
    c.on('open', () => { conns.add(c); if (APERCU) c.send({ k: 'seance', x: localStorage.getItem('pdvApercu') || '' }); c.send({ k: 'etat', sid: S.sid, i: S.i, n: S.k, m: S.mission, t: TEST }); });
    c.on('close', () => { conns.delete(c); maj(); });
    c.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (d.k === 'salut') { c.pid = texte(d.pid, 20); S.gens[c.pid] = { nom: texte(d.nom, 24), n: S.gens[c.pid] ? S.gens[c.pid].n : Object.keys(S.gens).length }; }
      if (!c.pid) return;
      if (d.k === 'rep') {
        const e = trouver(d.id); if (!e) return;
        const bon = x => Number.isInteger(x) && x >= 0 && x < e.o.length, t = e.t;
        const v = t === 'texte' ? texte(d.v, 200) : t === 'multi' ? (Array.isArray(d.v) ? d.v.filter(bon) : []) : bon(d.v) ? d.v : null;
        if (v == null || v.length === 0) return;
        const dejaR = S.rep[d.id] = S.rep[d.id] || {};
        if (!(c.pid in dejaR)) { dejaR[c.pid] = v; noter(ligneRep(d.id, c.pid, v)); } // une réponse donnée ne se change plus
      }
      if (d.k === 'photo' && typeof d.img === 'string' && d.img.length < 900000 && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(d.img)) {
        const dej = S.photos.findIndex(p => p.pid === c.pid), ph = { img: d.img, mot: texte(d.mot, 80), pid: c.pid };
        if (dej >= 0 && ETAPES[S.i].t === 'photo') S.photos[dej] = ph; else { S.photos.push(ph); noter(lignePhoto(ph, S.photos.length - 1)); } // refaire sa photo la remplace
        c.send({ k: 'photo-ok' }); cle = '';
      }
      garder(); cle ? maj() : dessiner();
    });
  });
  peer.on('disconnected', () => peer.reconnect());
  const vus = new Map(); // pid -> dernier moment où le téléphone était connecté
  setInterval(() => { diffuser(); enLigne().forEach(pid => vus.set(pid, Date.now())); if (ETAPES[S.i].id && cle) maj(); }, 3000); // redit l'étape en cours : un téléphone qui a raté un message se remet à la page
  peer.on('error', e => { souci = e.type === 'unavailable-id' ? 'Le grand écran est déjà ouvert dans une autre fenêtre.' : e.type === 'network' || e.type === 'server-error' ? 'Pas de connexion internet.' : souci; dessiner(true); });

  function aller(i, sens = 1) {
    while (ETAPES[i] && (PAPIER ? ['scores', 'photo', 'vote', 'palmares'].includes(ETAPES[i].t) : (ETAPES[i].t === 'vote' || ETAPES[i].t === 'palmares') && !S.photos.length)) i += sens; // pas de photo : rien à tester ; sur papier, pas d'écran qui dépend des téléphones
    S.i = Math.max(0, Math.min(ETAPES.length - 1, i)); sous = S.k = 0; S.rev = false; flash = false; garder(); diffuser(); dessiner(); SONS.suite();
  }
  function suivant() {
    const e = ETAPES[S.i], id = ident(e);
    if (e.t === 'flash' && !flash) return montrer();
    if (id && !S.rev && Object.keys(S.rep[id] || {}).length) { S.rev = true; garder(); QH(e).bon != null ? SONS.trouve() : SONS.revele(); return dessiner(); }
    if (e.t === 'vote') { // test suivant, puis affiche suivante
      const k = S.k / 10 | 0, j = S.k % 10;
      if (j < TESTS.length - 1) S.k++; else if (k < S.photos.length - 1) S.k = (k + 1) * 10; else return aller(S.i + 1);
      sous = S.k; S.rev = false; garder(); diffuser(); return dessiner();
    }
    aller(S.i + 1);
  }
  function montrer() { flash = true; dessiner(true); setTimeout(() => { if (flash && ETAPES[S.i].t === 'flash') aller(S.i + 1); }, (ETAPES[S.i].s || 5) * 1000); }

  // tout doit tenir sur l'écran : si la question et ses réponses débordent, le texte rétrécit par petits pas jusqu'à ce que tout rentre
  function tenir() {
    const ec = app.querySelector('.ecran'), g = ec && ec.querySelector('.gauche'); if (!g) return;
    ec.style.fontSize = ''; ec.style.setProperty('--fit', 1); const f = parseFloat(getComputedStyle(ec).fontSize);
    for (let n = 0, k = 1; n < 14 && g.scrollHeight > g.clientHeight + 2; n++) { k *= .94; ec.style.fontSize = f * k + 'px'; ec.style.setProperty('--fit', k); }
  }
  function dessiner(force) {
    setTimeout(tenir, 0);
    document.documentElement.classList.toggle('petitTitre', !!ETAPES[S.i].petit); // le réglage « titre plus petit » de l'éditeur
    const e = ETAPES[S.i], k = S.i + '|' + S.k + '|' + S.rev;
    document.documentElement.classList.toggle('logos', LOGOS.length > 0 && (e.t === 'accueil' || e.t === 'fin')); // les logos : sur l'écran d'accueil et sur l'écran de fin seulement
    const lgs = document.querySelector('.logosG'); if (lgs) document.documentElement.style.setProperty('--lw', lgs.offsetWidth + 18 + 'px'); // leur largeur, pour décaler la ligne d'infos
    if (k === cle && !force) return maj();
    if (k !== cle) { masque = false; clearTimeout(tm); clearTimeout(tAuto); tAuto = 0; }
    cle = k; courant = S.i;
    const q = QH(e);
    const im = (e.imgs || []).filter(Boolean);
    const vues = im.map((src, i) => ({ l: im.length > 1 ? 'ABCD'[i] : '', src: im.length === 1 && e.p && affiches.A ? affiches.A : src })); // une affiche chargée à la main remplace celle de l'étape
    coin = S.rev || vues.length > 0 || ['scores', 'photo', 'flash', 'vote', 'palmares'].includes(e.t);
    placer();
    const url = location.origin + location.pathname + '?salle=' + SALLE + TQ;
    let g = '', d = '';
    if (e.t === 'accueil' && PAPIER) g = `<p class="sur">Points de vue · habitants testeurs</p><h1>Bienvenue !</h1><p><b>Vous participez à une recherche pour converger vers l'affiche la plus intéressante.</b></p>
        <p class="cpt">Séance ${h(SALLE)}</p><p style="max-width:19em">Prenez votre fiche et un stylo. En haut de la fiche, écrivez la séance <b>${h(SALLE)}</b> et votre numéro de participant.</p>
        <p style="max-width:19em">Chaque question porte un numéro : sur la ligne du même numéro, noircissez le rond de votre réponse.</p>
        <p style="margin-top:auto"><a href="papier.html${TQ ? '?' + TQ.slice(1) : ''}" target="_blank" rel="noopener">Imprimer les fiches A3</a> · <a href="papier.html?vue=lire&seance=${h(SALLE)}${TQ}" target="_blank" rel="noopener">Photographier les fiches remplies</a></p>`;
    else if (e.t === 'accueil') {
      const q = qrcode(0, 'M'); q.addData(url); q.make();
      g = `<p class="sur">Points de vue · habitants testeurs</p><h1>Bienvenue !</h1><p><b>Vous participez à une recherche pour converger vers l'affiche la plus intéressante.</b></p>
        <p class="cpt"></p><div class="salle"></div>
        <div class="qr">${q.createSvgTag({ scalable: true, margin: 0 })}<span>Pour répondre depuis votre téléphone, photographiez ce code.<br>Ou ouvrez ${h(location.host + location.pathname)}<br>et tapez le code <b class="code">${h(SALLE)}</b></span></div>`;
    }
    else if (e.t === 'phase') g = `<p class="sur">Étape ${e.p} sur ${NB_ETAPES()}</p><h1>${h(PHASES[e.p].nom)}</h1><p><b>${h(PHASES[e.p].quoi)}</b></p>`;
    else if (e.t === 'info') g = `<p class="sur">${h(e.s)}</p><h1>${h(e.h)}</h1><p><b>${h(e.x)}</b></p>`;
    else if (e.t === 'scores') g = `<p class="sur">Le jeu de l'œil</p><h1>Les réussites</h1><p><b>Un point noir par question trouvée, dans l'ordre des questions.</b></p><div class="scores"></div>`;
    else if (e.t === 'flash') g = flash
      ? `<div class="flash">${e.img || affiches.A ? `<img src="${(e.p && affiches.A) || e.img || affiches.A}" alt="Affiche testée">` : '<h1>Regardez l\'affiche</h1>'}${tete(1)}</div>`
      : `<p class="sur">${sur(e)}</p><h1>Le test des ${e.s || 5} secondes</h1><p><b>L'affiche va apparaître ${e.s || 5} secondes. Regardez-la comme si vous la croisiez dans la rue.</b></p>`;
    else if (e.t === 'fin') g = `<h1>Merci !</h1><p><b>Vos observations vont servir à retravailler l'affiche.</b></p><p>Nous vous montrerons ce qu'elles ont changé.</p>${PAPIER || APERCU ? '' : `<p style="margin-top:auto"><a href="resultats.html?seance=${h(SALLE)}&pdf${TQ}" target="_blank" rel="noopener">Récupérer la restitution de cette séance en PDF</a></p>`}`;
    else if (e.t === 'mission') g = `<p class="sur">Atelier · à deux</p><h1>Fabriquez l'affiche qui fait le mieux passer cette information</h1><p class="cpt" style="font-size:2em">${h(MISSIONS[S.mission])}</p><p>Servez-vous des modules sur la table : slogans, formes, illustrations, dates. Toute la salle a la même information, chaque binôme fait son affiche. La salle les testera ensuite.</p><p><button data-a="mission" style="text-decoration:underline;font-weight:700">Changer d'information</button></p>`;
    else if (e.t === 'photo') g = `<p class="sur">Atelier</p><h1>Vos affiches</h1><p><b>Photographiez l'affiche de votre binôme : elle apparaît ici.</b></p><div class="mur"></div>`;
    else if (e.t === 'palmares') g = `<p class="sur">Atelier</p><h1>Le palmarès</h1><p><b>L'affiche qui transmet le mieux l'information, d'après vos notes.</b></p><div class="mur palm"></div>`;
    else {
      const cache = q.cinq && masque && !S.rev;
      g = `<p class="sur">${sur(e)}${PAPIER && NUM[q.id] ? ' · question ' + NUM[q.id] : ''}${q.vote ? ` · affiche ${q.k + 1} sur ${S.photos.length} · test ${S.k % 10 + 1} sur ${TESTS.length}` : ''}</p><h1>${h(q.q)}</h1>${cache ? "<p>L'affiche revient avec les réponses.</p>" : q.note ? `<p>${h(q.note)}</p>` : ''}<div class="accord">${S.rev && q.t !== 'texte' ? `<div class="trio">${tete(1)}${tete(2)}${tete(3)}</div>` : ''}<p class="cpt"></p></div><div class="res">${PAPIER ? (q.t === 'texte' ? '<p><b>Écrivez votre réponse sur la fiche.</b></p>' : `<div class="lettres${q.t === 'ab' ? ' ab' : ''}" style="--k:${q.t === 'echelle' ? 5 : q.o.length === 2 || q.o.length === 4 ? 2 : 3}">${q.o.map((o, i) => `<span><b>${q.t === 'echelle' ? i + 1 : q.t === 'ab' && i === q.o.length - 1 ? '=' : 'ABCDEFGHIJ'[i]}</b>${q.t === 'echelle' ? h(i === 0 ? q.a : i === 4 ? q.b : '') : q.t === 'ab' && i < q.o.length - 1 ? '' : h(o)}</span>`).join('')}</div>`)
        : !S.rev ? '' : q.t === 'texte' ? '<div class="mots"></div>'
        : `<div class="cols${q.o.length > 5 ? ' liste' : ''}">${q.o.map((o, i) => `<div class="col"><div class="rond">${tete(1 + i % 3)}</div><b>0</b><span>${h(o)}${q.t === 'echelle' && (i === 0 || i === 4) ? '<br>' + h(i ? q.b : q.a) : ''}</span></div>`).join('')}</div>`}</div>`;
      if (q.vote && S.photos[q.k] && !cache) d = `<div class="droite"><figure><img src="${S.photos[q.k].img}" alt="Affiche d'un binôme">${h(S.photos[q.k].mot)}</figure></div>`;
      if (q.cinq && !S.rev && !masque) { clearTimeout(tm); tm = setTimeout(() => { masque = true; dessiner(true); }, 5000); } // vue 5 secondes, puis cachée
      if (e.img && S.rev) d = `<div class="droite"><figure><img src="${e.img}" alt="Affiche du jeu"></figure></div>`;
    }
    if (vues.length) d = `<div class="droite${vues.length > 1 ? ' deux n' + vues.length : ''}${e.nb ? ' nb' : ''}">${vues.map(v => `<figure>${v.l}${e.zones ? carteZones(e, v.src) : cadree(e) ? afficheCadree(e, v.src) : `<img src="${v.src}" alt="Affiche ${v.l}">`}</figure>`).join('')}</div>`; // aussi pour une page de texte qui a une image
    const prete = q.id && !S.rev && Object.keys(S.rep[q.id] || {}).length;
    app.innerHTML = `<div class="ecran"><div class="barre"><span class="sur">${h(souci || (APERCU ? 'Aperçu de vos modifications · flèches du clavier pour avancer · sans enregistrement' : ''))}</span><div class="gens"></div></div><div class="corps"><div class="gauche">${g}</div>${d}</div></div>
      <div class="cmd"><button class="home" data-a="menu">Menu</button><div class="liste">
        <span>Écran ${S.i + 1} sur ${ETAPES.length}</span>
        <button data-a="suite">${e.t === 'flash' && !flash ? 'Montrer ' + (e.s || 5) + ' secondes' : prete ? 'Révéler les réponses' : 'Suite →'}</button><button data-a="avant">← Retour</button>
        ${PAPIER ? `<a href="papier.html?vue=lire&seance=${h(SALLE)}${TQ}" target="_blank" rel="noopener">Photographier les fiches</a>` : `<a href="resultats.html?seance=${h(SALLE)}${TQ}" target="_blank" rel="noopener">Résultats</a>`}
        <span>Titres <button data-a="t-" aria-label="Titres plus petits">−</button><button data-a="t+" aria-label="Titres plus grands">+</button></span><span>Affiches <button data-a="a-" aria-label="Affiches plus petites">−</button><button data-a="a+" aria-label="Affiches plus grandes">+</button></span>
        <button data-a="auto" title="Quand tout le monde a répondu : révéler les réponses puis passer à la suite sans appuyer">Avance automatique : ${S.auto === true ? 'oui' : 'non'}</button><button data-a="plein">Plein écran</button><button data-a="neuve">Nouvelle séance</button>
        <a href="./" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="1.35em" height="1.35em" fill="currentColor" aria-hidden="true" style="vertical-align:-.3em"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg></a>
      </div></div><span class="auto"></span>`;
    maj(); regards();
    const apres = ETAPES[S.i + 1]; if (apres) [...(apres.imgs || []), apres.img].filter(Boolean).forEach(u => { new Image().src = u; }); // l'affiche de l'écran suivant est déjà là quand on y arrive
  }

  // met à jour les chiffres sans tout redessiner, pour que les cercles grossissent en douceur
  function maj() {
    const e = ETAPES[S.i], q = QH(e), la = enLigne(), rep = q.id ? S.rep[q.id] || {} : {};
    const tous = new Set([...la, ...vus.keys()].filter(pid => S.gens[pid])); // qui a quitté la page (téléphone verrouillé, autre appli) reste dans la séance : il retrouve sa place en revenant
    const gens = app.querySelector('.gens'); if (!gens) return;
    for (const pid of tous) if (!gens.querySelector(`[data-p="${CSS.escape(pid)}"]`)) {
      gens.insertAdjacentHTML('beforeend', tete(COUL[S.gens[pid].n % COUL.length])); gens.lastChild.dataset.p = pid;
    }
    gens.querySelectorAll('[data-p]').forEach(t => { if (!tous.has(t.dataset.p)) t.remove(); else { t.classList.toggle('ok', !q.id || t.dataset.p in rep); t.title = S.gens[t.dataset.p].nom; } });
    const salle = app.querySelector('.salle');
    if (salle) { // la salle d'attente : qui est bien connecté
      app.querySelector('.cpt').textContent = tous.size ? `${tous.size} personne${tous.size > 1 ? 's' : ''} connectée${tous.size > 1 ? 's' : ''}` : 'En attente des téléphones…';
      salle.innerHTML = [...tous].map(pid => `<span>${tete(COUL[S.gens[pid].n % COUL.length])}${h(S.gens[pid].nom || 'Participant ' + (S.gens[pid].n + 1))}</span>`).join('');
    }
    const mur = app.querySelector('.mur');
    if (mur && mur.classList.contains('palm')) { // classement sur la moyenne des cinq notes
      const fr = x => x.toFixed(1).replace('.', ',');
      mur.innerHTML = S.photos.map((p, k) => ({ p, k, ...bilan(k) })).sort((a, b) => (b.note ?? 0) - (a.note ?? 0))
        .map((x, i) => `<figure><img src="${x.p.img}" alt="Affiche d'un binôme"><b>${i + 1}. ${h(x.p.mot || 'Affiche ' + (x.k + 1))}</b><br>${x.note != null ? `Note moyenne : ${fr(x.note)} sur 5` : ''}</figure>`).join('');
    }
    else if (mur) S.photos.slice(mur.children.length).forEach(p => mur.insertAdjacentHTML('beforeend', `<figure><img src="${p.img}" alt="Affiche d'un participant">${h(p.mot)}</figure>`));
    const sc = app.querySelector('.scores');
    if (sc) { // les réussites de chacun, du meilleur score au plus petit
      const J = JEUX(), L = Object.entries(S.gens).map(([pid, g]) => ({ g, ok: J.map(j => (S.rep[j.id] || {})[pid] === j.bon), a: J.some(j => pid in (S.rep[j.id] || {})) }))
        .filter(x => x.a).map(x => ({ ...x, n: x.ok.filter(Boolean).length })).sort((a, b) => b.n - a.n);
      sc.innerHTML = L.map(x => `<div class="sc">${tete(COUL[x.g.n % COUL.length])}<span>${h(x.g.nom || 'Participant ' + (x.g.n + 1))}</span><span class="pts">${x.ok.map(o => `<i${o ? ' class="o"' : ''}></i>`).join('')}</span><b>${x.n} / ${J.length}</b></div>`).join('')
        + `<div class="sc bilan"><span>Par question, part de la salle qui a trouvé :</span><span>${J.map((j, i) => { const v = Object.values(S.rep[j.id] || {}); return `${i + 1}. ${v.length ? Math.round(v.filter(z => z === j.bon).length / v.length * 100) : 0} %`; }).join(' · ')}</span></div>`;
    }
    if (!q.id) return;
    const vals = Object.values(rep), cpt = app.querySelector('.cpt');
    if (PAPIER) { cpt.textContent = NUM[q.id] ? `Sur votre fiche : ligne ${NUM[q.id]}${q.t === 'multi' ? ' · plusieurs réponses possibles' : ''}` : ''; return; }
    cpt.textContent = `${vals.length} réponse${vals.length > 1 ? 's' : ''} sur ${Math.max(tous.size, vals.length)} participant${Math.max(tous.size, vals.length) > 1 ? 's' : ''}`;
    // tout le monde a répondu : les réponses se révèlent seules, puis la séance passe à la suite
    const attendus = new Set([...la, ...[...vus].filter(([, t]) => Date.now() - t < 45000).map(([pid]) => pid)]); // une coupure de quelques secondes ne compte pas comme un départ
    if (S.auto === true && !tAuto && la.size > 0 && [...attendus].every(pid => pid in rep)) {
      const c0 = cle; tAuto = setTimeout(() => { tAuto = 0; if (cle === c0) suivant(); }, S.rev ? 8000 : 1200);
      if (S.rev) app.querySelector('.auto').textContent = 'Suite dans 8 secondes';
    }
    if (!S.rev) return;
    if (q.t === 'texte') { const m = app.querySelector('.mots'); vals.slice(m.children.length).forEach(v => m.insertAdjacentHTML('beforeend', `<span>${h(v)}</span>`)); return; }
    const n = q.o.map(() => 0); vals.forEach(v => [].concat(v).forEach(x => n[x]++));
    app.querySelectorAll('.droite .z').forEach((z, i) => { z.style.setProperty('--f', n[i] / Math.max(1, ...n)); z.querySelector('b').textContent = 'ABCDEFGHIJ'[i] + ' · ' + n[i]; }); // plus une zone est choisie, plus elle se colore
    const max = Math.max(1, ...n), cols = app.querySelectorAll('.col'), rond = cols[0].querySelector('.rond'), base = Math.min(rond.clientWidth, rond.clientHeight) * .9; // jamais superposés
    requestAnimationFrame(() => cols.forEach((c, i) => {
      c.querySelector('.tete').style.fontSize = base * (.16 + .84 * Math.sqrt(n[i] / max)) + 'px';
      c.querySelector('.tete').style.opacity = n[i] ? 1 : .35; c.querySelector('b').textContent = n[i];
    }));
    if (q.bon != null) { cols.forEach((c, i) => c.classList.toggle('bon', i === q.bon)); cpt.textContent = `${n[q.bon]} sur ${vals.length} ${n[q.bon] > 1 ? 'ont' : 'a'} trouvé`; }
    // l'accord de la salle : plus les réponses se rejoignent, plus les trois personnages du logo se superposent
    const top = n.indexOf(Math.max(...n)), acc = vals.length ? n[q.bon ?? top] / vals.length : 0;
    requestAnimationFrame(() => app.querySelectorAll('.trio .tete').forEach((t, k) => {
      const ang = (-90 + 120 * k) * Math.PI / 180, d = (1 - acc) * 3;
      t.style.transform = `translate(${Math.cos(ang) * d}vw,${Math.sin(ang) * d}vw)`;
    }));
    if (q.bon == null && vals.length) cpt.textContent += ` · ${Math.round(acc * 100)} % d'accord : ${q.o[top]}`;
    if (q.t === 'echelle' && vals.length) cpt.textContent += ` · moyenne ${(vals.reduce((a, v) => a + v + 1, 0) / vals.length).toFixed(1).replace('.', ',')} sur 5`;
  }

  // chaque réponse part toute seule vers le Google Sheet de synthèse (onglet Données), par petits paquets toutes les 4 secondes ;
  // ce qui n'a pas pu partir (coupure d'internet) reste en file et repart dès que possible
  const qui = pid => { const g = S.gens[pid] || {}; return ['S' + SALLE + '-P' + (g.n + 1), '']; }; // le prénom reste sur l'écran, il n'est pas enregistré
  const ligneRep = (id, pid, v) => { const e = trouver(id); return e && [...qui(pid), e.p ? 'Étape ' + e.p : e.voteK != null ? 'Atelier' : "Jeu de l'œil", e.voteK != null ? `Affiche ${e.voteK + 1} : ${e.q}` : e.q, e.t === 'echelle' ? `${v + 1} sur 5` : e.o ? [].concat(v).map(x => e.o[x]).join(' | ') : v, e.t === 'echelle' ? v + 1 : '', VERSION]; };
  const lignePhoto = (p, k) => [...qui(p.pid), 'Atelier', `Affiche ${k + 1} : information et binôme`, MISSIONS[S.mission] + (p.mot ? ' (' + p.mot + ')' : ''), '', VERSION];
  const noter = l => { if (l) { (S.file = S.file || []).push(l); garder(); } };
  let envoi = false;
  setInterval(() => {
    if (envoi || APERCU || !S.file || !S.file.length) return; // un aperçu n'enregistre rien
    const lot = S.file.slice(0, 200); envoi = true;
    fetch(SHEET, { method: 'POST', mode: 'no-cors', body: JSON.stringify(lot) })
      .then(() => { S.file = S.file.slice(lot.length); garder(); }).catch(() => { }).finally(() => { envoi = false; });
  }, 4000);

  const annoncer = () => fetch(SHEET, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ seance: { code: SALLE, n: enLigne().size, i: S.i + 1, total: ETAPES.length } }) }).catch(() => { });
  if (!PAPIER && !APERCU) { annoncer(); setInterval(annoncer, 30000); } // une séance sur papier n'attend aucun téléphone
  if (!APERCU) { declarerVersion(); noterVisite(`Grand écran · séance ${SALLE} · ${PAPIER ? 'papier' : 'téléphone'}`); }

  // la taille des titres et des affiches du grand écran se règle dans le Menu (de 50 % à 150 %), et reste d'une séance à l'autre sur cet ordinateur
  const TAILLE = { t: 1, a: 1 }; try { Object.assign(TAILLE, JSON.parse(localStorage.getItem('pdvTailles') || '{}')); } catch (e) { }
  const tailles = () => { document.documentElement.style.setProperty('--kt', +TAILLE.t || 1); document.documentElement.style.setProperty('--ka', +TAILLE.a || 1); }; tailles();
  if (LOGOS.length) { document.body.insertAdjacentHTML('beforeend', '<div class="logosG">' + LOGOS.map(s => '<img src="' + h(s) + '" alt="">').join('') + '</div>');
    const lg = document.querySelector('.logosG'), mes = () => document.documentElement.style.setProperty('--lw', lg.offsetWidth + 18 + 'px'); lg.querySelectorAll('img').forEach(i => i.addEventListener('load', mes)); mes(); addEventListener('resize', mes); } // les logos choisis dans l'éditeur
  document.addEventListener('click', ev => {
    const fig = ev.target.closest('.mur figure, .droite figure'); if (fig) return fig.classList.toggle('zoom');
    const a = ev.target.closest('[data-a]'); if (!a) return;
    const act = a.dataset.a;
    if (act === 'menu') { // à l'ouverture, le menu va chercher les autres séances en cours
      if (a.parentNode.classList.toggle('ouvert')) seancesEnCours().then(l => { const z = app.querySelector('.autres'), autres = l.filter(x => x.code !== SALLE); if (z) z.innerHTML = 'Autres séances en cours : ' + (autres.length
        ? autres.map(x => `<a href="?salle=${h(x.code)}" target="_blank" rel="noopener">${h(x.code)}</a> (${h(libelle(x))})`).join(', ') : 'aucune'); });
      return;
    }
    if (act === 'suite') suivant();
    if (act === 'avant') aller(S.i - 1, -1);
    if (act === 'mission') { mission = S.mission = (S.mission + 1) % MISSIONS.length; garder(); diffuser(); dessiner(true); }
    if (/^[ta][-+]$/.test(act)) { TAILLE[act[0]] = Math.round(Math.max(.5, Math.min(1.5, TAILLE[act[0]] + (act[1] === '+' ? .1 : -.1))) * 10) / 10; tailles(); try { localStorage.setItem('pdvTailles', JSON.stringify(TAILLE)); } catch (e) { } }
    if (act === 'auto') { S.auto = S.auto !== true; clearTimeout(tAuto); tAuto = 0; garder(); dessiner(true); }
    if (act === 'plein') document.documentElement.requestFullscreen();
    if (act === 'neuve' && confirm('Commencer une nouvelle séance ? Les réponses déjà données restent dans le Google Sheet.')) { // une nouvelle séance = un nouveau code et un nouveau QR code ; les affiches A et B chargées sont gardées
      if (!APERCU) journal('Nouvelle séance', 'après la séance ' + SALLE);
      const c = P.get('salle') ? SALLE : nouveauCode();
      try { ['pdvSeance', 'pdvPhotos'].forEach(k => localStorage.removeItem(SALLE + k)); localStorage.setItem(c + 'pdvAffiches', JSON.stringify(affiches)); if (c !== SALLE) { localStorage.removeItem(SALLE + 'pdvAffiches'); localStorage.setItem('pdvCode' + TEST, c); } } catch (e) { }
      location.reload();
    }
  });
  addEventListener('keydown', ev => {
    if (['ArrowRight', 'PageDown', ' '].includes(ev.key)) { ev.preventDefault(); suivant(); }
    if (['ArrowLeft', 'PageUp'].includes(ev.key)) aller(S.i - 1, -1);
    if (ev.key === 'Escape') document.querySelectorAll('figure.zoom').forEach(f => f.classList.remove('zoom'));
  });
  addEventListener('resize', () => dessiner(true));
  dessiner();
}

// les bibliothèques ne sont chargées que si l'écran en a besoin : la liaison entre appareils pour une séance, le QR code pour le grand écran ;
// l'accueil du site et la page sans code n'en chargent aucune. Elles arrivent en même temps que le contenu de la séance.
const lib = src => new Promise((ok, ko) => { const x = document.createElement('script'); x.src = src; x.onload = ok; x.onerror = ko; document.head.appendChild(x); });
const libs = Promise.all([(ECRAN || SALLE) && lib('relais.js'), ECRAN && lib('libs/qrcode.min.js')]).catch(() => { });
// le contenu d'abord (seance.txt, relu à chaque ouverture), puis l'appli
(APERCU ? new Promise(ok => ok(localStorage.getItem('pdvApercu') || '')) : lireFichier()).then(t => lireSeance(t) || Promise.reject())
  .catch(() => { document.getElementById('statut').textContent = 'Le fichier du test (' + FICHIER + ') est introuvable ou vide. Un test tout juste créé arrive sur le site en une à deux minutes.'; })
  .then(() => libs).then(() => ECRAN ? ecran() : P.has('enligne') ? enLigne() : SALLE || P.get('passer') ? telephone() : P.has('passer') ? choixPasser() : accueilSite());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { }); // garde le site en mémoire pour les visites suivantes
</script>
